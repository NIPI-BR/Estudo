<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIPI Línguas — Sistema de Estudo de Idiomas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --petrol:#0E3A45;
    --petrol-2:#134E5E;
    --petrol-soft:#1c6175;
    --gold:#C9A227;
    --gold-soft:#E2C766;
    --bg:#F6F4EE;
    --surface:#FFFFFF;
    --ink:#15282D;
    --ink-soft:#46595e;
    --line:#E4E0D6;
    --ok:#2E7D5B;
    --warn:#C0563A;
    --radius:16px;
    --shadow:0 6px 24px rgba(14,58,69,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'DM Sans',system-ui,sans-serif;
    background:var(--bg);
    color:var(--ink);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{font-family:'DM Serif Display',Georgia,serif;font-weight:400}
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  input,select,textarea{font-family:inherit;font-size:1rem}
  .hidden{display:none!important}

  /* ===== App shell ===== */
  .app{display:flex;flex-direction:column;min-height:100vh}
  header.topbar{
    background:linear-gradient(135deg,var(--petrol),var(--petrol-2));
    color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px;
    position:sticky;top:0;z-index:30;box-shadow:0 2px 14px rgba(0,0,0,.12)
  }
  .brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
  .brand .mark{
    width:34px;height:34px;border-radius:9px;flex:none;
    background:radial-gradient(circle at 30% 30%,var(--gold-soft),var(--gold));
    display:grid;place-items:center;color:var(--petrol);font-family:'DM Serif Display',serif;font-size:18px
  }
  .brand .title{font-family:'DM Serif Display',serif;font-size:1.15rem;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand .sub{font-size:.7rem;opacity:.7;letter-spacing:.14em;text-transform:uppercase}
  .lang-pill{
    background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);
    color:#fff;border-radius:999px;padding:6px 12px;font-size:.85rem;font-weight:500;
    display:flex;align-items:center;gap:6px
  }
  .lang-pill select{background:transparent;border:none;color:#fff;font-weight:600;outline:none}
  .lang-pill select option{color:var(--ink)}

  main{flex:1;width:100%;max-width:920px;margin:0 auto;padding:20px 16px 110px}

  /* ===== Nav ===== */
  nav.tabs{
    position:fixed;bottom:0;left:0;right:0;z-index:30;
    background:var(--surface);border-top:1px solid var(--line);
    display:flex;justify-content:space-around;padding:8px 4px env(safe-area-inset-bottom);
    box-shadow:0 -4px 18px rgba(14,58,69,.06)
  }
  nav.tabs button{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:6px 2px;color:var(--ink-soft);font-size:.66rem;font-weight:600;border-radius:12px;transition:.15s
  }
  nav.tabs button .ic{font-size:1.2rem;line-height:1}
  nav.tabs button.active{color:var(--petrol)}
  nav.tabs button.active .ic{transform:translateY(-1px)}

  /* ===== Cards / layout ===== */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .pad{padding:18px}
  .section-h{display:flex;align-items:baseline;justify-content:space-between;margin:4px 2px 14px}
  .section-h h2{font-size:1.5rem}
  .eyebrow{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700}
  .muted{color:var(--ink-soft)}
  .grid{display:grid;gap:14px}
  @media(min-width:620px){.grid.cols2{grid-template-columns:1fr 1fr}.grid.cols3{grid-template-columns:repeat(3,1fr)}}

  /* ===== Buttons ===== */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:var(--petrol);color:#fff;border-radius:12px;padding:12px 18px;
    font-weight:600;font-size:.95rem;transition:.15s;border:1px solid transparent
  }
  .btn:hover{background:var(--petrol-2)}
  .btn:active{transform:translateY(1px)}
  .btn.gold{background:var(--gold);color:var(--petrol)}
  .btn.gold:hover{background:var(--gold-soft)}
  .btn.ghost{background:transparent;color:var(--petrol);border-color:var(--line)}
  .btn.ghost:hover{background:#f0ede5}
  .btn.block{width:100%}
  .btn.sm{padding:8px 12px;font-size:.85rem;border-radius:10px}
  .btn:disabled{opacity:.45;cursor:not-allowed}

  /* ===== Forms ===== */
  label.field{display:block;margin-bottom:12px}
  label.field span{display:block;font-size:.8rem;font-weight:600;color:var(--ink-soft);margin-bottom:5px}
  .input{
    width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)
  }
  .input:focus{outline:2px solid var(--gold-soft);border-color:var(--gold)}
  textarea.input{resize:vertical;min-height:70px}

  /* ===== Stats / metrics ===== */
  .metric{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
  .metric .n{font-family:'DM Serif Display',serif;font-size:2rem;color:var(--petrol);line-height:1}
  .metric .l{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);margin-top:6px;font-weight:600}
  .metric .l b{color:var(--gold)}

  /* ===== Flashcard ===== */
  .flash-wrap{display:flex;flex-direction:column;align-items:center;gap:18px}
  .flashcard{
    width:100%;max-width:460px;aspect-ratio:3/2;perspective:1200px;cursor:pointer
  }
  .flash-inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d}
  .flashcard.flipped .flash-inner{transform:rotateY(180deg)}
  .flash-face{
    position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;
    box-shadow:var(--shadow)
  }
  .flash-front{background:linear-gradient(135deg,var(--petrol),var(--petrol-2));color:#fff}
  .flash-back{background:var(--surface);border:1px solid var(--line);color:var(--ink);transform:rotateY(180deg)}
  .flash-face .word{font-family:'DM Serif Display',serif;font-size:2rem;line-height:1.15}
  .flash-face .ex{margin-top:14px;font-size:.92rem;font-style:italic;opacity:.85;max-width:90%}
  .flash-face .tag{position:absolute;top:14px;left:16px;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;opacity:.7;font-weight:700}
  .flash-hint{font-size:.8rem;color:var(--ink-soft)}
  .rate-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:460px}
  .rate-row button{padding:12px 4px;border-radius:12px;font-weight:600;font-size:.82rem;color:#fff;border:none}
  .r-again{background:#C0563A}.r-hard{background:#D08A36}.r-good{background:#2E7D5B}.r-easy{background:#1c6175}

  /* ===== Quiz ===== */
  .opt{
    display:block;width:100%;text-align:left;padding:14px 16px;border:1px solid var(--line);
    border-radius:12px;background:#fff;margin-bottom:10px;font-weight:500;transition:.12s
  }
  .opt:hover{border-color:var(--petrol-soft)}
  .opt.correct{background:#e7f4ed;border-color:var(--ok);color:#1c5a40}
  .opt.wrong{background:#fbeae5;border-color:var(--warn);color:#8a3a25}
  .opt:disabled{cursor:default}

  /* ===== Chat ===== */
  .chat-log{display:flex;flex-direction:column;gap:10px;min-height:240px;max-height:46vh;overflow-y:auto;padding:4px}
  .bubble{padding:10px 14px;border-radius:14px;max-width:85%;font-size:.92rem;white-space:pre-wrap;line-height:1.45}
  .bubble.user{align-self:flex-end;background:var(--petrol);color:#fff;border-bottom-right-radius:4px}
  .bubble.ai{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
  .bubble.sys{align-self:center;background:#efe9d8;color:var(--ink-soft);font-size:.8rem;border-radius:999px;padding:6px 14px}
  .chat-input{display:flex;gap:8px;margin-top:12px}
  .typing{display:inline-flex;gap:4px}.typing i{width:7px;height:7px;border-radius:50%;background:var(--petrol-soft);animation:bl 1s infinite}
  .typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  @keyframes bl{0%,60%,100%{opacity:.3}30%{opacity:1}}

  /* ===== Lists / editor ===== */
  .row-item{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:8px}
  .row-item .grow{flex:1;min-width:0}
  .row-item .grow .t{font-weight:600}
  .row-item .grow .d{font-size:.84rem;color:var(--ink-soft)}
  .icon-btn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:1rem;border:1px solid var(--line);background:#fff;color:var(--ink-soft)}
  .icon-btn:hover{background:#f0ede5}
  .seg{display:flex;background:#efe9d8;border-radius:12px;padding:4px;gap:4px;margin-bottom:16px}
  .seg button{flex:1;padding:9px;border-radius:9px;font-weight:600;font-size:.85rem;color:var(--ink-soft)}
  .seg button.active{background:#fff;color:var(--petrol);box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .empty{text-align:center;padding:34px 18px;color:var(--ink-soft)}
  .empty .big{font-size:2.4rem;margin-bottom:8px}

  /* ===== Onboarding ===== */
  .onb{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(160deg,var(--petrol),var(--petrol-2))}
  .onb .box{background:var(--surface);border-radius:22px;padding:30px 26px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .onb h1{font-size:1.9rem;color:var(--petrol);margin-bottom:4px}
  .onb .mk{width:54px;height:54px;border-radius:14px;background:radial-gradient(circle at 30% 30%,var(--gold-soft),var(--gold));display:grid;place-items:center;font-family:'DM Serif Display',serif;font-size:28px;color:var(--petrol);margin-bottom:16px}

  /* ===== Modal ===== */
  .modal-bg{position:fixed;inset:0;background:rgba(14,40,45,.55);z-index:60;display:grid;place-items:center;padding:18px}
  .modal{background:#fff;border-radius:18px;width:100%;max-width:440px;max-height:88vh;overflow-y:auto;padding:22px}
  .modal h3{font-size:1.3rem;color:var(--petrol);margin-bottom:14px}
  .toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--petrol);color:#fff;padding:10px 18px;border-radius:999px;font-size:.88rem;z-index:80;box-shadow:var(--shadow);opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
  .badge{font-size:.66rem;font-weight:700;padding:3px 8px;border-radius:999px;background:#efe9d8;color:var(--petrol-2)}
  .due-dot{background:var(--gold);color:var(--petrol)}

  /* ===== Leitura estilo livro ===== */
  .book{max-width:640px;margin:0 auto}
  .book .lesson-title{font-family:'DM Serif Display',serif;font-size:1.6rem;color:var(--petrol);line-height:1.2;margin-bottom:4px}
  .book .prose{line-height:1.75;font-size:1rem;color:var(--ink)}
  .book .prose p{margin-bottom:12px}
  .book .passage{background:#fbf9f3;border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .book .pline{padding:9px 0;border-bottom:1px dashed var(--line);cursor:pointer}
  .book .pline:last-child{border-bottom:none}
  .book .pline .src{font-size:1.08rem;line-height:1.5}
  .book .pline .tr{font-size:.9rem;color:var(--gold);font-style:italic;margin-top:3px}
  .book .drop{border-left:3px solid var(--gold);padding-left:12px}
  .lesson-chip{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;flex:none;background:#efe9d8;color:var(--petrol-2);font-weight:700}
  .lesson-chip.done{background:var(--ok);color:#fff}
/* ===== Guia de estudo de música ===== */
.sg-central{background:var(--petrol);color:#fff;border-radius:14px;padding:16px 16px 14px;margin-bottom:14px}
.sg-central .cjp{font-size:1.12rem;font-weight:700;line-height:1.35}
.sg-central .cread{font-size:.82rem;color:var(--gold-soft);margin-top:3px}
.sg-central .cpt{font-size:.9rem;font-style:italic;opacity:.9;margin-top:8px;border-top:1px solid rgba(255,255,255,.15);padding-top:8px}
.sg-tip{background:#fff;border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:.86rem;color:var(--ink-soft);line-height:1.5}
.sg-focus{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:16px}
.sg-focus h4{color:var(--petrol);font-size:.95rem;margin-bottom:4px}
.sg-focus .sub{font-size:.76rem;color:var(--ink-soft);margin-bottom:12px}
.sg-axis{padding:9px 0;border-top:1px dashed var(--line)}
.sg-axis:first-of-type{border-top:0}
.sg-axis .at{font-weight:700;color:var(--petrol-soft);font-size:.86rem}
.sg-axis .ad{font-size:.82rem;color:var(--ink-soft);line-height:1.45;margin-top:2px}
.sg-sec{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700;margin:18px 0 8px}
.sg-card{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:9px}
.sg-card .w{font-size:1.35rem;font-weight:700;color:var(--petrol);min-width:2.4em;text-align:center;line-height:1.1}
.sg-card .bd{flex:1;min-width:0}
.sg-card .rd{font-size:.78rem;color:var(--petrol-soft);font-weight:600}
.sg-card .pt{font-size:.92rem;font-weight:600;margin:2px 0 6px}
.sg-card .ex{font-size:.86rem;background:var(--bg);border-radius:8px;padding:6px 9px}
.sg-card .expt{font-size:.78rem;color:var(--ink-soft);font-style:italic;margin-top:3px}
.sg-card .note{font-size:.78rem;color:var(--ink-soft);margin-top:6px;line-height:1.4}
.sg-card .note b{color:var(--petrol-soft)}
.sg-tag{align-self:flex-start;font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;background:var(--bg);color:var(--ink-soft);border:1px solid var(--line);border-radius:20px;padding:2px 8px;font-weight:700}

/* guia de música — método orgânico (exemplo-primeiro + aprofundar) */
.sg-lead{background:linear-gradient(180deg,#fff,var(--bg));border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;padding:11px 13px;margin-bottom:2px}
.sg-lead .exj{font-size:1.04rem;line-height:1.75}
.sg-lead .expt{font-size:.8rem;color:var(--ink-soft);font-style:italic;margin-top:4px}
.sg-lead ruby rt,.sg-card .ex ruby rt,.sg-central ruby rt{font-size:.55em;opacity:.85}
.sg-card.teach{flex-direction:column;gap:8px;align-items:stretch}
.sg-card.teach .formula{font-size:1.06rem;font-weight:700;color:var(--petrol)}
.sg-card.teach .rd{font-size:.78rem;color:var(--petrol-soft);font-weight:600}
details.sg-deep{margin-top:2px;border-top:1px dashed var(--line);padding-top:8px}
details.sg-deep summary{cursor:pointer;font-size:.78rem;font-weight:700;color:var(--petrol-soft);list-style:none}
details.sg-deep summary::-webkit-details-marker{display:none}
details.sg-deep summary::before{content:'▸ ';color:var(--gold)}
details.sg-deep[open] summary::before{content:'▾ '}
details.sg-deep .dbody{font-size:.82rem;color:var(--ink-soft);line-height:1.55;margin-top:7px}
.linklike{background:none;border:none;color:var(--gold);font-weight:700;font-size:.74rem;cursor:pointer;padding:0;text-decoration:underline}
</style>
</head>
<body>

<!-- ONBOARDING -->
<div id="onboarding" class="onb hidden">
  <div class="box">
    <div class="mk">N</div>
    <h1>NIPI Línguas</h1>
    <p class="muted" style="margin-bottom:20px">Seu sistema integrado de estudo de idiomas. Vamos começar criando seu perfil.</p>
    <label class="field"><span>Como podemos te chamar?</span>
      <input id="onbName" class="input" placeholder="Seu nome" maxlength="40"></label>
    <label class="field"><span>Qual idioma você quer estudar primeiro?</span>
      <select id="onbLang" class="input"></select></label>
    <button class="btn gold block" onclick="finishOnboarding()">Começar a estudar</button>
  </div>
</div>

<!-- APP -->
<div id="app" class="app hidden">
  <header class="topbar">
    <div class="brand">
      <div class="mark">N</div>
      <div style="min-width:0">
        <div class="title">NIPI Línguas</div>
        <div class="sub">Estudo integrado</div>
      </div>
    </div>
    <div class="lang-pill">
      <span>🌐</span>
      <select id="langSwitch" onchange="switchLang(this.value)"></select>
    </div>
  </header>

  <main>
    <!-- INÍCIO -->
    <section id="view-home"></section>
    <!-- FLASHCARDS -->
    <section id="view-cards" class="hidden"></section>
    <!-- GRAMÁTICA -->
    <section id="view-grammar" class="hidden"></section>
    <!-- CONVERSA -->
    <section id="view-chat" class="hidden"></section>
    <!-- MÚSICA -->
    <section id="view-music" class="hidden"></section>
    <!-- GERENCIAR -->
    <section id="view-manage" class="hidden"></section>
    <!-- LEITURA -->
    <section id="view-reading" class="hidden"></section>
    <!-- NÍVEL -->
    <section id="view-level" class="hidden"></section>
  </main>

  <nav class="tabs">
    <button data-view="home" class="active" onclick="go('home')"><span class="ic">🏠</span>Início</button>
    <button data-view="cards" onclick="go('cards')"><span class="ic">🃏</span>Cards</button>
    <button data-view="grammar" onclick="go('grammar')"><span class="ic">✏️</span>Gramática</button>
    <button data-view="chat" onclick="go('chat')"><span class="ic">💬</span>Conversa</button>
    <button data-view="music" onclick="go('music')"><span class="ic">🎬</span>Mídia</button>
    <button data-view="reading" onclick="go('reading')"><span class="ic">📖</span>Leitura</button>
    <button data-view="manage" onclick="go('manage')"><span class="ic">⚙️</span>Gerenciar</button>
  </nav>
</div>

<div id="toast" class="toast"></div>
<div id="modalHost"></div>

<script>
/* =========================================================
   NIPI Línguas — núcleo de dados
   ========================================================= */
const STORE_KEY = 'nipi_linguas_v1';
const FLAGS = ['🇬🇧','🇪🇸','🇫🇷','🇮🇹','🇩🇪','🇧🇷','🇵🇹','🇯🇵','🇰🇷','🇨🇳','🇷🇺','🌐'];
const PROVIDERS=[
  {k:'netflix',n:'Netflix'},{k:'prime',n:'Prime Video'},{k:'disney',n:'Disney+'},
  {k:'max',n:'Max'},{k:'appletv',n:'Apple TV+'},{k:'paramount',n:'Paramount+'},
  {k:'crunchyroll',n:'Crunchyroll'},{k:'globoplay',n:'Globoplay'},{k:'viki',n:'Rakuten Viki'}
];
const COUNTRIES=[{k:'BR',n:'Brasil'},{k:'PT',n:'Portugal'},{k:'US',n:'Estados Unidos'}];
const LANG_CODES={'inglês':'en','ingles':'en','espanhol':'es','francês':'fr','frances':'fr','italiano':'it','alemão':'de','alemao':'de','português':'pt','portugues':'pt','japonês':'ja','japones':'ja','coreano':'ko','chinês':'zh','chines':'zh','russo':'ru'};
function langCode(l){return l.code||LANG_CODES[normWord(l.name)]||''}
function provName(k){const p=PROVIDERS.find(x=>x.k===k);return p?p.n:k}
function isJapaneseLang(l){return l&&(l.code==='ja'||/japon/.test(normWord(l.name)))}
function isJapanese(){return isJapaneseLang(curLang())}
function splitJp(front){const m=(front||'').match(/^(.*?)\s*\(([^)]*)\)\s*$/);return m?{base:m[1].trim(),romaji:m[2].trim()}:{base:(front||'').trim(),romaji:''}}
function jpRender(front,reading){
  const {base,romaji}=splitJp(front);
  const mode=(DB.settings&&DB.settings.jpMode)||'romaji';
  if(mode==='romaji')return esc(base)+(romaji?` <span style="opacity:.65;font-size:.85em">(${esc(romaji)})</span>`:'');
  if(mode==='furigana'){
    if(!/[\u4e00-\u9faf]/.test(base))return esc(base); // só kana: sem furigana
    const rt=reading||romaji;
    return rt?`<ruby>${esc(base)}<rt style="font-size:.55em;opacity:.85">${esc(rt)}</rt></ruby>`:esc(base);
  }
  return esc(base); // off / só kanji
}
function dispWord(o){return isJapanese()?jpRender(o.front,o.reading):esc(o.front)}
function jpStripRomaji(s){return (s||'').replace(/\s*\(([a-z]+(?:\s*\/\s*[a-z]+)*)\)/g,'')}

to viés."},{"f":"evaluar","b":"avaliar","ex":"Evaluamos los resultados cada mes.","exb":"Avaliamos os resultados todo mês."},{"f":"debilitar","b":"enfraquecer","ex":"La duda puede debilitar el avance.","exb":"A dúvida pode enfraquecer o avanço."},{"f":"marco","b":"arcabouço","ex":"Seguimos un marco claro.","exb":"Seguimos um arcabouço claro."}],"quiz":[{"q":"\"Si ___ rico, viajaría más.\"","o":["soy","fuera","seré"],"a":1,"e":"Condicional irreal usa subjuntivo imperfecto."},{"q":"Voz passiva de \"Construyeron la casa\":","o":["La casa construyó","La casa fue construida","La casa está construyendo"],"a":1,"e":"Ser + particípio forma a passiva."},{"q":"Estilo indirecto de \"Estoy cansado\", dijo:","o":["Dijo que está cansado","Dijo que estaba cansado","Dice que estaba cansado"],"a":1,"e":"O presente recua ao imperfecto no discurso indireto."},{"q":"\"Ojalá ___ venido.\"","o":["ha","hubiera","habrá"],"a":1,"e":"Ojalá + subjuntivo para desejo irreal no passado."}]},{"id":"C1","label":"C1","desc":"Avançado.","grammar":["subjuntivo pluscuamperfecto","conectores del discurso","oraciones concesivas","registro formal"],"core":[{"f":"discernir","b":"discernir","ex":"Es difícil discernir la verdad.","exb":"É difícil discernir a verdade."},{"f":"abogar","b":"defender","ex":"Aboga por la reforma.","exb":"Defende a reforma."},{"f":"convincente","b":"convincente","ex":"Presentó un caso convincente.","exb":"Apresentou um caso convincente."},{"f":"mitigar","b":"mitigar","ex":"Se tomaron medidas para mitigar el riesgo.","exb":"Tomaram-se medidas para mitigar o risco."},{"f":"predominante","b":"predominante","ex":"Esa visión es predominante hoy.","exb":"Essa visão é predominante hoje."},{"f":"matiz","b":"nuance","ex":"El matiz pasa desapercibido.","exb":"A nuance passa despercebida."},{"f":"índole","b":"índole","ex":"Es un problema de otra índole.","exb":"É um problema de outra índole."},{"f":"recurrir","b":"recorrer","ex":"Recurrieron a otra estrategia.","exb":"Recorreram a outra estratégia."},{"f":"inherente","b":"inerente","ex":"Hay una limitación inherente.","exb":"Há uma limitação inerente."},{"f":"aliviar","b":"aliviar","ex":"La medida alivió la carga.","exb":"A medida aliviou o fardo."},{"f":"ambiguo","b":"ambíguo","ex":"Su respuesta fue ambigua.","exb":"A resposta dele foi ambígua."},{"f":"fundamentar","b":"fundamentar","ex":"No pudieron fundamentar la acusación.","exb":"Não conseguiram fundamentar a acusação."},{"f":"crucial","b":"crucial","ex":"Fue un momento crucial.","exb":"Foi um momento crucial."},{"f":"discrepancia","b":"discrepância","ex":"Hallamos una discrepancia en las cifras.","exb":"Encontramos uma discrepância nos números."},{"f":"escrutinio","b":"escrutínio","ex":"El informe fue sometido a escrutinio.","exb":"O relatório foi submetido a escrutínio."},{"f":"sostener","b":"sustentar","ex":"Los críticos sostienen lo contrario.","exb":"Os críticos sustentam o contrário."}],"quiz":[{"q":"\"Si ___ estudiado, habría aprobado.\"","o":["hubiera","habría","he"],"a":0,"e":"Pluscuamperfecto de subjuntivo na prótase."},{"q":"Conector de contraste formal:","o":["por lo tanto","no obstante","además"],"a":1,"e":"\"No obstante\" introduz contraste."},{"q":"\"Por más que ___, no lo logró.\"","o":["intentó","intentara","intenta"],"a":1,"e":"Concessiva com subjuntivo."},{"q":"\"Índole\" significa aproximadamente:","o":["natureza / caráter","tamanho","urgência"],"a":0,"e":"Índole = natureza ou caráter de algo."}]},{"id":"C2","label":"C2","desc":"Domínio.","grammar":["matices de registro","modismos avançados","subordinadas complexas","elipsis"],"core":[{"f":"ubicuo","b":"onipresente","ex":"Las pantallas son ubicuas hoy.","exb":"As telas são onipresentes hoje."},{"f":"efímero","b":"efêmero","ex":"La fama puede ser efímera.","exb":"A fama pode ser efêmera."},{"f":"meticuloso","b":"meticuloso","ex":"Es meticuloso con los detalles.","exb":"É meticuloso com os detalhes."},{"f":"paradigma","b":"paradigma","ex":"Esto marca un cambio de paradigma.","exb":"Isto marca uma mudança de paradigma."},{"f":"yuxtaponer","b":"justapor","ex":"La obra yuxtapone pasado y presente.","exb":"A obra justapõe passado e presente."},{"f":"esotérico","b":"esotérico","ex":"El tema es algo esotérico.","exb":"O tema é um tanto esotérico."},{"f":"franqueza","b":"franqueza","ex":"Agradecí su franqueza.","exb":"Agradeci a franqueza dela."},{"f":"soslayar","b":"contornar / evitar","ex":"Soslayó la pregunta.","exb":"Contornou a pergunta."},{"f":"tácito","b":"tácito","ex":"Hubo un acuerdo tácito.","exb":"Houve um acordo tácito."},{"f":"ofuscar","b":"obscurecer","ex":"La jerga puede ofuscar el sentido.","exb":"O jargão pode obscurecer o sentido."},{"f":"inocuo","b":"inócuo","ex":"El comentario parecía inocuo.","exb":"O comentário parecia inócuo."},{"f":"permear","b":"permear","ex":"El optimismo permea el texto.","exb":"O otimismo permeia o texto."},{"f":"sobresaliente","b":"saliente / notável","ex":"Obtuvo un resultado sobresaliente.","exb":"Obteve um resultado notável."},{"f":"equívoco","b":"ambíguo","ex":"La evidencia es equívoca.","exb":"A evidência é ambígua."},{"f":"impregnar","b":"impregnar","ex":"La idea impregnó el debate.","exb":"A ideia impregnou o debate."},{"f":"contundente","b":"contundente","ex":"Dio una respuesta contundente.","exb":"Deu uma resposta contundente."}],"quiz":[{"q":"\"Soslayar\" significa:","o":["enfrentar","evitar / contornar","exagerar"],"a":1,"e":"Soslayar = esquivar-se de algo."},{"q":"\"Tácito\" quer dizer:","o":["explícito","implícito","ruidoso"],"a":1,"e":"Tácito = subentendido, não declarado."},{"q":"\"Ubicuo\" significa:","o":["raro","presente em toda parte","antigo"],"a":1,"e":"Ubicuo = onipresente."},{"q":"Registro mais formal para \"pero\":","o":["pero","no obstante","y"],"a":1,"e":"\"No obstante\" pertence ao registro formal."}]}]},"ja":{"code":"ja","name":"Japonês","flag":"🇯🇵","framework":"JLPT","version":6,"updated":"2026-07-11","note":"Vocabulário, leituras (furigana), exemplos e questões autorais, organizados pelos níveis do JLPT. Caracteres/leituras dos kanji e listas por nível são fatos linguísticos; escopo de vocabulário/gramática iniciante calibrado a partir de materiais de referência públicos (ver content/CONTENT-LICENSE.md).","levels":[{"id":"N5","label":"N5","desc":"Iniciante — base de kana e kanji simples.","grammar":["partículas は / が / を","です / ます","adjetivos い e な","これ・それ・あれ (kosoado)","partícula の (posse/ligação)","números e contadores (〜つ, 〜円)","pedidos com 〜てください"],"core":[{"f":"こんにちは","b":"olá","ex":"こんにちは、田中です。","exb":"Olá, sou o Tanaka.","r":""},{"f":"水","b":"água","ex":"毎日水を飲みます。","exb":"Bebo água todos os dias.","r":"みず"},{"f":"家","b":"casa","ex":"家に帰ります。","exb":"Volto para casa.","r":"いえ"},{"f":"食べる","b":"comer","ex":"七時に晩ご飯を食べます。","exb":"Janto às sete.","r":"たべる"},{"f":"大きい","b":"ser grande","ex":"あれは大きい犬です。","exb":"Aquele é um cachorro grande.","r":"おおきい"},{"f":"友達","b":"amigo","ex":"友達に会います。","exb":"Encontro um amigo.","r":"ともだち"},{"f":"日","b":"dia","ex":"いい日ですね。","exb":"Que belo dia, não?","r":"ひ"},{"f":"いい","b":"bom","ex":"このコーヒーはいいです。","exb":"Este café é bom.","r":""},{"f":"働く","b":"trabalhar","ex":"小さい会社で働きます。","exb":"Trabalho numa empresa pequena.","r":"はたらく"},{"f":"家族","b":"família","ex":"家族は四人です。","exb":"Somos quatro na família.","r":"かぞく"},{"f":"町","b":"cidade / vila","ex":"この町は静かです。","exb":"Esta cidade é tranquila.","r":"まち"},{"f":"住む","b":"morar","ex":"海の近くに住んでいます。","exb":"Moro perto do mar.","r":"すむ"},{"f":"名前","b":"nome","ex":"お名前は何ですか。","exb":"Qual é o seu nome?","r":"なまえ"},{"f":"食べ物","b":"comida","ex":"食べ物ができました。","exb":"A comida ficou pronta.","r":"たべもの"},{"f":"小さい","b":"ser pequeno","ex":"小さい車があります。","exb":"Tenho um carro pequeno.","r":"ちいさい"},{"f":"欲しい","b":"querer (ter)","ex":"水が欲しいです。","exb":"Quero água.","r":"ほしい"},{"f":"これ","b":"isto (perto de quem fala)","ex":"これは本です。","exb":"Isto é um livro.","r":""},{"f":"それ","b":"isso (perto de quem ouve)","ex":"それはペンですか。","exb":"Isso é uma caneta?","r":""},{"f":"あれ","b":"aquilo (longe dos dois)","ex":"あれは学校です。","exb":"Aquilo é uma escola.","r":""},{"f":"どこ","b":"onde","ex":"トイレはどこですか。","exb":"Onde é o banheiro?","r":""},{"f":"学校","b":"escola","ex":"学校に行きます。","exb":"Vou à escola.","r":"がっこう"},{"f":"先生","b":"professor(a)","ex":"先生に聞きます。","exb":"Pergunto ao professor.","r":"せんせい"},{"f":"学生","b":"estudante","ex":"私は学生です。","exb":"Sou estudante.","r":"がくせい"},{"f":"本","b":"livro","ex":"本を読みます。","exb":"Leio um livro.","r":"ほん"},{"f":"車","b":"carro","ex":"車で行きます。","exb":"Vou de carro.","r":"くるま"},{"f":"駅","b":"estação (de trem)","ex":"駅で会います。","exb":"Encontro na estação.","r":"えき"},{"f":"電話","b":"telefone","ex":"電話をします。","exb":"Faço uma ligação.","r":"でんわ"},{"f":"今日","b":"hoje","ex":"今日は寒いです。","exb":"Hoje está frio.","r":"きょう"},{"f":"明日","b":"amanhã","ex":"明日行きます。","exb":"Vou amanhã.","r":"あした"},{"f":"行く","b":"ir","ex":"学校へ行きます。","exb":"Vou para a escola.","r":"い(く)"},{"f":"来る","b":"vir","ex":"友達が来ます。","exb":"Um amigo vem.","r":"く(る)"},{"f":"見る","b":"ver, olhar","ex":"映画を見ます。","exb":"Vejo um filme.","r":"み(る)"},{"f":"読む","b":"ler","ex":"新聞を読みます。","exb":"Leio o jornal.","r":"よ(む)"},{"f":"飲む","b":"beber","ex":"お茶を飲みます。","exb":"Bebo chá.","r":"の(む)"},{"f":"買う","b":"comprar","ex":"パンを買います。","exb":"Compro pão.","r":"か(う)"},{"f":"書く","b":"escrever","ex":"手紙を書きます。","exb":"Escrevo uma carta.","r":"か(く)"}],"quiz":[{"q":"\"私___学生です。\" (Eu sou estudante)","o":["は","を","へ"],"a":0,"e":"A partícula は marca o tópico da frase."},{"q":"\"ありがとう\" significa:","o":["desculpa","obrigado(a)","tchau"],"a":1,"e":"ありがとう = obrigado(a)."},{"q":"Pedir algo educadamente: \"水を___\"","o":["ください","です","ます"],"a":0,"e":"〜をください = \"... por favor\"."},{"q":"Qual partícula marca o objeto direto? \"ご飯___食べます\"","o":["が","を","に"],"a":1,"e":"を marca o objeto direto."},{"q":"\"____ は本です。\" (Isto é um livro.)","o":["これ","そこ","どこ"],"a":0,"e":"これ = \"isto\", perto de quem fala."},{"q":"Para perguntar \"onde é?\" usa-se:","o":["いつ ですか","どこ ですか","だれ ですか"],"a":1,"e":"どこ = onde; いつ = quando; だれ = quem."},{"q":"東京____お土産 (presente de Tóquio) — partícula que liga dois substantivos:","o":["の","を","へ"],"a":0,"e":"A partícula の liga dois substantivos: A の B = \"B de A\"."},{"q":"\"食べて____\" (Coma, por favor.)","o":["ください","ます","です"],"a":0,"e":"Verbo na forma て + ください = pedido educado."},{"q":"水を二____ください。 (Duas — contador para copos/objetos)","o":["つ","本","円"],"a":0,"e":"〜つ é o contador geral: ひとつ, ふたつ, みっつ…"}],"lessons":[{"id":"N5-L1","title":"Lição 1 — Saudações e o verbo です","intro":"A saudação こんにちは (konnichiwa) cobre \"olá / boa tarde\". Ao se apresentar, diz-se はじめまして (\"prazer, é a primeira vez\") e, no fim, どうぞよろしくおねがいします (fórmula de cortesia).\n\nO verbo \"ser\" é です, que vem no fim da frase: 「わたしは マリアです」 = \"Eu sou a Maria\". A partícula は (lida \"wa\") marca o tópico.\n\nPara perguntar, acrescenta-se か no fim: 「これは なんですか」 = \"O que é isto?\". これ = isto (perto de quem fala); それ = isso (perto do ouvinte).","reading":{"title":"会話: はじめまして (Diálogo: prazer em conhecer)","lines":[{"t":"こんにちは。","b":"Olá."},{"t":"はじめまして。田中です。","b":"Prazer. Sou o Tanaka."},{"t":"わたしは マリアです。","b":"Eu sou a Maria."},{"t":"どうぞ よろしく おねがいします。","b":"Muito prazer (conto com você)."},{"t":"これは なんですか。","b":"O que é isto?"},{"t":"それは 本です。","b":"Isso é um livro."}]},"vocab":[{"f":"わたし","b":"eu"},{"f":"名前","b":"nome","r":"なまえ"},{"f":"本","b":"livro","r":"ほん"},{"f":"これ","b":"isto"},{"f":"それ","b":"isso"},{"f":"学生","b":"estudante","r":"がくせい"}],"quiz":[{"q":"\"わたし__ 学生です。\" (tópico)","o":["は","を","が"],"a":0,"e":"は marca o tópico da frase."},{"q":"\"これ__ なんですか。\"","o":["は","を","に"],"a":0,"e":"は marca o tópico também nas perguntas."},{"q":"\"はじめまして\" significa:","o":["Prazer em conhecer","Obrigado","Desculpe"],"a":0,"e":"はじめまして é dito ao conhecer alguém pela primeira vez."}]},{"id":"N5-L2","title":"Lição 2 — Demonstrativos これ・それ・あれ e o lugar どこ","intro":"O japonês agrupa os demonstrativos em famílias que começam por ko-/so-/a-/do-. Para objetos: これ (isto, perto de quem fala), それ (isso, perto de quem ouve), あれ (aquilo, longe dos dois). Para lugares: ここ (aqui), そこ (aí), あそこ (lá) e どこ (onde).\n\nPerguntas de identificação usam なん/なに (o quê): 「これは なんですか」 = \"O que é isto?\". Perguntas de lugar usam どこ: 「トイレは どこですか」 = \"Onde é o banheiro?\".\n\nA partícula の liga dois substantivos, do modificador para o núcleo: 「東京の お土産」 = \"presente de Tóquio\".","reading":{"title":"会話: これ・それ・あれ (Diálogo: isto, isso, aquilo)","lines":[{"t":"これは なんですか。","b":"O que é isto?"},{"t":"それは 日本の お茶です。","b":"Isso é chá japonês."},{"t":"あれは なんですか。","b":"E aquilo, o que é?"},{"t":"あれは 学校です。","b":"Aquilo é uma escola."},{"t":"トイレは どこですか。","b":"Onde é o banheiro?"},{"t":"トイレは あそこです。","b":"O banheiro é lá."}]},"vocab":[{"f":"ここ","b":"aqui"},{"f":"そこ","b":"aí"},{"f":"あそこ","b":"lá (longe)"},{"f":"どこ","b":"onde"},{"f":"なん","b":"o quê","r":"nan"},{"f":"お茶","b":"chá","r":"おちゃ"}],"quiz":[{"q":"それは____ですか。 (O que é isso?)","o":["なん","どこ","だれ"],"a":0,"e":"なん/なに = o quê."},{"q":"Objeto longe dos dois interlocutores:","o":["これ","それ","あれ"],"a":2,"e":"あれ = aquilo (longe)."},{"q":"トイレは ____ です。 (O banheiro é lá.)","o":["あそこ","これ","なん"],"a":0,"e":"あそこ = lá (lugar longe)."}]},{"id":"N5-L3","title":"Lição 3 — Números, contadores e pedidos com 〜てください","intro":"Números de 0 a 10: ゼロ/れい, いち, に, さん, よん/し, ご, ろく, なな/しち, はち, きゅう/く, じゅう. Acima de 10 combina-se: じゅういち (11), にじゅう (20), にじゅういち (21).\n\nContadores mudam conforme o objeto. O contador geral 〜つ (ひとつ, ふたつ, みっつ…) serve para coisas em geral; 〜円 (えん) para dinheiro; 〜まい para folhas/objetos finos.\n\nPara pedir algo educadamente, usa-se o verbo na forma て + ください: 食べる → 食べて → 「食べてください」 (coma, por favor). O padrão 〜を ください pede um objeto: 「水を ください」 (água, por favor).","reading":{"title":"会話: おみせで (Diálogo: na loja)","lines":[{"t":"いらっしゃいませ。","b":"Bem-vindo(a)!"},{"t":"シュークリームを ふたつ ください。","b":"Dois bombons de creme, por favor."},{"t":"はい。ぜんぶで 六百円です。","b":"Certo. No total, 600 ienes."},{"t":"これで おねがいします。","b":"Com isto, por favor."},{"t":"ありがとうございます。","b":"Muito obrigado(a)."}]},"vocab":[{"f":"一つ","b":"um (contador geral)","r":"ひとつ"},{"f":"二つ","b":"dois","r":"ふたつ"},{"f":"三つ","b":"três","r":"みっつ"},{"f":"円","b":"iene","r":"えん"},{"f":"ください","b":"por favor / dê-me"},{"f":"ぜんぶ","b":"tudo, no total"}],"quiz":[{"q":"水を ____ください。 (água, por favor)","o":["を","は","の"],"a":0,"e":"〜を ください pede um objeto."},{"q":"\"20\" em japonês:","o":["じゅうに","にじゅう","にひゃく"],"a":1,"e":"にじゅう = 20 (2×10)."},{"q":"見る na forma de pedido:","o":["見てください","見るください","見ますください"],"a":0,"e":"forma て (見て) + ください."}]}]},{"id":"N4","label":"N4","desc":"Básico — rotina e forma て.","grammar":["forma て (usos)","forma plana (casual) e forma た","potencial 〜られる / 〜ことができる","〜たり〜たり","comparativos 〜より / 〜のほうが / いちばん","〜と思います (opinião)","〜てもいいですか (permissão) / 〜てはいけません (proibição)"],"core":[{"f":"時々","b":"às vezes","ex":"時々歩いて行きます。","exb":"Às vezes vou a pé.","r":"ときどき"},{"f":"天気","b":"tempo (clima)","ex":"今日は天気が悪いです。","exb":"Hoje o tempo está ruim.","r":"てんき"},{"f":"もう","b":"já","ex":"もう着きました。","exb":"Já cheguei.","r":""},{"f":"忙しい","b":"estar ocupado","ex":"今週は忙しいです。","exb":"Esta semana estou ocupado.","r":"いそがしい"},{"f":"旅行","b":"viagem","ex":"来月旅行に行きます。","exb":"Vou viajar no mês que vem.","r":"りょこう"},{"f":"覚える","b":"memorizar / lembrar","ex":"その歌を覚えています。","exb":"Lembro daquela música.","r":"おぼえる"},{"f":"安い","b":"ser barato","ex":"このシャツは安いです。","exb":"Esta camisa é barata.","r":"やすい"},{"f":"説明","b":"explicação","ex":"説明をお願いします。","exb":"Uma explicação, por favor.","r":"せつめい"},{"f":"着く","b":"chegar","ex":"電車が遅く着きました。","exb":"O trem chegou atrasado.","r":"つく"},{"f":"高い","b":"caro / alto","ex":"そのかばんは高いです。","exb":"Aquela bolsa é cara.","r":"たかい"},{"f":"健康","b":"saúde","ex":"健康が一番大切です。","exb":"A saúde é o mais importante.","r":"けんこう"},{"f":"試す","b":"experimentar / tentar","ex":"もう一度試します。","exb":"Vou tentar mais uma vez.","r":"ためす"},{"f":"持って来る","b":"trazer","ex":"傘を持って来ました。","exb":"Trouxe o guarda-chuva.","r":"もってくる"},{"f":"疲れる","b":"cansar","ex":"今日は疲れました。","exb":"Hoje me cansei.","r":"つかれる"},{"f":"十分","b":"suficiente","ex":"時間は十分あります。","exb":"Há tempo suficiente.","r":"じゅうぶん"},{"f":"理由","b":"motivo","ex":"理由を教えてください。","exb":"Diga-me o motivo, por favor.","r":"りゆう"},{"f":"朝","b":"manhã","ex":"毎朝コーヒーを飲みます。","exb":"Bebo café toda manhã.","r":"あさ"},{"f":"道","b":"caminho, rua","ex":"道に迷いました。","exb":"Me perdi no caminho.","r":"みち"},{"f":"信号","b":"semáforo","ex":"次の信号を右に曲がってください。","exb":"Vire à direita no próximo semáforo.","r":"しんごう"},{"f":"約束","b":"promessa, compromisso","ex":"約束を守ります。","exb":"Cumpro a promessa.","r":"やくそく"},{"f":"遅れる","b":"atrasar-se","ex":"電車が遅れました。","exb":"O trem atrasou.","r":"おく(れる)"},{"f":"思う","b":"achar, pensar","ex":"雨だと思います。","exb":"Acho que vai chover.","r":"おも(う)"},{"f":"使う","b":"usar","ex":"辞書を使います。","exb":"Uso o dicionário.","r":"つか(う)"},{"f":"待つ","b":"esperar","ex":"駅で待ちます。","exb":"Espero na estação.","r":"ま(つ)"},{"f":"急ぐ","b":"apressar-se","ex":"急いで帰ります。","exb":"Volto depressa.","r":"いそ(ぐ)"},{"f":"忘れる","b":"esquecer","ex":"名前を忘れました。","exb":"Esqueci o nome.","r":"わす(れる)"},{"f":"柔らかい","b":"macio","ex":"このパンは柔らかいです。","exb":"Este pão é macio.","r":"やわ(らかい)"},{"f":"親切","b":"gentil (adj. な)","ex":"先生は親切です。","exb":"O professor é gentil.","r":"しんせつ"},{"f":"有名","b":"famoso (adj. な)","ex":"この町は有名です。","exb":"Esta cidade é famosa.","r":"ゆうめい"},{"f":"一番","b":"o/a mais, número um","ex":"これが一番おいしいです。","exb":"Este é o mais gostoso.","r":"いちばん"},{"f":"受ける","b":"receber, fazer (prova)","ex":"試験を受けます。","exb":"Faço a prova.","r":"う(ける)"},{"f":"答える","b":"responder","ex":"質問に答えます。","exb":"Respondo à pergunta.","r":"こた(える)"},{"f":"生活","b":"vida (cotidiana)","ex":"日本の生活に慣れました。","exb":"Me acostumei com a vida no Japão.","r":"せいかつ"},{"f":"夢","b":"sonho","ex":"先生になるのが夢です。","exb":"Meu sonho é ser professor.","r":"ゆめ"}],"quiz":[{"q":"Forma て de \"食べる\":","o":["食べて","食べた","食べます"],"a":0,"e":"Verbos ichidan: troca-se る por て."},{"q":"\"日本語が___。\" (Consigo falar japonês)","o":["話せます","話します","話しました"],"a":0,"e":"話せます é a forma potencial de 話す."},{"q":"\"もう\" significa:","o":["ainda","já","nunca"],"a":1,"e":"もう = já (ação concluída)."},{"q":"O que \"〜たり〜たり\" expressa?","o":["ordem estrita","lista de ações representativas","negação"],"a":1,"e":"Lista exemplos de ações, sem ordem fixa."},{"q":"A é mais quente que B: A の ____ が B より あついです。","o":["ほう","こと","とき"],"a":0,"e":"A のほうが B より… = \"A é mais … do que B\"."},{"q":"\"Posso comer?\" 食べて____ですか。","o":["もいい","ください","います"],"a":0,"e":"forma て + もいいですか pede permissão."},{"q":"使う na forma potencial (\"poder usar\"):","o":["使える","使った","使わない"],"a":0,"e":"Verbos do grupo 1: 使う → 使える."},{"q":"\"Acho que ela vem.\" 彼女は来る____。","o":["と思います","てください","ましょう"],"a":0,"e":"forma plana + と思います = \"acho que…\"."},{"q":"\"Não se pode usar.\" 使って____。","o":["はいけません","もいいです","ください"],"a":0,"e":"forma て + はいけません = proibição."}],"lessons":[{"id":"N4-L1","title":"Lição 1 — A forma て e seus usos","intro":"A forma て conecta ações e abre vários padrões úteis. Regras (grupo 1): う/つ/る→って, む/ぶ/ぬ→んで, く→いて, ぐ→いで, す→して; grupo 2: troca 〜ます por て (食べます→食べて); irregulares: する→して, 来る→来て. Exceção: 行く→行って.\n\nUsos principais: (1) 〜てください = pedido; (2) 〜ています = ação em curso (食べています = está comendo); (3) 〜てもいいですか = pedir permissão; (4) 〜てはいけません = proibição; (5) 〜てから = \"depois de\".\n\nA forma て também encadeia ações sucessivas: 「階段を上がって、右に行きます」 = \"suba a escada e vá à direita\".","reading":{"title":"会話: ごみと リサイクル (Diálogo: lixo e reciclagem)","lines":[{"t":"ここに ごみを 捨てても いいですか。","b":"Posso jogar o lixo aqui?"},{"t":"かんは べつの ふくろに 入れて ください。","b":"Coloque as latas em outro saco, por favor."},{"t":"わかりました。","b":"Entendi."},{"t":"それから、ドアを 閉めて ください。","b":"E depois, feche a porta, por favor."},{"t":"はい、いま 閉めて います。","b":"Sim, estou fechando agora."}]},"vocab":[{"f":"捨てる","b":"jogar fora","r":"す(てる)"},{"f":"入れる","b":"colocar dentro","r":"い(れる)"},{"f":"曲がる","b":"virar, dobrar","r":"ま(がる)"},{"f":"上がる","b":"subir","r":"あ(がる)"},{"f":"〜てから","b":"depois de ~"}],"quiz":[{"q":"読む → forma て:","o":["読んで","読って","読いて"],"a":0,"e":"む/ぶ/ぬ → んで."},{"q":"行く → forma て (exceção):","o":["行いて","行って","行きて"],"a":1,"e":"行く é exceção: 行って."},{"q":"\"está dormindo\" 寝て____","o":["います","ください","から"],"a":0,"e":"〜ています = ação em curso."}]},{"id":"N4-L2","title":"Lição 2 — Comparações: 〜より, 〜のほうが e いちばん","intro":"Para comparar duas coisas, usa-se A のほうが B より + adjetivo: 「タイのほうが 日本より あついです」 = \"a Tailândia é mais quente que o Japão\". Também vale A は B より…: 「タイは 日本より あついです」.\n\nPara perguntar entre duas opções: A と B と どちらが + adjetivo + ですか — 「ふとんと ベッドと どちらが すきですか」 (de qual você gosta mais?).\n\nCom três ou mais itens, o superlativo é いちばん (o/a mais): 「これが いちばん おいしいです」. Nas perguntas, muda a palavra interrogativa: どれが / どこが / なにが + いちばん…?","reading":{"title":"会話: どちらが すき？ (Diálogo: de qual você gosta mais?)","lines":[{"t":"ふとんと ベッドと どちらが すきですか。","b":"Entre futon e cama, de qual você gosta mais?"},{"t":"ふとんの ほうが すきです。","b":"Gosto mais do futon."},{"t":"ベッドより やわらかいですか。","b":"É mais macio que a cama?"},{"t":"はい。でも、ベッドの ほうが たかいです。","b":"Sim. Mas a cama é mais cara."},{"t":"じゃ、どれが いちばん いいですか。","b":"Então, qual é o melhor de todos?"}]},"vocab":[{"f":"〜より","b":"do que ~"},{"f":"〜のほうが","b":"~ é mais…"},{"f":"どちら","b":"qual (entre dois)"},{"f":"いちばん","b":"o/a mais","r":"一番"},{"f":"柔らかい","b":"macio","r":"やわ(らかい)"}],"quiz":[{"q":"A é mais barato que B: A は B ____ やすいです。","o":["より","のほうが","から"],"a":0,"e":"B より = \"do que B\"."},{"q":"Superlativo (\"o mais gostoso\"): ____ おいしい","o":["いちばん","より","どちら"],"a":0,"e":"いちばん + adjetivo = superlativo."},{"q":"Perguntar entre duas coisas: A と B と ____ が すきですか","o":["どちら","いちばん","どこ"],"a":0,"e":"どちら = qual (entre dois)."}]},{"id":"N4-L3","title":"Lição 3 — Forma potencial e 〜ことができる","intro":"A forma potencial expressa capacidade (\"conseguir/poder fazer\"). Grupo 1: troca a última sílaba -u pela linha -e + る: 使う→使える, 読む→読める, 行く→行ける. Grupo 2: 〜ます→られる (食べます→食べられる, 見ます→見られる). Irregulares: する→できる, 来る→来られる.\n\nO mesmo sentido pode ser dado com a forma do dicionário + ことができる: 「私は 行く ことができます」 = 「私は 行けます」 (\"eu consigo ir\").\n\nPara transformar um verbo em substantivo, acrescenta-se の (ou こと) à forma plana: 「先生に なるのが 夢です」 = \"meu sonho é me tornar professor\".","reading":{"title":"会話: できますか (Diálogo: você consegue?)","lines":[{"t":"クレジットカードは 使えますか。","b":"Dá para usar cartão de crédito?"},{"t":"はい、使えます。","b":"Sim, dá."},{"t":"日本語で はなす ことが できますか。","b":"Você consegue falar em japonês?"},{"t":"すこし はなせます。","b":"Consigo falar um pouco."},{"t":"よかった。","b":"Que bom."}]},"vocab":[{"f":"〜ことができる","b":"conseguir/poder ~"},{"f":"できる","b":"conseguir, ser possível"},{"f":"話す","b":"falar","r":"はな(す)"},{"f":"〜になる","b":"tornar-se ~"},{"f":"クレジットカード","b":"cartão de crédito"}],"quiz":[{"q":"読む → forma potencial (\"poder ler\"):","o":["読める","読んで","読まない"],"a":0,"e":"grupo 1: 読む→読める."},{"q":"する → potencial:","o":["できる","した","しる"],"a":0,"e":"する é irregular: できる."},{"q":"\"Consigo ir.\" 行く ____ ができます。","o":["こと","の","から"],"a":0,"e":"forma do dicionário + ことができる."}]}]},{"id":"N3","label":"N3","desc":"Intermediário.","grammar":["passiva 〜られる","causativo 〜させる","condicionais と / ば / たら / なら","〜そうだ"],"core":[{"f":"助言","b":"conselho","ex":"いい助言をもらいました。","exb":"Recebi um bom conselho.","r":"じょげん"},{"f":"改善","b":"melhoria","ex":"発音を改善したいです。","exb":"Quero melhorar a pronúncia.","r":"かいぜん"},{"f":"環境","b":"meio ambiente","ex":"環境を守るべきです。","exb":"Devemos proteger o meio ambiente.","r":"かんきょう"},{"f":"可能","b":"possível","ex":"明日も可能ですか。","exb":"Amanhã também é possível?","r":"かのう"},{"f":"しかし","b":"porém","ex":"しかし、結果は違いました。","exb":"Porém, o resultado foi diferente.","r":""},{"f":"経験","b":"experiência","ex":"いい経験でした。","exb":"Foi uma boa experiência.","r":"けいけん"},{"f":"必要","b":"necessário","ex":"練習が必要です。","exb":"É preciso praticar.","r":"ひつよう"},{"f":"準備","b":"preparação","ex":"試験の準備をしています。","exb":"Estou me preparando para a prova.","r":"じゅんび"},{"f":"能力","b":"habilidade","ex":"能力を伸ばしています。","exb":"Estou desenvolvendo minhas habilidades.","r":"のうりょく"},{"f":"提案","b":"proposta","ex":"別の方法を提案しました。","exb":"Propus outro método.","r":"ていあん"},{"f":"避ける","b":"evitar","ex":"失敗を避けたいです。","exb":"Quero evitar erros.","r":"さける"},{"f":"目的","b":"propósito","ex":"旅行の目的は何ですか。","exb":"Qual é o propósito da viagem?","r":"もくてき"},{"f":"達する","b":"alcançar","ex":"目標に達しました。","exb":"Alcancei a meta.","r":"たっする"},{"f":"問題","b":"problema","ex":"問題が起きました。","exb":"Surgiu um problema.","r":"もんだい"},{"f":"信頼","b":"confiança","ex":"信頼が大切です。","exb":"A confiança é importante.","r":"しんらい"},{"f":"努力","b":"esforço","ex":"努力すれば、できます。","exb":"Se você se esforçar, consegue.","r":"どりょく"}],"quiz":[{"q":"Passiva de \"見る\":","o":["見られる","見せる","見ている"],"a":0,"e":"見られる é a forma passiva (e também potencial)."},{"q":"Causativo de \"行く\":","o":["行かせる","行かれる","行ける"],"a":0,"e":"〜せる/させる forma o causativo."},{"q":"\"時間があれば、行きます。\" O que ば expressa?","o":["condição","razão","ordem"],"a":0,"e":"〜ば forma a condicional \"se\"."},{"q":"\"雨が降りそうです\" significa:","o":["Choveu","Parece que vai chover","Não vai chover"],"a":1,"e":"〜そうだ (aparência) indica que algo parece prestes a acontecer."}],"lessons":[{"id":"N3-L1","title":"Leitura N3 — Contar experiências e fazer duas coisas ao mesmo tempo","intro":"No N3 você começa a ligar ideias e dar matiz às frases. Três estruturas úteis:\n\n1) 〜ながら (enquanto): liga a raiz-ます de um verbo a outra ação simultânea — 「音楽を ききながら 本を 読みます」 = \"leio livros enquanto ouço música\".\n\n2) 〜た ことが あります (já fiz alguma vez): usa a forma た + ことが あります para experiências — 「京都に 行った ことが あります」 = \"já fui a Kyoto\".\n\n3) 〜んです (é que…): dá ou pede explicação e soa mais natural na fala — 「行きたいんです」 = \"é que eu quero ir\". Adjetivos ligam-se com 〜くて: 「おおくて きれい」 = \"tem muitos e é bonito\".","reading":{"title":"会話: しゅうまつ (Diálogo: o fim de semana)","lines":[{"t":"しゅうまつ、なにを しますか。","b":"O que você faz no fim de semana?"},{"t":"音楽を ききながら 本を 読みます。","b":"Leio livros enquanto ouço música."},{"t":"いいですね。わたしは 京都に 行った ことが あります。","b":"Que legal. Eu já fui a Kyoto."},{"t":"どうでしたか。","b":"Como foi?"},{"t":"お寺が おおくて、とても きれいでした。","b":"Tinha muitos templos e era muito bonito."},{"t":"わたしも 行きたいんです。","b":"É que eu também quero ir."},{"t":"じゃ、こんど いっしょに 行きましょう。","b":"Então, da próxima vez vamos juntos."}]},"vocab":[{"f":"〜ながら","b":"enquanto (ação simultânea)"},{"f":"〜たことがある","b":"já ter feito (experiência)"},{"f":"〜んです","b":"é que… (explicação/ênfase)"},{"f":"お寺","b":"templo","r":"おてら"},{"f":"こんど","b":"da próxima vez / desta vez"}],"quiz":[{"q":"\"Leio enquanto ouço música\": 音楽を きき____ 読みます。","o":["ながら","たり","ので"],"a":0,"e":"〜ながら liga duas ações simultâneas."},{"q":"\"Já fui a Kyoto\": 京都に 行った ____ あります。","o":["ことが","ものが","のが"],"a":0,"e":"〜たことがあります = experiência."},{"q":"\"É que eu quero ir\" (fala natural):","o":["行きたいんです","行きます","行きました"],"a":0,"e":"〜んです dá o tom de explicação."}]}]},{"id":"N2","label":"N2","desc":"Intermediário-alto.","grammar":["keigo (linguagem formal)","〜わけだ / 〜はずだ","〜において / 〜に関して","causa e efeito"],"core":[{"f":"達成","b":"realização / conquista","ex":"目標を達成しました。","exb":"Alcancei o objetivo.","r":"たっせい"},{"f":"克服","b":"superação","ex":"困難を克服しました。","exb":"Superei as dificuldades.","r":"こくふく"},{"f":"詳しい","b":"detalhado","ex":"詳しい説明が必要です。","exb":"É preciso uma explicação detalhada.","r":"くわしい"},{"f":"影響","b":"influência","ex":"天気が気分に影響します。","exb":"O tempo influencia o humor.","r":"えいきょう"},{"f":"傾向","b":"tendência","ex":"そういう傾向があります。","exb":"Há essa tendência.","r":"けいこう"},{"f":"解決","b":"solução","ex":"問題を解決しました。","exb":"Resolvi o problema.","r":"かいけつ"},{"f":"状況","b":"situação","ex":"状況が複雑です。","exb":"A situação é complicada.","r":"じょうきょう"},{"f":"判断","b":"julgamento","ex":"判断が早かったです。","exb":"O julgamento foi rápido.","r":"はんだん"},{"f":"認める","b":"reconhecer / admitir","ex":"失敗を認めました。","exb":"Admiti o erro.","r":"みとめる"},{"f":"結果","b":"resultado","ex":"結果は良かったです。","exb":"O resultado foi bom.","r":"けっか"},{"f":"強調","b":"ênfase","ex":"安全を強調しました。","exb":"Enfatizei a segurança.","r":"きょうちょう"},{"f":"評価","b":"avaliação","ex":"成果を評価します。","exb":"Avaliamos o desempenho.","r":"ひょうか"},{"f":"持続可能","b":"sustentável","ex":"持続可能な方法を探します。","exb":"Procuramos um método sustentável.","r":"じぞくかのう"},{"f":"枠組み","b":"arcabouço","ex":"明確な枠組みに従います。","exb":"Seguimos um arcabouço claro.","r":"わくぐみ"},{"f":"偏り","b":"viés","ex":"データに偏りがあります。","exb":"Há viés nos dados.","r":"かたより"},{"f":"広範","b":"amplo","ex":"広範な調査が行われました。","exb":"Foi feita uma investigação ampla.","r":"こうはん"}],"quiz":[{"q":"Keigo humilde de \"言う\":","o":["申します","おっしゃいます","言われます"],"a":0,"e":"申します é a forma humilde (謙譲語)."},{"q":"\"来るはずです\" significa:","o":["Deve vir (expectativa)","Não virá","Talvez venha"],"a":0,"e":"〜はずだ indica expectativa fundamentada."},{"q":"\"この件___、説明します。\" (a respeito deste assunto)","o":["に関して","によって","にとって"],"a":0,"e":"〜に関して = a respeito de, quanto a."},{"q":"\"影響\" significa:","o":["resultado","influência","tendência"],"a":1,"e":"影響 = influência, efeito."}],"lessons":[{"id":"N2-L1","title":"Leitura N2 — Condição, mudança gradual e o que dizem","intro":"O N2 trabalha nuances de condição e de informação de terceiros:\n\n1) 〜ば (se): condicional — 「練習すれば 話せる ように なります」 = \"se praticar, passa a conseguir falar\".\n\n2) 〜ように なる (passar a): marca uma mudança de estado/capacidade — 「食べられる ように なった」 = \"passei a conseguir comer\".\n\n3) 〜そうです / 〜に よると (dizem que / segundo): relata informação de fonte externa — 「ニュースに よると 雨だ そうです」 = \"segundo as notícias, dizem que vai chover\". Obrigação: 〜なければ なりません = \"precisar\".","reading":{"title":"会話: 上達 (Diálogo: progresso)","lines":[{"t":"日本語が 上手に なりましたね。","b":"Você ficou bom em japonês, hein."},{"t":"毎日 練習すれば、だれでも 話せる ように なります。","b":"Se praticar todo dia, qualquer um passa a conseguir falar."},{"t":"そうですか。がんばります。","b":"É mesmo? Vou me esforçar."},{"t":"ニュースに よると、来月 試験が あるそうです。","b":"Segundo as notícias, dizem que mês que vem tem uma prova."},{"t":"じゃ、いまから 準備しなければ なりませんね。","b":"Então preciso começar a me preparar desde já, né."}]},"vocab":[{"f":"〜ば","b":"se (condicional)"},{"f":"〜ようになる","b":"passar a (mudança)"},{"f":"〜によると","b":"segundo…"},{"f":"〜そうだ","b":"dizem que…"},{"f":"準備する","b":"preparar-se","r":"じゅんびする"}],"quiz":[{"q":"\"Se praticar, consegue\": 練習____、話せます。","o":["すれば","して","した"],"a":0,"e":"〜ば = condicional \"se\"."},{"q":"\"Passei a conseguir falar\": 話せる ____ なりました。","o":["ように","ことに","ために"],"a":0,"e":"〜ようになる = mudança de estado."},{"q":"\"Segundo as notícias…\": ニュース____","o":["によると","のように","のあいだ"],"a":0,"e":"〜によると introduz a fonte."}]}]},{"id":"N1","label":"N1","desc":"Avançado — japonês formal e escrito.","grammar":["expressões formais escritas","〜ものの / 〜ながらも","〜をもって / 〜に至る","estrutura textual avançada"],"core":[{"f":"洞察","b":"perspicácia","ex":"深い洞察が含まれています。","exb":"Contém uma percepção profunda.","r":"どうさつ"},{"f":"緩和","b":"atenuação","ex":"規制を緩和しました。","exb":"Flexibilizaram a regulamentação.","r":"かんわ"},{"f":"普及","b":"difusão","ex":"情報の普及が速いです。","exb":"A difusão da informação é rápida.","r":"ふきゅう"},{"f":"微妙","b":"sutil","ex":"微妙な違いがあります。","exb":"Há uma diferença sutil.","r":"びみょう"},{"f":"曖昧","b":"ambíguo","ex":"表現が曖昧です。","exb":"A expressão é ambígua.","r":"あいまい"},{"f":"顕著","b":"notável","ex":"顕著な差があります。","exb":"Há uma diferença notável.","r":"けんちょ"},{"f":"率直","b":"franco","ex":"彼の率直さに感心しました。","exb":"Admirei a franqueza dele.","r":"そっちょく"},{"f":"妥当","b":"apropriado / plausível","ex":"妥当な理由です。","exb":"É uma razão plausível.","r":"だとう"},{"f":"本質","b":"essência","ex":"問題の本質を見るべきです。","exb":"É preciso ver a essência do problema.","r":"ほんしつ"},{"f":"暗黙","b":"tácito","ex":"暗黙の了解でした。","exb":"Foi um consentimento tácito.","r":"あんもく"},{"f":"精緻","b":"minucioso / refinado","ex":"精緻な分析です。","exb":"É uma análise refinada.","r":"せいち"},{"f":"根拠","b":"fundamento","ex":"根拠が不足しています。","exb":"Falta fundamento.","r":"こんきょ"},{"f":"矛盾","b":"contradição","ex":"主張に矛盾があります。","exb":"Há contradição no argumento.","r":"むじゅん"},{"f":"是正","b":"correção","ex":"誤りを是正しました。","exb":"Corrigiu o erro.","r":"ぜせい"},{"f":"浸透","b":"permeação","ex":"文化が日常に浸透しました。","exb":"A cultura permeou o cotidiano.","r":"しんとう"},{"f":"逸脱","b ":"책을 읽어요.","exb":"Leio um livro."},{"f":"가방","b":"mochila, bolsa","ex":"가방이 커요.","exb":"A mochila é grande."},{"f":"의자","b":"cadeira","ex":"의자에 앉아요.","exb":"Sento na cadeira."},{"f":"연필","b":"lápis","ex":"연필로 써요.","exb":"Escrevo com lápis."},{"f":"방","b":"quarto","ex":"제 방은 작아요.","exb":"Meu quarto é pequeno."},{"f":"침대","b":"cama","ex":"침대에서 자요.","exb":"Durmo na cama."},{"f":"냉장고","b":"geladeira","ex":"냉장고에 우유가 있어요.","exb":"Há leite na geladeira."},{"f":"부엌","b":"cozinha","ex":"부엌에서 밥을 먹어요.","exb":"Como na cozinha."},{"f":"도서관","b":"biblioteca","ex":"도서관에 가요.","exb":"Vou à biblioteca."},{"f":"병원","b":"hospital","ex":"병원에 가요.","exb":"Vou ao hospital."},{"f":"공원","b":"parque","ex":"공원에서 운동해요.","exb":"Faço exercício no parque."},{"f":"우유","b":"leite","ex":"우유를 마셔요.","exb":"Bebo leite."},{"f":"빵","b":"pão","ex":"빵을 사요.","exb":"Compro pão."},{"f":"마시다","b":"beber","ex":"물을 마셔요.","exb":"Bebo água."},{"f":"사다","b":"comprar","ex":"빵을 사요.","exb":"Compro pão."},{"f":"읽다","b":"ler","ex":"책을 읽어요.","exb":"Leio um livro."},{"f":"누구","b":"quem","ex":"이 사람은 누구예요?","exb":"Quem é esta pessoa?"},{"f":"어디","b":"onde","ex":"학교는 어디예요?","exb":"Onde é a escola?"}],"quiz":[{"q":"Complete: \"저는 학생___.\" (Eu sou estudante)","o":["이에요","을","에"],"a":0,"e":"이에요/예요 é a forma educada de \"ser\" no presente."},{"q":"Qual partícula marca o objeto direto em \"밥__ 먹어요\"?","o":["이","을","에"],"a":1,"e":"을/를 marca o objeto direto. Após consoante final, usa-se 을."},{"q":"Como se diz \"não como\" (recusa/escolha)?","o":["안 먹어요","못 먹어요","먹었어요"],"a":0,"e":"안 nega por escolha; 못 indica impossibilidade."},{"q":"\"물\" significa:","o":["fogo","água","casa"],"a":1,"e":"물 = água."},{"q":"\"이 사람은 ____예요?\" (Quem é esta pessoa?)","o":["누구","어디","언제"],"a":0,"e":"누구 = quem."},{"q":"Marcador de objeto após palavra COM 받침 (batchim):","o":["을","를","는"],"a":0,"e":"받침 → 을; sem 받침 → 를. 밥을, mas 우유를."},{"q":"\"학교____ 가요.\" (Vou à escola — destino)","o":["에","에서","을"],"a":0,"e":"에 marca destino/direção com 가요/와요."},{"q":"\"도서관____ 책을 읽어요.\" (Leio na biblioteca — lugar da ação)","o":["에서","에","를"],"a":0,"e":"에서 marca o lugar onde a ação acontece."},{"q":"Negação de 가요: 학교에 ____ 가요.","o":["안","못","를"],"a":0,"e":"안 + verbo = negação simples (\"não vou\")."}],"lessons":[{"id":"T1-L1","title":"Lição 1 — Cumprimentos e apresentações","intro":"Em coreano, a saudação mais útil e educada é 안녕하세요 (annyeonghaseyo), que serve para \"olá\", \"bom dia\", \"boa tarde\" e \"boa noite\".\n\nPara se apresentar, usamos a estrutura «저는 + [nome] + 이에요/예요». 저는 significa \"eu\" (forma humilde) com a partícula de tópico 는. A terminação é 이에요 depois de consoante e 예요 depois de vogal — por isso \"마리아예요\" (Maria, termina em vogal) e \"준이에요\" (Jun, termina em consoante).\n\nPara perguntar o nome: 이름이 뭐예요? (Qual é o seu nome?). 뭐예요? quer dizer \"o que é?\".","reading":{"title":"Diálogo: um primeiro encontro","lines":[{"t":"안녕하세요.","b":"Olá."},{"t":"안녕하세요. 이름이 뭐예요?","b":"Olá. Qual é o seu nome?"},{"t":"저는 마리아예요.","b":"Eu sou a Maria."},{"t":"저는 준이에요. 만나서 반가워요.","b":"Eu sou o Jun. Prazer em conhecê-lo."},{"t":"어느 나라 사람이에요?","b":"De que país você é?"},{"t":"저는 브라질 사람이에요.","b":"Eu sou do Brasil."}]},"vocab":[{"f":"이름","b":"nome"},{"f":"저","b":"eu (humilde)"},{"f":"나라","b":"país"},{"f":"사람","b":"pessoa"},{"f":"만나다","b":"encontrar"},{"f":"반갑다","b":"estar contente em ver"}],"quiz":[{"q":"Complete: \"저는 학생___.\" (Eu sou estudante)","o":["이에요","예요","을"],"a":0,"e":"학생 termina em consoante → 이에요."},{"q":"\"이름이 ___?\" (Qual é o nome?)","o":["뭐예요","어디예요","누구예요"],"a":0,"e":"뭐예요? = o que é?"},{"q":"\"만나서 ___.\" (Prazer em conhecer)","o":["반가워요","고마워요","미안해요"],"a":0,"e":"만나서 반가워요 = prazer em conhecê-lo."}]},{"id":"T1-L2","title":"Lição 2 — Partículas e frases básicas","intro":"O coreano marca a função das palavras com partículas curtas.\n\n• Tópico 은/는: destaca o assunto da frase. Usa-se 은 depois de consoante e 는 depois de vogal (저는, 책은).\n• Sujeito 이/가: marca quem pratica a ação (시간이, 친구가).\n• Objeto 을/를: marca o que recebe a ação (커피를, 밥을).\n\nPara dizer que algo \"existe\" ou que \"você tem\", use 있어요; para \"não existe / não tem\", 없어요. O verbo \"ser\" no presente educado é 이에요/예요.","reading":{"title":"Leitura: pequenas frases do dia a dia","lines":[{"t":"이것은 책이에요.","b":"Isto é um livro."},{"t":"그 책은 재미있어요.","b":"Aquele livro é interessante."},{"t":"저는 시간이 있어요.","b":"Eu tenho tempo."},{"t":"동생은 학교에 가요.","b":"Meu irmão mais novo vai à escola."},{"t":"우리는 커피를 마셔요.","b":"Nós bebemos café."}]},"vocab":[{"f":"이것","b":"isto"},{"f":"책","b":"livro"},{"f":"재미있다","b":"ser interessante"},{"f":"있다","b":"existir / ter"},{"f":"동생","b":"irmão(ã) mais novo(a)"},{"f":"마시다","b":"beber"}],"quiz":[{"q":"\"저___ 학생이에요.\" (tópico, após vogal)","o":["는","은","이"],"a":0,"e":"저 termina em vogal → 는."},{"q":"\"커피___ 마셔요.\" (objeto, após vogal)","o":["를","을","은"],"a":0,"e":"커피 termina em vogal → 를."},{"q":"Para dizer \"eu tenho tempo\":","o":["시간이 있어요","시간이 없어요","시간을 가요"],"a":0,"e":"있어요 = existir / ter."}]},{"id":"T1-L3","title":"Lição 3 — 이에요/예요, família e 누구","intro":"O verbo \"ser\" no registro coloquial é 이에요 / 예요, no fim da frase: 「저는 학생이에요」 (Eu sou estudante). A escolha depende do 받침 (batchim, a consoante final da sílaba anterior): palavra COM 받침 → 이에요 (학생 → 학생이에요); SEM 받침 → 예요 (엄마 → 엄마예요).\n\nPara perguntar \"quem é?\", usa-se 누구: 「이 사람은 누구예요?」. A resposta nomeia a pessoa: 「우리 형이에요」 (É meu irmão mais velho).\n\nOs termos de parentesco dependem do sexo de quem fala: um homem chama o irmão mais velho de 형 e a irmã mais velha de 누나; uma mulher usa 오빠 e 언니.","reading":{"title":"대화: 이 사람은 누구예요? (Diálogo: quem é?)","lines":[{"t":"이 사람은 누구예요?","b":"Quem é esta pessoa?"},{"t":"우리 엄마예요.","b":"É a minha mãe."},{"t":"저 사람은요?","b":"E aquela pessoa?"},{"t":"우리 오빠예요.","b":"É o meu irmão mais velho."},{"t":"학생이에요?","b":"É estudante?"},{"t":"네, 학생이에요.","b":"Sim, é estudante."}]},"vocab":[{"f":"이에요/예요","b":"ser (coloquial)"},{"f":"누구","b":"quem"},{"f":"우리","b":"nosso(a) / meu(minha)"},{"f":"형","b":"irmão mais velho (de homem)"},{"f":"언니","b":"irmã mais velha (de mulher)"}],"quiz":[{"q":"엄마 (sem 받침) + ser:","o":["엄마예요","엄마이에요","엄마입니다요"],"a":0,"e":"sem 받침 → 예요."},{"q":"학생 (com 받침) + ser:","o":["학생이에요","학생예요","학생요"],"a":0,"e":"com 받침 → 이에요."},{"q":"Uma mulher chama o irmão mais velho de:","o":["오빠","형","누나"],"a":0,"e":"mulher: 오빠; homem: 형."}]},{"id":"T1-L4","title":"Lição 4 — Objeto 을/를 e lugar da ação 에서","intro":"A partícula de objeto marca o alvo do verbo. A forma depende do 받침: COM 받침 → 을 (밥 → 밥을), SEM 받침 → 를 (우유 → 우유를). Ex.: 「밥을 먹어요」, 「우유를 마셔요」.\n\nPara dizer ONDE uma ação acontece, usa-se 에서 depois do lugar: 「부엌에서 빵을 먹어요」 (Como pão na cozinha), 「교실에서 책을 읽어요」.\n\nPara perguntar \"o que você faz?\", usa-se 뭐 해요? (ou 뭘 해요?, contração de 무엇을). A resposta usa objeto + verbo no presente 아요/어요.","reading":{"title":"대화: 뭐 해요? (Diálogo: o que você faz?)","lines":[{"t":"뭐 해요?","b":"O que você está fazendo?"},{"t":"빵을 먹어요.","b":"Estou comendo pão."},{"t":"어디에서 먹어요?","b":"Onde você come?"},{"t":"부엌에서 먹어요.","b":"Como na cozinha."},{"t":"우유도 마셔요?","b":"Também bebe leite?"},{"t":"네, 우유를 마셔요.","b":"Sim, bebo leite."}]},"vocab":[{"f":"을/를","b":"partícula de objeto"},{"f":"에서","b":"em (lugar da ação)"},{"f":"뭐/뭘","b":"o quê"},{"f":"먹다","b":"comer"},{"f":"마시다","b":"beber"}],"quiz":[{"q":"우유 (sem 받침) + objeto:","o":["우유를","우유을","우유에서"],"a":0,"e":"sem 받침 → 를."},{"q":"밥 (com 받침) + objeto:","o":["밥을","밥를","밥에"],"a":0,"e":"com 받침 → 을."},{"q":"\"교실____ 책을 읽어요.\" (na sala de aula)","o":["에서","에","를"],"a":0,"e":"에서 = lugar da ação."}]},{"id":"T1-L5","title":"Lição 5 — Destino 에 가요/와요 e negação 안","intro":"Para indicar destino/direção, usa-se a partícula 에 depois do lugar, seguida de 가요 (ir) ou 와요 (vir): 「학교에 가요」 (Vou à escola), 「교실에 와요」 (Venho à sala).\n\nAtenção: 에 (destino) e 에서 (lugar da ação) não se confundem — 에 vai com 가요/와요; 에서 vai com verbos de ação feitos naquele lugar.\n\nA negação simples põe 안 imediatamente antes do verbo/adjetivo: 「학교에 안 가요」 (Não vou à escola), 「텔레비전을 안 봐요」 (Não vejo televisão).","reading":{"title":"대화: 어디에 가요? (Diálogo: aonde você vai?)","lines":[{"t":"도서관에 가요?","b":"Você vai à biblioteca?"},{"t":"아니요, 도서관에 안 가요.","b":"Não, não vou à biblioteca."},{"t":"그럼 어디에 가요?","b":"Então, aonde vai?"},{"t":"공원에 가요.","b":"Vou ao parque."},{"t":"저도 같이 가요.","b":"Eu também vou junto."}]},"vocab":[{"f":"에","b":"a/para (destino)"},{"f":"가요","b":"vai (de 가다, ir)"},{"f":"와요","b":"vem (de 오다, vir)"},{"f":"안","b":"não (negação)"},{"f":"아니요","b":"não (resposta)"}],"quiz":[{"q":"\"학교____ 가요.\" (destino)","o":["에","에서","을"],"a":0,"e":"에 marca destino com 가요/와요."},{"q":"Negar 봐요 (ver): 텔레비전을 ____ 봐요.","o":["안","못","를"],"a":0,"e":"안 + verbo = negação."},{"q":"가다 corresponde a:","o":["ir","vir","comer"],"a":0,"e":"가다 = ir; 오다 = vir."}]}]},{"id":"T2","label":"TOPIK 2","desc":"Básico — rotina, passado, futuro e conectivos simples.","grammar":["passado 았 / 었어요","futuro 을 거예요","conectivos 그리고 / 하지만","〜고 싶다 (querer fazer)"],"core":[{"f":"왜냐하면","b":"porque","ex":"왜냐하면 시간이 없었어요.","exb":"Porque eu não tinha tempo."},{"f":"가끔","b":"às vezes","ex":"가끔 운동해요.","exb":"Às vezes faço exercício."},{"f":"날씨","b":"tempo (clima)","ex":"오늘 날씨가 흐려요.","exb":"Hoje o tempo está nublado."},{"f":"벌써","b":"já","ex":"벌써 도착했어요.","exb":"Já cheguei."},{"f":"바쁘다","b":"estar ocupado","ex":"요즘 아주 바빠요.","exb":"Ultimamente estou muito ocupado."},{"f":"여행","b":"viagem","ex":"다음 달에 여행을 갈 거예요.","exb":"Vou viajar no mês que vem."},{"f":"기억하다","b":"lembrar","ex":"그 이름을 기억해요.","exb":"Lembro aquele nome."},{"f":"싸다","b":"ser barato","ex":"이 옷은 싸요.","exb":"Esta roupa é barata."},{"f":"도착하다","b":"chegar","ex":"기차가 늦게 도착했어요.","exb":"O trem chegou tarde."},{"f":"비싸다","b":"ser caro","ex":"이 가방은 너무 비싸요.","exb":"Esta bolsa é cara demais."},{"f":"건강","b":"saúde","ex":"건강이 제일 중요해요.","exb":"A saúde é o mais importante."},{"f":"시도하다","b":"tentar","ex":"다시 시도했어요.","exb":"Tentei de novo."},{"f":"동네","b":"bairro","ex":"우리 동네는 조용해요.","exb":"Nosso bairro é tranquilo."},{"f":"가져오다","b":"trazer","ex":"우산을 가져왔어요.","exb":"Trouxe o guarda-chuva."},{"f":"피곤하다","b":"estar cansado","ex":"오늘 정말 피곤해요.","exb":"Hoje estou muito cansado."},{"f":"충분하다","b":"ser suficiente","ex":"시간이 충분해요.","exb":"O tempo é suficiente."},{"f":"약속","b":"compromisso / promessa","ex":"내일 약속이 있어요.","exb":"Tenho um compromisso amanhã."},{"f":"준비하다","b":"preparar","ex":"시험을 준비하고 있어요.","exb":"Estou me preparando para a prova."},{"f":"연습하다","b":"praticar","ex":"매일 한국어를 연습해요.","exb":"Pratico coreano todos os dias."},{"f":"이유","b":"motivo","ex":"이유를 말해 주세요.","exb":"Por favor, diga o motivo."},{"f":"계획","b":"plano","ex":"주말 계획이 있어요?","exb":"Tem planos para o fim de semana?"},{"f":"기분","b":"humor / sensação","ex":"기분이 좋아요.","exb":"Estou de bom humor."},{"f":"쉽다","b":"ser fácil","ex":"이 문제는 쉬워요.","exb":"Esta questão é fácil."},{"f":"어렵다","b":"ser difícil","ex":"발음이 어려워요.","exb":"A pronúncia é difícil."},{"f":"책상","b":"mesa (escolar/de estudo)","ex":"책상 위에 책이 있어요.","exb":"Há um livro sobre a mesa."},{"f":"소파","b":"sofá","ex":"소파에 앉아요.","exb":"Sento no sofá."},{"f":"거실","b":"sala de estar","ex":"거실에서 텔레비전을 봐요.","exb":"Vejo televisão na sala."},{"f":"백화점","b":"loja de departamentos","ex":"백화점에서 옷을 사요.","exb":"Compro roupa na loja de departamentos."},{"f":"박물관","b":"museu","ex":"박물관에 가요.","exb":"Vou ao museu."},{"f":"자전거","b":"bicicleta","ex":"자전거를 타요.","exb":"Ando de bicicleta."},{"f":"운동장","b":"quadra, campo esportivo","ex":"운동장에서 축구를 해요.","exb":"Jogo futebol na quadra."},{"f":"앞","b":"frente","ex":"집 앞에 공원이 있어요.","exb":"Há um parque em frente à casa."},{"f":"뒤","b":"atrás","ex":"학교 뒤에 병원이 있어요.","exb":"Há um hospital atrás da escola."},{"f":"옆","b":"lado","ex":"냉장고 옆에 식탁이 있어요.","exb":"Há uma mesa ao lado da geladeira."},{"f":"위","b":"cima, sobre","ex":"책상 위에 시계가 있어요.","exb":"Há um relógio sobre a mesa."},{"f":"타다","b":"montar, andar de (transporte)","ex":"버스를 타요.","exb":"Pego o ônibus."}],"quiz":[{"q":"Passado de \"가요\" (ir):","o":["갔어요","갈 거예요","가고 싶어요"],"a":0,"e":"갔어요 é o passado educado de 가다."},{"q":"\"내일 서울에 ___.\" (Amanhã vou a Seul)","o":["갔어요","갈 거예요","가요?"],"a":1,"e":"〜을/ㄹ 거예요 expressa intenção futura."},{"q":"Como dizer \"quero comer\"?","o":["먹었어요","먹고 싶어요","안 먹어요"],"a":1,"e":"〜고 싶다 expressa desejo do próprio falante."},{"q":"Qual conectivo indica contraste?","o":["그리고","하지만","그래서"],"a":1,"e":"하지만 = mas / porém."},{"q":"\"책상 ____ 책이 있어요.\" (sobre a mesa)","o":["위에","안에","앞에"],"a":0,"e":"위 = cima/sobre."},{"q":"자전거를 ____ (andar de bicicleta)","o":["타요","먹어요","읽어요"],"a":0,"e":"타다 = montar/andar de."}],"lessons":[{"id":"T2-L1","title":"Leitura T2 — Passado, ligar ações e planos","intro":"No TOPIK 2 você conta o que já aconteceu e o que vai fazer:\n\n1) 았/었어요 (passado): 먹다 → 먹었어요 (comi), 보다 → 봤어요 (vi). A vogal segue a regra de 아/어.\n\n2) 고 (e): liga ações em sequência — 「친구를 만나고 영화를 봤어요」 = \"encontrei um amigo e vi um filme\".\n\n3) 지만 (mas): contraste — 「재미있었지만 피곤했어요」 = \"foi divertido, mas cansei\".\n\n4) (으)ㄹ 거예요 (futuro/intenção): 「여행을 갈 거예요」 = \"vou viajar\".","reading":{"title":"대화: 주말 (Diálogo: o fim de semana)","lines":[{"t":"주말에 뭐 했어요?","b":"O que você fez no fim de semana?"},{"t":"친구를 만나고 영화를 봤어요.","b":"Encontrei um amigo e vi um filme."},{"t":"재미있었어요?","b":"Foi divertido?"},{"t":"네, 재미있었지만 조금 피곤했어요.","b":"Sim, foi divertido, mas fiquei um pouco cansado."},{"t":"다음 주에는 뭐 할 거예요?","b":"E na próxima semana, o que vai fazer?"},{"t":"여행을 갈 거예요.","b":"Vou viajar."}]},"vocab":[{"f":"았/었어요","b":"(passado)"},{"f":"고","b":"e (liga ações)"},{"f":"지만","b":"mas"},{"f":"(으)ㄹ 거예요","b":"vou ~ (futuro)"},{"f":"영화","b":"filme"}],"quiz":[{"q":"먹다 no passado:","o":["먹었어요","먹을 거예요","먹고"],"a":0,"e":"먹다 → 먹었어요."},{"q":"\"foi divertido, mas cansei\": 재미있____ 피곤했어요.","o":["었지만","고","어서"],"a":0,"e":"지만 = \"mas\"."},{"q":"\"Vou viajar\": 여행을 ____.","o":["갈 거예요","갔어요","가고"],"a":0,"e":"(으)ㄹ 거예요 = futuro/intenção."}]}]},{"id":"T3","label":"TOPIK 3","desc":"Intermediário — opinião, contexto e formas honoríficas.","grammar":["〜는데 (contexto/contraste)","honorífico 〜(으)시","condicional 〜(으)면","〜아/어 보다 (experimentar)"],"core":[{"f":"비록","b":"embora","ex":"비록 어렵지만 계속할 거예요.","exb":"Embora seja difícil, vou continuar."},{"f":"조언","b":"conselho","ex":"좋은 조언 감사합니다.","exb":"Obrigado pelo bom conselho."},{"f":"개선하다","b":"melhorar","ex":"발음을 개선하고 싶어요.","exb":"Quero melhorar a pronúncia."},{"f":"환경","b":"meio ambiente","ex":"환경을 보호해야 해요.","exb":"Precisamos proteger o meio ambiente."},{"f":"가능하다","b":"ser possível","ex":"내일도 가능해요?","exb":"Amanhã também é possível?"},{"f":"그러나","b":"porém","ex":"그러나 결과는 달랐어요.","exb":"Porém, o resultado foi diferente."},{"f":"경험","b":"experiência","ex":"좋은 경험이었어요.","exb":"Foi uma boa experiência."},{"f":"필요하다","b":"ser necessário","ex":"연습이 필요해요.","exb":"É preciso praticar."},{"f":"능력","b":"habilidade","ex":"능력을 기르고 있어요.","exb":"Estou desenvolvendo minhas habilidades."},{"f":"제안하다","b":"sugerir / propor","ex":"다른 방법을 제안했어요.","exb":"Sugeri outro método."},{"f":"피하다","b":"evitar","ex":"실수를 피하고 싶어요.","exb":"Quero evitar erros."},{"f":"목적","b":"propósito","ex":"여행의 목적이 뭐예요?","exb":"Qual é o propósito da viagem?"},{"f":"달성하다","b":"alcançar (meta)","ex":"목표를 달성했어요.","exb":"Alcancei a meta."},{"f":"문제","b":"problema","ex":"문제가 생겼어요.","exb":"Surgiu um problema."},{"f":"신뢰","b":"confiança","ex":"신뢰가 중요해요.","exb":"A confiança é importante."},{"f":"노력","b":"esforço","ex":"노력하면 됩니다.","exb":"Se você se esforçar, dá certo."},{"f":"기회","b":"oportunidade","ex":"좋은 기회를 얻었어요.","exb":"Consegui uma boa oportunidade."},{"f":"선택하다","b":"escolher","ex":"하나만 선택하세요.","exb":"Escolha apenas um."},{"f":"설명하다","b":"explicar","ex":"천천히 설명해 주세요.","exb":"Explique devagar, por favor."},{"f":"이해하다","b":"entender","ex":"이제 이해했어요.","exb":"Agora entendi."},{"f":"관심","b":"interesse","ex":"한국 문화에 관심이 많아요.","exb":"Tenho muito interesse na cultura coreana."},{"f":"변화","b":"mudança","ex":"큰 변화가 있었어요.","exb":"Houve uma grande mudança."},{"f":"결정하다","b":"decidir","ex":"아직 결정하지 못했어요.","exb":"Ainda não consegui decidir."},{"f":"참여하다","b":"participar","ex":"행사에 참여했어요.","exb":"Participei do evento."}],"quiz":[{"q":"\"밥을 먹___ 친구가 왔어요.\" (Eu estava comendo e o amigo chegou)","o":["는데","으면","고 싶어"],"a":0,"e":"〜는데 apresenta o contexto ou pano de fundo da frase seguinte."},{"q":"Forma honorífica de \"가다\" para um superior:","o":["가요","가세요","갔어요"],"a":1,"e":"〜(으)시 eleva o sujeito; 가다 → 가세요."},{"q":"\"시간이 ___ 만나요.\" (Se tiver tempo, vamos nos encontrar)","o":["있으면","있어서","있는데"],"a":0,"e":"〜(으)면 forma o condicional \"se\"."},{"q":"O que \"〜아/어 보다\" expressa?","o":["obrigação","tentar / experimentar","negação"],"a":1,"e":"Indica experimentar fazer algo, como 먹어 보다 = experimentar comer."}],"lessons":[{"id":"T3-L1","title":"Leitura T3 — Causa, pedir um favor e condição","intro":"O TOPIK 3 expande conectores e pedidos:\n\n1) 아/어서 (porque / e então): causa ou sequência — 「길을 몰라서 물어봤어요」 = \"como não sabia o caminho, perguntei\".\n\n2) (으)면 (se): condição — 「이 길로 가면 오른쪽에 있어요」 = \"se for por esta rua, fica à direita\".\n\n3) 아/어 주세요 (por favor, faça por mim): pedido — 「사진을 찍어 주세요」 = \"tire uma foto, por favor\".\n\n4) 는 것 (o ato de): transforma o verbo em substantivo — 「사진을 찍는 것」 = \"o ato de tirar foto\".","reading":{"title":"대화: 길 묻기 (Diálogo: pedindo informação)","lines":[{"t":"길을 잘 몰라서 그런데요, 도서관이 어디예요?","b":"É que não sei bem o caminho — onde fica a biblioteca?"},{"t":"이 길로 쭉 가면 오른쪽에 있어요.","b":"Se for reto por esta rua, fica à direita."},{"t":"감사합니다. 사진을 찍어 주세요.","b":"Obrigado. Tire uma foto, por favor."},{"t":"여기에서 사진을 찍는 것은 괜찮아요?","b":"É permitido tirar foto aqui?"},{"t":"네, 괜찮아요.","b":"Sim, tudo bem."}]},"vocab":[{"f":"아/어서","b":"porque / e então"},{"f":"(으)면","b":"se"},{"f":"아/어 주세요","b":"faça por favor"},{"f":"는 것","b":"o ato de ~ (nominalização)"},{"f":"쭉","b":"reto, direto"}],"quiz":[{"q":"\"como não sabia, perguntei\": 몰____ 물어봤어요.","o":["라서","면","고"],"a":0,"e":"아/어서 = causa."},{"q":"\"se for por aqui\": 이 길로 가____","o":["면","서","지만"],"a":0,"e":"(으)면 = condição \"se\"."},{"q":"\"tire uma foto, por favor\": 사진을 찍어 ____.","o":["주세요","봤어요","거예요"],"a":0,"e":"아/어 주세요 = pedir favor."}]}]},{"id":"T4","label":"TOPIK 4","desc":"Intermediário-alto — causa, efeito e ideias abstratas.","grammar":["〜기 때문에 (causa)","passiva e causativa","〜는 것 (nominalização)","〜아/어야 하다 (dever)"],"core":[{"f":"그럼에도 불구하고","b":"mesmo assim","ex":"그럼에도 불구하고 포기하지 않았어요.","exb":"Mesmo assim, não desisti."},{"f":"성취","b":"conquista","ex":"큰 성취를 이뤘어요.","exb":"Alcancei uma grande conquista."},{"f":"극복하다","b":"superar","ex":"어려움을 극복했어요.","exb":"Superei as dificuldades."},{"f":"자세하다","b":"ser detalhado","ex":"자세한 설명이 필요해요.","exb":"É preciso uma explicação detalhada."},{"f":"영향","b":"influência","ex":"날씨가 기분에 영향을 줘요.","exb":"O tempo influencia o humor."},{"f":"경향","b":"tendência","ex":"그런 경향이 있어요.","exb":"Há essa tendência."},{"f":"해결하다","b":"resolver","ex":"문제를 해결했어요.","exb":"Resolvi o problema."},{"f":"상황","b":"situação","ex":"상황이 복잡해요.","exb":"A situação é complicada."},{"f":"판단","b":"julgamento","ex":"판단이 빨랐어요.","exb":"O julgamento foi rápido."},{"f":"인정하다","b":"reconhecer / admitir","ex":"실수를 인정했어요.","exb":"Admiti o erro."},{"f":"결과","b":"resultado","ex":"결과가 좋았어요.","exb":"O resultado foi bom."},{"f":"강조하다","b":"enfatizar","ex":"안전을 강조했어요.","exb":"Enfatizei a segurança."},{"f":"평가하다","b":"avaliar","ex":"성과를 평가해요.","exb":"Avaliamos o desempenho."},{"f":"지속 가능하다","b":"ser sustentável","ex":"지속 가능한 방법을 찾아요.","exb":"Procuramos um método sustentável."},{"f":"구조","b":"estrutura","ex":"문장 구조가 어려워요.","exb":"A estrutura da frase é difícil."},{"f":"편견","b":"preconceito / viés","ex":"편견을 버려야 해요.","exb":"É preciso abandonar o preconceito."},{"f":"광범위하다","b":"ser amplo","ex":"광범위한 조사가 있었어요.","exb":"Houve uma investigação ampla."},{"f":"분석하다","b":"analisar","ex":"자료를 분석했어요.","exb":"Analisei os dados."},{"f":"제도","b":"sistema / instituição","ex":"교육 제도가 바뀌었어요.","exb":"O sistema educacional mudou."},{"f":"현상","b":"fenômeno","ex":"흥미로운 현상이에요.","exb":"É um fenômeno interessante."},{"f":"증가하다","b":"aumentar","ex":"인구가 증가했어요.","exb":"A população aumentou."},{"f":"감소하다","b":"diminuir","ex":"판매가 감소했어요.","exb":"As vendas diminuíram."},{"f":"주장하다","b":"argumentar / alegar","ex":"그는 다르게 주장했어요.","exb":"Ele argumentou de forma diferente."},{"f":"근거","b":"fundamento / base","ex":"근거가 부족해요.","exb":"Falta fundamento."}],"quiz":[{"q":"\"비가 오___ 못 갔어요.\" (Não fui porque choveu)","o":["기 때문에","는데","으면"],"a":0,"e":"〜기 때문에 expressa causa de forma explícita."},{"q":"Como nominalizar \"읽다\" (ler) em \"ler é divertido\"?","o":["읽는 것","읽어서","읽으면"],"a":0,"e":"〜는 것 transforma o verbo em substantivo: 읽는 것이 재미있어요."},{"q":"\"매일 운동___ 해요.\" (Preciso me exercitar todo dia)","o":["해야","하고","하는데"],"a":0,"e":"〜아/어야 하다 expressa necessidade ou obrigação."},{"q":"\"증가하다\" significa:","o":["diminuir","aumentar","manter"],"a":1,"e":"증가하다 = aumentar; o oposto é 감소하다."}],"lessons":[{"id":"T4-L1","title":"Leitura T4 — Vir a acontecer, obrigação e causa","intro":"No TOPIK 4 as frases ganham consequência e obrigação:\n\n1) 게 되다 (vir a / acabar): resultado que não depende só de você — 「한국에서 일하게 됐어요」 = \"acabei conseguindo trabalhar na Coreia\".\n\n2) 기 때문에 (por causa de): causa mais formal — 「어렵기 때문에 공부해요」 = \"por ser difícil, estudo\".\n\n3) 아/어야 하다 (ter que): obrigação — 「매일 공부해야 해요」 = \"tenho que estudar todo dia\".\n\n4) (으)ㄹ 수 있다 (conseguir/poder): capacidade — 「잘할 수 있어요」 = \"consigo fazer bem\".","reading":{"title":"대화: 새 일 (Diálogo: um novo trabalho)","lines":[{"t":"한국에서 일하게 됐어요.","b":"Acabei conseguindo trabalhar na Coreia."},{"t":"축하해요! 그런데 한국어가 어렵지 않아요?","b":"Parabéns! Mas o coreano não é difícil?"},{"t":"어렵기 때문에 매일 공부해야 해요.","b":"Por ser difícil, tenho que estudar todos os dias."},{"t":"열심히 하면 잘할 수 있을 거예요.","b":"Se se esforçar, vai conseguir."},{"t":"고마워요. 열심히 할게요.","b":"Obrigado. Vou me esforçar."}]},"vocab":[{"f":"게 되다","b":"vir a / acabar ~"},{"f":"기 때문에","b":"por causa de ~"},{"f":"아/어야 하다","b":"ter que ~"},{"f":"(으)ㄹ 수 있다","b":"conseguir/poder ~"},{"f":"열심히","b":"com afinco"}],"quiz":[{"q":"\"acabei trabalhando na Coreia\": 한국에서 일하____ 됐어요.","o":["게","기","고"],"a":0,"e":"게 되다 = vir a/acabar."},{"q":"\"tenho que estudar todo dia\": 매일 공부____ 해요.","o":["해야","하고","하지만"],"a":0,"e":"아/어야 하다 = obrigação."},{"q":"\"consigo fazer bem\": 잘할 수 ____.","o":["있어요","없어요","해요"],"a":0,"e":"(으)ㄹ 수 있다 = conseguir."}]}]},{"id":"T5","label":"TOPIK 5","desc":"Avançado — argumentação, nuance e discurso indireto.","grammar":["〜더라도 (concessão)","discurso indireto (〜다고 하다)","conectivos avançados","〜(으)ㄹ 뿐만 아니라"],"core":[{"f":"분별하다","b":"discernir","ex":"사실과 의견을 분별해야 해요.","exb":"É preciso discernir fato de opinião."},{"f":"옹호하다","b":"defender (uma posição)","ex":"그 입장을 옹호했어요.","exb":"Defendeu aquela posição."},{"f":"설득력","b":"poder de persuasão","ex":"설득력이 있는 주장이에요.","exb":"É um argumento persuasivo."},{"f":"완화하다","b":"atenuar","ex":"규제를 완화했어요.","exb":"Flexibilizaram a regulamentação."},{"f":"지배적","b":"dominante","ex":"지배적인 의견이었어요.","exb":"Era a opinião dominante."},{"f":"뉘앙스","b":"nuance","ex":"두 단어의 뉘앙스가 달라요.","exb":"A nuance das duas palavras é diferente."},{"f":"성향","b":"inclinação / propensão","ex":"보수적인 성향이 있어요.","exb":"Tem uma inclinação conservadora."},{"f":"의존하다","b":"depender","ex":"결과에 의존하지 마세요.","exb":"Não dependa do resultado."},{"f":"내재적","b":"inerente","ex":"내재적인 한계가 있어요.","exb":"Há uma limitação inerente."},{"f":"모호하다","b":"ser ambíguo","ex":"표현이 모호해요.","exb":"A expressão é ambígua."},{"f":"입증하다","b":"comprovar","ex":"그 사실을 입증했어요.","exb":"Comprovou aquele fato."},{"f":"핵심적","b":"essencial / crucial","ex":"핵심적인 요소예요.","exb":"É um elemento crucial."},{"f":"불일치","b":"discrepância","ex":"자료에 불일치가 있어요.","exb":"Há discrepância nos dados."},{"f":"검토하다","b":"examinar / revisar","ex":"계획을 검토했어요.","exb":"Revisamos o plano."},{"f":"전제","b":"premissa","ex":"전제가 틀렸어요.","exb":"A premissa estava errada."},{"f":"타당하다","b":"ser válido / plausível","ex":"타당한 이유예요.","exb":"É uma razão válida."},{"f":"모순","b":"contradição","ex":"주장에 모순이 있어요.","exb":"Há contradição no argumento."},{"f":"본질","b":"essência","ex":"문제의 본질을 봐야 해요.","exb":"É preciso ver a essência do problema."},{"f":"통찰","b":"perspicácia","ex":"깊은 통찰이 담겨 있어요.","exb":"Contém uma percepção profunda."},{"f":"수용하다","b":"aceitar","ex":"비판을 수용했어요.","exb":"Aceitou a crítica."},{"f":"배제하다","b":"excluir","ex":"가능성을 배제할 수 없어요.","exb":"Não se pode excluir a possibilidade."},{"f":"우려","b":"preocupação","ex":"우려가 커지고 있어요.","exb":"A preocupação está aumentando."},{"f":"촉진하다","b":"promover / acelerar","ex":"성장을 촉진해요.","exb":"Promove o crescimento."},{"f":"확산","b":"difusão / propagação","ex":"정보의 확산이 빨라요.","exb":"A difusão da informação é rápida."}],"quiz":[{"q":"\"비가 오___ 갈 거예요.\" (Mesmo que chova, vou)","o":["더라도","기 때문에","으니까"],"a":0,"e":"〜더라도 indica concessão: \"mesmo que / ainda que\"."},{"q":"Discurso indireto de \"간다\": \"그는 간___ 했어요.\"","o":["다고","는데","어서"],"a":0,"e":"〜다고 하다 reporta a fala de outra pessoa."},{"q":"\"모호하다\" significa:","o":["ser claro","ser ambíguo","ser rápido"],"a":1,"e":"모호하다 = ambíguo, pouco claro."},{"q":"\"똑똑할 뿐만 아니라 성실해요\" significa:","o":["É inteligente, mas preguiçoso","Não só é inteligente como também é diligente","É inteligente ou diligente"],"a":1,"e":"〜(으)ㄹ 뿐만 아니라 = \"não só... como também\"."}],"lessons":[{"id":"T5-L1","title":"Leitura T5 — Mesmo que, quanto mais e discurso indireto","intro":"O TOPIK 5 lida com concessão e relato:\n\n1) 더라도 (mesmo que): concessão forte — 「힘들더라도 포기하지 마세요」 = \"mesmo que seja difícil, não desista\".\n\n2) (으)ㄹ수록 (quanto mais… mais…): 「배우면 배울수록 재미있어요」 = \"quanto mais se aprende, mais interessante fica\".\n\n3) 다고 하다 (dizem que / disse que): discurso indireto — 「다양하다고 했어요」 = \"disse que é diverso\".\n\n4) 는 편이다 (tende a ser): tendência — 「그렇게 생각하는 편이에요」 = \"tendo a pensar assim\".","reading":{"title":"대화: 언어와 문화 (Diálogo: língua e cultura)","lines":[{"t":"힘들더라도 포기하지 마세요.","b":"Mesmo que seja difícil, não desista."},{"t":"네. 언어는 배우면 배울수록 재미있어요.","b":"Sim. Quanto mais se aprende uma língua, mais interessante fica."},{"t":"친구가 한국 문화가 아주 다양하다고 했어요.","b":"Um amigo disse que a cultura coreana é muito diversa."},{
