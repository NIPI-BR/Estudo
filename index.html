let CONTENT_META={schema:0,source:'embutido',loaded:[]};
let MANIFEST=null;
const CONTENT_DIR='content/';

/* Carrega o manifesto (leve). Os idiomas vêm sob demanda. */
async function loadContent(){
  try{
    const res=await fetch(CONTENT_DIR+'index.json?v='+Date.now());
    if(!res.ok)throw 0;
    const m=await res.json();
    if(m&&Array.isArray(m.languages)&&m.languages.length){
      MANIFEST=m;
      CONTENT_META={schema:m.schema||2,source:'content/',updated:m.updated||'',loaded:[]};
      return;
    }
  }catch(e){/* sem content/ externo: usa o conteúdo embutido */}
  MANIFEST=EMBEDDED.manifest;
  CONTENT_META={schema:(EMBEDDED.manifest&&EMBEDDED.manifest.schema)||2,source:'embutido',updated:(EMBEDDED.manifest&&EMBEDDED.manifest.updated)||'',loaded:[]};
}

/* Busca o JSON de um idioma e o injeta no CURRICULUM (uma vez). */
const _langFetching={};
let LANG_RAW={};
async function ensureLangContent(code){
  if(!code||!MANIFEST)return false;
  if(CONTENT_META.loaded.includes(code))return true;
  if(_langFetching[code])return _langFetching[code];
  const entry=MANIFEST.languages.find(x=>x.code===code);
  if(!entry)return false;
  _langFetching[code]=(async()=>{
    let d=null;
    try{
      const res=await fetch(CONTENT_DIR+entry.file+'?v='+(entry.version||1));
      if(res.ok)d=await res.json();
    }catch(e){}
    if(!(d&&Array.isArray(d.levels)&&d.levels.length))d=(EMBEDDED.langs&&EMBEDDED.langs[code])||null; // fallback embutido
    if(d&&Array.isArray(d.levels)&&d.levels.length){
      LANG_RAW[code]=d;
      CURRICULUM[code]={framework:d.framework||entry.framework||'',levels:d.levels};
      if(!CONTENT_META.loaded.includes(code))CONTENT_META.loaded.push(code);
      return true;
    }
    return false;
  })();
  const ok=await _langFetching[code];
  delete _langFetching[code];
  return ok;
}

/* Garante o conteúdo do idioma ativo antes de abrir telas que dependem dele. */
async function withLangContent(fn){
  const code=langKey(curLang());
  if(code)await ensureLangContent(code);
  fn();
}

function langKey(l){const c=langCode(l);return ['en','es','ja','ko'].includes(c)?c:''}
function curCurriculum(){const k=langKey(curLang());return CURRICULUM[k]||null}
function levelById(curr,id){return curr?curr.levels.find(x=>x.id===id):null}
function levelLabel(l){if(!l.level)return '—';const c=CURRICULUM[langKey(l)];const lv=c&&c.levels.find(x=>x.id===l.level);return lv?lv.label:'—'}
function backfillReadings(){
  const ja=CURRICULUM.ja;if(!ja)return;
  const map={};ja.levels.forEach(lv=>lv.core.forEach(it=>{if(it.r)map[normWord(it.f)]=it.r}));
  let changed=false;
  DB.languages.forEach(l=>{
    if(!isJapaneseLang(l))return;
    l.vocab.forEach(c=>{
      if(!c.reading){const base=normWord(splitJp(c.front).base);if(map[base]){c.reading=map[base];changed=true;}}
    });
  });
  if(changed)save();
}

/* ---- persistência ---- */
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(DB))}catch(e){console.warn(e)}}
function load(){
  try{const raw=localStorage.getItem(STORE_KEY);if(raw)return JSON.parse(raw)}catch(e){}
  return null;
}
function curLang(){return DB.languages.find(l=>l.id===DB.currentLangId)||DB.languages[0]}

function logActivity(type,n){
  const k=todayKey();
  if(!DB.stats.log[k])DB.stats.log[k]={cards:0,quiz:0};
  DB.stats.log[k][type]=(DB.stats.log[k][type]||0)+n;
  save();
}

function boot(){
  DB = load();
  if(DB&&DB.languages){DB.languages.forEach(l=>{if(!l.songs)l.songs=[];if(!l.films)l.films=[];if(!l.lessonsDone)l.lessonsDone=[];
    l.songs.forEach(s=>{if(s.showGuide===undefined)s.showGuide=true;if(s.showQuiz===undefined)s.showQuiz=true;if(s.flashcards===undefined)s.flashcards=null;if(s.quiz===undefined)s.quiz=null;if(s.guide===undefined)s.guide=null;});});}
  if(DB&&!DB.settings)DB.settings={};
  if(DB&&DB.settings){const s=DB.settings;if(s.aiEndpoint==null)s.aiEndpoint='';if(s.catalogEndpoint==null)s.catalogEndpoint='';if(s.musicEndpoint==null)s.musicEndpoint='';if(!s.country)s.country='BR';if(!Array.isArray(s.providers))s.providers=[];if(!s.jpMode)s.jpMode='romaji';}
  if(DB&&DB.languages)backfillReadings();
  if(!DB || !DB.languages || !DB.learner.name){
    DB = DB || seed();
    showOnboarding();
  }else{
    if(!DB.currentLangId)DB.currentLangId=DB.languages[0]?.id;
    startApp();
  }
}

function showOnboarding(){
  const tmp = DB && DB.languages ? DB : seed();
  document.getElementById('onboarding').classList.remove('hidden');
  document.getElementById('app').classList.add('hidden');
  const sel=document.getElementById('onbLang');
  sel.innerHTML = tmp.languages.map(l=>`<option value="${l.id}">${l.flag} ${l.name}</option>`).join('');
  window.__tmpDB = tmp;
}
function finishOnboarding(){
  const name=document.getElementById('onbName').value.trim();

  DB = window.__tmpDB || seed();
  DB.learner.name=name;
  DB.currentLangId=document.getElementById('onbLang').value;
  save();
  document.getElementById('onboarding').classList.add('hidden');
  startApp();
}

}

let weekChartRef=null;
function drawWeekChart(){
  const labels=[],cards=[],quiz=[];
  for(let i=6;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);
    const k=d.toISOString().slice(0,10);
    labels.push(d.toLocaleDateString('pt-BR',{weekday:'short'}).replace('.',''));
    const e=DB.stats.log[k]||{};
    cards.push(e.cards||0);quiz.push(e.quiz||0);

  const ctx=document.getElementById('weekChart');if(!ctx)return;
  if(weekChartRef)weekChartRef.destroy();
  weekChartRef=new Chart(ctx,{

    data:{labels,datasets:[
      {label:'Flashcards',data:cards,backgroundColor:'#134E5E',borderRadius:6,stack:'a'},
      {label:'Gramática',data:quiz,backgroundColor:'#C9A227',borderRadius:6,stack:'a'}

function flipCard(){
  const fc=document.getElementById('fc');
  if(fc.classList.contains('flipped'))return;

}
/* SM-2 simplificado */
function rateCard(q){
  const c=session.card;
  if(q===0){ // errei
    c.reps=0;c.interval=0;c.ease=Math.max(1.3,c.ease-0.2);
    session.queue.push(c); // revê de novo na sessão
  }else{
    const quality=[null,3,4,5][q]; // hard/good/easy -> 3/4/5
    c.ease=Math.max(1.3,c.ease+(0.1-(5-quality)*(0.08+(5-quality)*0.02)));
    c.reps++;
    if(c.reps===1)c.interval=1;
    else if(c.reps===2)c.interval=q===1?2:6;
    else c.interval=Math.round(c.interval*c.ease);
    c.due=nowDays()+c.interval;
  }
  session.queue.shift();
  if(q!==0)session.done++;
  logActivity('cards',1);
  save();
  nextCard();
}

function renderQuestion(){
  const s=session.qz;const stage=document.getElementById('quizStage');
  if(s.i>=s.list.length){
    stage.innerHTML=`<div class="card pad empty">
      <div class="big">${s.score===s.list.length?'🏆':'📘'}</div>
      <h3 style="color:var(--petrol)">Você acertou ${s.score} de ${s.list.length}</h3>
      <p class="muted" style="margin:8px 0 16px">${s.score===s.list.length?'Perfeito!':'Continue praticando — a repetição constrói fluência.'}</p>
      <button class="btn gold" onclick="renderGrammar()">Refazer</button>
    </div>`;return;
  }
  const q=s.list[s.i];s.answered=false;
  const pct=Math.round((s.i/s.list.length)*100);
  stage.innerHTML=`
    <div style="height:6px;background:#e7e2d6;border-radius:99px;margin-bottom:18px;overflow:hidden">
      <div style="height:100%;width:${pct}%;background:var(--gold);transition:.3s"></div>
    </div>
    <div class="card pad">
      <div class="eyebrow">Questão ${s.i+1} de ${s.list.length}</div>
      <h3 style="font-size:1.2rem;margin:8px 0 16px">${esc(jpText(q.prompt))}</h3>
      <div id="opts">${q.options.map((o,idx)=>`<button class="opt" onclick="answer(${idx})">${esc(jpText(o))}</button>`).join('')}</div>
      <div id="explain"></div>
    </div>`;
}
function answer(idx){
  const s=session.qz;if(s.answered)return;s.answered=true;
  const q=s.list[s.i];
  const opts=document.querySelectorAll('#opts .opt');
  opts.forEach((b,i)=>{b.disabled=true;
    if(i===q.answer)b.classList.add('correct');
    else if(i===idx)b.classList.add('wrong');});
  if(idx===q.answer)s.score++;
  logActivity('quiz',1);
  document.getElementById('explain').innerHTML=`
    <div style="margin-top:14px;padding:12px 14px;border-radius:12px;background:#f4f1e8">
      <strong style="color:${idx===q.answer?'var(--ok)':'var(--warn)'}">${idx===q.answer?'Correto! ✓':'Resposta: '+esc(jpText(q.options[q.answer]))}</strong>
      ${q.explanation?`<p class="muted" style="margin-top:6px;font-size:.9rem">${esc(jpText(q.explanation))}</p>`:''}
    </div>
    <button class="btn block" style="margin-top:14px" onclick="session.qz.i++;renderQuestion()">
      ${s.i+1>=s.list.length?'Ver resultado':'Próxima'}</button>`;
}

        </select>

      </div>
      <div class="chat-log" id="chatLog"></div>
      <div class="chat-input">
        <input id="chatInput" class="input" placeholder="Escreva em ${esc(l.name)}..." onkeydown="if(event.key==='Enter')sendChat()">
        <button class="btn" id="chatSend" onclick="sendChat()">➤</button>
      </div>
      <p class="muted" style="font-size:.74rem;margin-top:8px">O tutor corrige seus erros e conversa no seu nível. A IA funciona dentro do app no claude.ai.</p>
    </div>`;
  paintChat();
}
function resetChat(){session.chat=[];paintChat()}
function paintChat(){
  const log=document.getElementById('chatLog');if(!log)return;
  if(session.chat.length===0){
    log.innerHTML=`<div class="bubble sys">Comece a conversar! Escreva uma frase e o tutor responde e corrige.</div>`;
  }else{
    log.innerHTML=session.chat.map(m=>`<div class="bubble ${m.role==='user'?'user':'ai'}">${esc(m.content)}</div>`).join('');
  }
  log.scrollTop=log.scrollHeight;
}
async function sendChat(){
  const input=document.getElementById('chatInput');
  const text=input.value.trim();if(!text)return;
  const l=curLang();
  const level=document.getElementById('chatLevel').value;
  session.chat.push({role:'user',content:text});
  input.value='';paintChat();
  const log=document.getElementById('chatLog');
  const typing=document.createElement('div');
  typing.className='bubble ai';typing.innerHTML='<span class="typing"><i></i><i></i><i></i></span>';
  log.appendChild(typing);log.scrollTop=log.scrollHeight;
  document.getElementById('chatSend').disabled=true;

  const sys=`Você é um tutor amigável de ${l.name} para um falante de português brasileiro de nível ${level}.
Regras:
- Responda principalmente em ${l.name}, de forma simples e adequada ao nível ${level}.
- Se o aluno cometer erros, corrija gentilmente: mostre a forma correta entre parênteses e uma breve explicação em português.
- Faça sempre uma pergunta de acompanhamento para manter a conversa.
- Seja breve (2-4 frases).`;

  try{
    const messages=session.chat.map(m=>({role:m.role,content:m.content}));
    const data=await callClaude(sys,messages);
    const reply=extractText(data).trim() || 'Desculpe, não consegui responder agora.';
    session.chat.push({role:'assistant',content:reply});
  }catch(e){
    session.chat.push({role:'assistant',content:'⚠️ Tutor de IA não conectado. Configure o endpoint em Gerenciar › Dados, ou use no preview do claude.ai.'});
  }finally{
    document.getElementById('chatSend').disabled=false;
    paintChat();
  }
}

    if(!d.settings)d.settings={};
    {const s=d.settings;if(s.aiEndpoint==null)s.aiEndpoint='';if(s.catalogEndpoint==null)s.catalogEndpoint='';if(s.musicEndpoint==null)s.musicEndpoint='';if(!s.country)s.country='BR';if(!Array.isArray(s.providers))s.providers=[];}
    d.languages.forEach(l=>{if(!l.songs)l.songs=[];if(!l.films)l.films=[];if(!l.lessonsDone)l.lessonsDone=[]});
    DB=d;save();refreshLangSwitch();renderManage();toast('Dados importados');
  }catch(e){toast('Arquivo inválido')}};
  r.readAsText(file);
}

function parseYouTube(url){
  if(!url)return null;
  let m=url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/);
  if(!m)return null;
  let t=0;const tm=url.match(/[?&]t=(\d+)/);if(tm)t=parseInt(tm[1]);
  return {id:m[1],t};
}

function renderLyrics(s){
  if(!s.lyrics.trim())return '<p class="muted">Sem letra cadastrada. Edite a música para colar a letra.</p>';
  const lines=s.lyrics.split('\n');
  return lines.map((ln,i)=>{
    if(!ln.trim())return '<div style="height:10px"></div>';
    const tr=(s.transLines&&s.transLines[i])?`<div style="font-size:.82rem;color:var(--gold);font-style:italic">${esc(s.transLines[i])}</div>`:'';
    return `<div style="padding:6px 0;border-bottom:1px dashed var(--line)">
      <div style="font-weight:500">${esc(ln)}</div>${tr}</div>`;
  }).join('');
}
function fmtSec(s){s=parseInt(s)||0;const m=Math.floor(s/60),x=s%60;return m+':'+String(x).padStart(2,'0')}

async function translateSong(id){
  const l=curLang();const s=l.songs.find(x=>x.id===id);if(!s)return;
  if(s.transLines){s.transLines=null;save();openSong(id);return} // toggle off
  if(!s.lyrics.trim()){toast('Cole a letra primeiro');return}
  const btn=document.getElementById('btnTrad');btn.disabled=true;btn.textContent='Traduzindo...';
  const lines=s.lyrics.split('\n');
  const sys=`Traduza para português brasileiro cada linha da letra de música em ${l.name}.
Responda APENAS com um array JSON de strings, sem markdown, com EXATAMENTE ${lines.length} itens, na mesma ordem.
Para linhas vazias, retorne string vazia "". Não adicione comentários.`;
  try{
    const numbered=lines.map((ln,i)=>`${i}: ${ln}`).join('\n');
    const data=await callClaude(sys,[{role:'user',content:numbered}]);
    let txt=extractText(data).replace(/```json|```/g,'').trim();
    let arr=JSON.parse(txt);
    if(!Array.isArray(arr))throw 0;
    s.transLines=lines.map((_,i)=>arr[i]||'');
    save();openSong(id);
  }catch(e){
    toast('Não foi possível traduzir agora');
    btn.disabled=false;btn.textContent='🌐 Traduzir letra';
  }
}

async function genFlashcards(id,force){
  const l=curLang();const s=l.songs.find(x=>x.id===id);if(!s)return;
  if(!s.lyrics.trim()){toast('Cole a letra primeiro');return}
  if(s.flashcards&&s.flashcards.length&&!force){ // já gerado: reaproveita, sem gastar IA
    session.genCards=s.flashcards.map(c=>({...c,pick:false}));
    showGenPreview(s);return;
  }
  modal(`<h3>Gerando flashcards…</h3><div style="text-align:center;padding:20px">
    <span class="typing"><i></i><i></i><i></i></span>
    <p class="muted" style="margin-top:12px">A IA está escolhendo o vocabulário útil da música.</p></div>`);
  const sys=`Você cria flashcards de vocabulário de ${l.name} para um falante de português brasileiro, a partir da letra de uma música.
Escolha entre 8 e 12 palavras ou expressões úteis e frequentes que aparecem NA letra (não invente).
Responda APENAS com um array JSON, sem markdown, no formato:
[{"front":"palavra/expressão em ${l.name}","back":"tradução em português","example":"a linha da música onde aparece"}]`;
  try{
    const data=await callClaude(sys,[{role:'user',content:s.lyrics}]);
    let txt=extractText(data).replace(/```json|```/g,'').trim();
    let arr=JSON.parse(txt);
    if(!Array.isArray(arr)||!arr.length)throw 0;
    s.flashcards=arr.filter(c=>c.front&&c.back).map(c=>({front:c.front,back:c.back,example:c.example||''}));
    save();
    session.genCards=s.flashcards.map(c=>({...c,pick:true}));
    openSong(id);showGenPreview(s);
  }catch(e){
    modal(`<h3>Ops</h3><p class="muted" style="margin-bottom:16px">Não consegui gerar os flashcards agora. A geração por IA funciona no preview do claude.ai.</p>
      <button class="btn block" onclick="closeModal()">Fechar</button>`);
  }
}

function addGenCards(){
  const l=curLang();let n=0,dup=0;
  session.genCards.filter(c=>c.pick).forEach(c=>{
    const base=normWord(splitJp(c.front).base);
    const exists=l.vocab.some(v=>normWord(splitJp(v.front).base)===base);
    if(exists){dup++;return;}
    l.vocab.push(vcard(c.front,c.back,c.example||''));n++;
  });
  save();closeModal();toast(n?`${n} card(s) no baralho${dup?` • ${dup} já existiam`:''}`:'Todos já estavam no baralho');
}

/* =========================================================
   FILMES & SÉRIES — vocabulário + cobertura
   ========================================================= */
function filmRec(o){return {id:uid(),title:o.title,note:o.note||'',source:o.source||'name',words:o.words||[]}}

/* ---- algoritmo: índice de conhecimento a partir de TODO o conteúdo ---- */
function normWord(s){
  return (s||'').toLowerCase()
    .replace(/\([^)]*\)/g,' ')              // remove romanização entre parênteses
    .replace(/[^\p{L}\p{N}\s]/gu,' ')        // remove pontuação
    .replace(/\s+/g,' ').trim();
}
function tokenize(s){return normWord(s).split(' ').filter(t=>t.length>1)}
function stemLatin(w){
  if(w.length<5)return w;
  return w.replace(/(mente|ções|ção|ndo|ado|ada|ados|adas|ing|ed|s|mos|emos|amos)$/,'');
}
function cardMastered(c){return (c.interval>=21)||(c.reps>=4)}

/* nível 2 = domino, 1 = conheço/em aprendizado, 0 = novo */
function buildKnowledge(l){
  const idx=new Map();
  const put=(tok,lvl)=>{
    if(!tok)return;
    if((idx.get(tok)||0)<lvl)idx.set(tok,lvl);
    const st=stemLatin(tok);
    if(st&&st!==tok&&(idx.get(st)||0)<lvl)idx.set(st,lvl);
  };
  // 1) flashcards: termo + exemplos
  l.vocab.forEach(c=>{
    const lvl=cardMastered(c)?2:1;
    tokenize(c.front).forEach(t=>put(t,lvl));
    tokenize(c.example).forEach(t=>put(t,1)); // exposição em exemplo
  });
  // 2) músicas que você traduziu (exposição)
  (l.songs||[]).forEach(s=>{if(s.transLines)tokenize(s.lyrics).forEach(t=>put(t,1))});
  // 3) filmes já estudados (palavras adicionadas voltam pelos cards; exemplos contam)
  return idx;
}
function wordStatus(word,idx){
  const toks=tokenize(word);
  if(!toks.length)return 'nova';
  let lvl=0;
  toks.forEach(t=>{let v=idx.get(t)||idx.get(stemLatin(t))||0;if(v>lvl)lvl=v});
  return lvl===2?'sei':lvl===1?'aprendendo':'nova';
}
function classifyFilm(film,l){
  const idx=buildKnowledge(l);
  const items=film.words.map(w=>({...w,status:wordStatus(w.front,idx)}));
  const sei=items.filter(i=>i.status==='sei').length;
  const apr=items.filter(i=>i.status==='aprendendo').length;
  const nova=items.filter(i=>i.status==='nova').length;
  const total=items.length||1;
  const pct=Math.round(((sei+apr*0.5)/total)*100);
  return {items,sei,apr,nova,total:items.length,pct};
}

  if(mode==='srt'){
    sys=`Você extrai vocabulário de ${l.name} a partir de legendas fornecidas pelo usuário, para um falante de português brasileiro.
Escolha de 20 a 40 palavras/expressões úteis e frequentes que REALMENTE aparecem no texto (não invente).

[{"front":"palavra/expressão em ${l.name}","back":"tradução em português","example":"trecho curto onde aparece"}]`;

   TESTE GRAMATICAL a partir de mídia (música/filme)
   ========================================================= */
async function genGrammarFromText(text,label){
  const l=curLang();
  modal(`<h3>Gerando teste…</h3><div style="text-align:center;padding:20px">
    <span class="typing"><i></i><i></i><i></i></span>
    <p class="muted" style="margin-top:12px">Criando questões de gramática em ${esc(l.name)}.</p></div>`);
  const sys=`Crie um teste de gramática de ${l.name} para um falante de português brasileiro, baseado no conteúdo a seguir (${label}).
Gere de 4 a 6 questões de múltipla escolha sobre estruturas gramaticais típicas ou que aparecem no conteúdo.
Cada questão deve ter: enunciado claro, 3 opções, o índice (0 a 2) da opção correta e uma explicação curta em português.
Responda APENAS com um array JSON, sem markdown:
[{"prompt":"","options":["","",""],"answer":0,"explanation":""}]`;
  try{
    const data=await callClaude(sys,[{role:'user',content:(text||'').slice(0,8000)}]);
    let txt=extractText(data).replace(/```json|```/g,'').trim();
    let arr=JSON.parse(txt);
    if(!Array.isArray(arr)||!arr.length)throw 0;
    let n=0;
    arr.forEach(q=>{
      if(q.prompt&&Array.isArray(q.options)&&q.options.length>=2&&typeof q.answer==='number'){
        const ans=Math.max(0,Math.min(q.options.length-1,q.answer));
        l.grammar.push(gq(q.prompt,q.options,ans,q.explanation||''));n++;
      }
    });
    save();closeModal();toast(n+' questões adicionadas à Gramática');
  }catch(e){
    modal(`<h3>Ops</h3><p class="muted" style="margin-bottom:16px">Não consegui gerar o teste agora. A IA funciona no preview do claude.ai ou com seu backend conectado.</p>
      <button class="btn block" onclick="closeModal()">Fechar</button>`);
  }
}

/* ===== Guia de estudo de música: vocabulário + partículas + focos do idioma ===== */
const LANG_STUDY_FOCUS={
  ja:{label:'Japonês',sub:'Por que o japonês se estuda diferente',axes:[
    {t:'Partículas (助詞)',d:'は, が, を, に, で, へ, と, も… marcam a função de cada termo — sujeito, objeto, destino, lugar. Não têm tradução própria: o sentido vem da palavra + a partícula. Numa música, olhe sempre a partícula depois de cada palavra.'},
    {t:'Kanji e furigana',d:'Cada kanji tem leituras variáveis. Estude o caractere junto da leitura em kana e do significado — o mesmo kanji muda de som conforme a palavra.'},
    {t:'Formas casual e polida',d:'O mesmo verbo alterna entre 〜る (casual) e 〜ます (polido). Letras usam quase sempre a forma casual.'}
  ]},
  ko:{label:'Coreano',sub:'Por que o coreano se estuda diferente',axes:[
    {t:'Partículas',d:'은/는 (tópico), 이/가 (sujeito), 을/를 (objeto), 에 (destino), 에서 (lugar da ação). A forma muda conforme a palavra termina em consoante ou vogal.'},
    {t:'받침 (batchim)',d:'A consoante final da sílaba decide a partícula (밥을 vs 우유를) e muda a pronúncia por ligação. É o primeiro filtro ao ler coreano.'},
    {t:'Níveis de fala e honoríficos',d:'A terminação do verbo (아요/어요, ㅂ니다, casual 반말) muda conforme respeito e distância. Letras alternam bastante.'}
  ]},
  es:{label:'Espanhol',sub:'Por que o espanhol se estuda diferente',axes:[
    {t:'Gênero e concordância',d:'Substantivos são masculinos/femininos; artigos e adjetivos concordam (el libro rojo / la casa roja).'},
    {t:'Conjugação verbal',d:'O verbo carrega a pessoa na terminação (canto/cantas/canta). Repare no tempo: presente, pretérito, subjuntivo.'},
    {t:'Ser vs estar',d:'Dois verbos onde o português usaria um — permanência vs estado/lugar. Muito comum em letras.'}
  ]},
  en:{label:'Inglês',sub:'Por que o inglês se estuda diferente',axes:[
    {t:'Phrasal verbs',d:'Verbo + partícula muda todo o sentido (give up, run into). Aprenda como bloco — raramente é a soma das palavras.'},
    {t:'Tempos verbais',d:'Present, past, present perfect, contínuo… A forma do verbo + auxiliares marcam quando a ação acontece.'},
    {t:'Contrações e fala reduzida',d:"I'm, don't, gonna, wanna — letras usam muito a forma falada. Reconheça a forma completa por trás."}
  ]}
};
function renderFocusBlock(code){

    f.axes.map(a=>`<div class="sg-axis"><div class="at">${esc(a.t)}</div><div class="ad">${esc(a.d)}</div></div>`).join('')+`</div>`;
}
async function genStudyGuide(id,force){

  const code=langKey(l);const isPart=(code==='ja'||code==='ko');
  modal(`<h3>Montando o guia…</h3><div style="text-align:center;padding:20px">
    <span class="typing"><i></i><i></i><i></i></span>
    <p class="muted" style="margin-top:12px">A IA está lendo a letra e explicando a partir dos trechos reais.</p></div>`);
  const readNote=code==='ja'
    ?'No campo "read" use kana + romaji. Nos campos "ex" e "central.jp", escreva a leitura de CADA palavra com kanji colocando o furigana entre parênteses logo após a palavra — por exemplo: 言葉(ことば)を 吐(は)いた. O app transforma isso em furigana automaticamente.'
    :(code==='ko'?'No campo "read" use a romanização (revised).':'No campo "read" use a pronúncia aproximada, ou deixe "".');
  const partCat=isPart?'- Inclua uma seção "Partículas" com as partículas que aparecem na letra.\n':'';
  const sys=`Você é professor de ${l.name} para falantes de português brasileiro. Seu método é orgânico: aprender a partir de conteúdo real que a pessoa já gosta.
REGRA CENTRAL: parta SEMPRE do trecho real da letra. Nunca explique no abstrato antes de mostrar o exemplo — toda explicação nasce de uma frase que apareceu na música.
Use SOMENTE palavras e trechos que aparecem na letra enviada (não invente). Cite apenas os trechos curtos necessários para ensinar.
${readNote}
"context" = o significado emocional/tema da música, em 3 a 4 linhas, em português brasileiro simples.
Organize o vocabulário em seções por categoria, nesta ordem: "Verbos", "Substantivos", "Adjetivos, advérbios e expressões"${isPart?', "Partículas"':''}, "Padrões gramaticais".
${partCat}Para os itens de "Partículas" e "Padrões gramaticais", dê DOIS níveis de explicação (ambos em português):
- "note": curta, simples e concreta, a partir do exemplo ("o que está acontecendo aqui"), sem jargão linguístico.
- "deep": mais séria e aprofundada, como um livro — a regra/estrutura por trás, quando se usa e cuidados. 2 a 4 frases.
Escolha também uma frase central marcante da letra (campo "central").
Linguagem simples, português brasileiro. Responda APENAS com JSON válido, sem markdown:
{"central":{"jp":"trecho na língua (com furigana entre parênteses, se japonês)","read":"leitura","pt":"tradução"},"context":"tema emocional em pt","sections":[{"cat":"Verbos","items":[{"w":"palavra","read":"leitura","pt":"significado em pt","ex":"trecho da letra","exPt":"tradução do trecho","tag":"verbo","note":"","deep":""}]}]}`;
  try{
    const data=await callClaude(sys,[{role:'user',content:s.lyrics.slice(0,6000)}],3200);
    let txt=extractText(data).replace(/```json|```/g,'').trim();
    const g=JSON.parse(txt);
    if(!g||!Array.isArray(g.sections)||!g.sections.length)throw 0;
    s.guide=g;s.showGuide=true;save();closeModal();openSong(id);
  }catch(e){

      <button class="btn block" onclick="closeModal()">Fechar</button>`);

}
function guideRuby(s){
  s=s||'';const mode=(DB.settings&&DB.settings.jpMode)||'romaji';
  const furi=isJapanese()&&mode==='furigana';
  let out='',last=0;const re=/([\u4e00-\u9faf々〆ヶ][\u4e00-\u9faf々〆ヶぁ-んゔァ-ヴー]*)\(([ぁ-んゔァ-ヴー]+)\)/g;let m;
  while((m=re.exec(s))){out+=esc(s.slice(last,m.index));out+=furi?`<ruby>${esc(m[1])}<rt>${esc(m[2])}</rt></ruby>`:esc(m[1]);last=m.index+m[0].length;}
  out+=esc(s.slice(last));return out;
}
function sgExample(it){
  if(!it.ex)return '';
  return `<div class="sg-lead"><div class="exj">${guideRuby(it.ex)}</div>`+(it.exPt?`<div class="expt">${esc(it.exPt)}</div>`:'')+`</div>`;
}

/* ---- chamada genérica ao Claude ---- */
async function callClaude(system,messages,maxTokens){
  const url=(DB.settings&&DB.settings.aiEndpoint)?DB.settings.aiEndpoint:"https://api.anthropic.com/v1/messages";
  const res=await fetch(url,{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:maxTokens||1000,system,messages})
  });
  return await res.json();
}
function extractText(data){return (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n')}

function addLevelQuiz(levelId){
  const l=curLang();const curr=curCurriculum();const lv=levelById(curr,levelId);
  if(!lv||!lv.quiz)return;
  let n=0;
  lv.quiz.forEach(it=>{
    const exists=l.grammar.some(g=>normWord(g.prompt)===normWord(it.q));
    if(!exists&&it.q&&Array.isArray(it.o)&&it.o.length>=2){
      l.grammar.push(gq(it.q,it.o,Math.max(0,Math.min(it.o.length-1,it.a||0)),it.e||''));n++;
    }
  });
  save();renderLevel();
  toast(n?`${n} questões adicionadas à Gramática`:'Todas já estão na Gramática');
}
function addLevelToDeck(levelId){
  const l=curLang();const curr=curCurriculum();const lv=levelById(curr,levelId);
  let n=0;
  lv.core.forEach(it=>{if(!deckCardFor(l,it)){l.vocab.push(vcard(it.f,it.b,it.ex||'',it.r||''));n++}});
  save();renderLevel();refreshLangSwitch();
  toast(n?`${n} itens adicionados ao baralho`:'Todos já estão no baralho');
}

/* ---- teste de nivelamento ---- */
function startPlacement(){
  const curr=curCurriculum();if(!curr)return;
  const allBacks=[];curr.levels.forEach(lv=>lv.core.forEach(it=>allBacks.push(it.b)));
  const qs=[];
  curr.levels.forEach(lv=>{
    [...lv.core].sort(()=>Math.random()-0.5).slice(0,2).forEach(it=>{
      const opts=[it.b];let g=0;
      while(opts.length<4&&g<80){g++;const cand=allBacks[Math.floor(Math.random()*allBacks.length)];if(!opts.includes(cand))opts.push(cand)}
      opts.sort(()=>Math.random()-0.5);
      qs.push({levelId:lv.id,word:it,options:opts,answer:opts.indexOf(it.b)});
    });
  });
  session.place={qs,i:0,perLevel:{}};
  renderPlacement();
}
function renderPlacement(){
  const p=session.place;const el=document.getElementById('view-level');
  if(p.i>=p.qs.length){finishPlacement();return}
  const q=p.qs[p.i];const pct=Math.round(p.i/p.qs.length*100);
  el.innerHTML=`
    <div class="section-h"><div><div class="eyebrow">Teste de nivelamento</div><h2 style="font-size:1.3rem">Questão ${p.i+1} de ${p.qs.length}</h2></div></div>
    <div style="height:6px;background:#e7e2d6;border-radius:99px;margin-bottom:18px;overflow:hidden"><div style="height:100%;width:${pct}%;background:var(--gold)"></div></div>
    <div class="card pad">
      <p class="muted" style="font-size:.84rem">O que significa:</p>
      <h3 style="font-size:1.6rem;margin:6px 0 16px">${langKey(curLang())==='ja'?`${esc(q.word.f)}${q.word.r?` <span class="muted" style="font-size:.6em">(${esc(q.word.r)})</span>`:''}`:esc(q.word.f)}</h3>
      ${q.options.map((o,i)=>`<button class="opt" onclick="placeAnswer(${i})">${esc(o)}</button>`).join('')}
      <button class="btn ghost block sm" style="margin-top:6px" onclick="placeAnswer(-1)">Não sei</button>
    </div>`;
}
function placeAnswer(idx){
  const p=session.place;const q=p.qs[p.i];
  if(!p.perLevel[q.levelId])p.perLevel[q.levelId]={c:0,t:0};
  p.perLevel[q.levelId].t++;
  if(idx===q.answer)p.perLevel[q.levelId].c++;
  p.i++;
  renderPlacement();
}
function finishPlacement(){
  const curr=curCurriculum();const p=session.place;const l=curLang();
  let assigned=curr.levels[0].id;
  for(const lv of curr.levels){
    const s=p.perLevel[lv.id]||{c:0,t:1};
    if((s.c/s.t)>=0.6)assigned=lv.id;else break;
  }
  l.level=assigned;save();refreshLangSwitch();
  const lv=levelById(curr,assigned);
  const el=document.getElementById('view-level');
  el.innerHTML=`<div class="card pad empty" style="margin-top:20px">
    <div class="big">🎯</div>
    <div class="eyebrow">Seu nível em ${esc(l.name)}</div>
    <div style="font-family:'DM Serif Display',serif;font-size:3rem;color:var(--petrol);line-height:1;margin:6px 0">${lv.label}</div>
    <p class="muted" style="margin:8px 0 18px">${esc(lv.desc)}</p>
    <button class="btn gold block" onclick="renderLevel()">Ver minha trilha</button>
    <button class="btn ghost block" style="margin-top:8px" onclick="go('cards')">Estudar agora</button>
  </div>`;
}

  }
  const idx=curr.levels.findIndex(x=>x.id===l.level);
  const lv=curr.levels[idx];const next=curr.levels[idx+1];
  const pr=levelProgress(l,lv);
  const items=lv.core.map(it=>({it,st:levelItemStatus(l,it)}));
  const todo=items.filter(x=>x.st!=='sei');
  const nova=todo.filter(x=>x.st==='nova');
  const apr=todo.filter(x=>x.st==='aprendendo');
  const sentences=[...todo,...items.filter(x=>x.st==='sei')].filter(x=>x.it.ex);
  let guide;
  if(pr.pct>=80){
    guide=`No nível <b>${lv.label}</b> você já domina <b>${pr.mastered} de ${pr.total}</b> palavras-chave (${pr.pct}%). Está quase lá — falta pouco para ${next?`avançar ao <b>${next.label}</b>`:'concluir o nível máximo'}. Revise os últimos itens e reforce a gramática do nível.`;
  }else if(pr.pct>=40){
    guide=`Você está no nível <b>${lv.label}</b> e já domina <b>${pr.mastered} de ${pr.total}</b> palavras-chave (${pr.pct}%). O foco agora são as <b>${nova.length}</b> palavras novas e as <b>${apr.length}</b> em andamento abaixo. Pratique também: ${esc(lv.grammar.join(', '))}.`;
  }else{
    guide=`Bem-vindo ao nível <b>${lv.label}</b>. Ainda há <b>${todo.length}</b> palavras-chave para dominar (${pr.pct}% concluído). Comece pelas palavras novas abaixo e vá praticando a gramática do nível: ${esc(lv.grammar.join(', '))}.`;
  }
  el.innerHTML=section('Leitura',l)+`
    <div class="card pad" style="margin-bottom:14px">
      <div class="eyebrow">O que falta no ${lv.label}</div>
      <p style="margin-top:8px;line-height:1.6">${guide}</p>
      <div style="height:8px;background:#e7e2d6;border-radius:99px;overflow:hidden;margin-top:12px"><div style="height:100%;width:${pr.pct}%;background:linear-gradient(90deg,var(--gold),var(--gold-soft))"></div></div>
    </div>

    ${(lv.lessons&&lv.lessons.length)?`<div class="card pad" style="margin-bottom:14px">
      <div class="eyebrow">Lições do ${lv.label}</div>
      <p class="muted" style="font-size:.82rem;margin:4px 0 10px">Conteúdo em formato de livro: explicação, leitura e exercícios.</p>
      ${lv.lessons.map((ls,i)=>{const done=(l.lessonsDone||[]).includes(ls.id);return `<div class="row-item" style="cursor:pointer" onclick="openLesson('${ls.id}')">
        <div class="lesson-chip ${done?'done':''}">${done?'✓':(i+1)}</div>
        <div class="grow"><div class="t">${esc(ls.title)}</div><div class="d">${ls.reading&&ls.reading.lines?ls.reading.lines.length+' linhas de leitura':''}${ls.quiz?' • '+ls.quiz.length+' exercícios':''}</div></div>
        <span style="color:var(--ink-soft)">›</span>
      </div>`}).join('')}
    </div>`:''}

    ${(isJapanese()&&LANG_RAW.ja&&LANG_RAW.ja.kanji)?`<div class="card pad" style="margin-bottom:14px">
      <div class="eyebrow">Kanji</div>
      <p class="muted" style="font-size:.82rem;margin:4px 0 10px">Estude os kanji por nível: leitura on/kun, significado e exemplo.</p>
      ${LANG_RAW.ja.kanji.levels.map(kl=>`<button class="btn ghost block sm" style="margin-bottom:6px" onclick="openKanjiList('${kl.id}')">漢字 ${kl.label} — ${kl.items.length} kanji</button>`).join('')}
    </div>`:''}

    ${todo.length?`<div class="card pad" style="margin-bottom:14px">
      <div class="eyebrow">Recomendado para você</div>
      <p class="muted" style="font-size:.8rem;margin:4px 0 10px">Esta lista evolui: itens dominados saem daqui automaticamente.</p>
      ${todo.map(x=>{const chip=x.st==='aprendendo'?'<span class="badge" style="background:#fbf0d8;color:#8a6a16">praticando</span>':'<span class="badge" style="background:#fbeae5;color:#8a3a25">nova</span>';
        return `<div class="row-item"><div class="grow"><div class="t">${dispItem(x.it)}</div><div class="d">${esc(x.it.b)}</div></div>${chip}</div>`}).join('')}
      <button class="btn gold block" style="margin-top:12px" onclick="addLevelToDeck('${lv.id}');go('reading')">+ Adicionar recomendados ao baralho</button>
    </div>`:`<div class="card pad" style="margin-bottom:14px;text-align:center"><div class="big" style="font-size:2rem">🏆</div><p class="muted">Você dominou todas as palavras-chave do ${lv.label}!${next?` Pronto para o ${next.label}.`:''}</p>${next?`<button class="btn gold" style="margin-top:10px" onclick="openLevel(curLang().id)">Ver trilha e avançar</button>`:''}</div>`}

    <div class="card pad">
      <div class="eyebrow">Leitura no seu nível</div>
      <p class="muted" style="font-size:.82rem;margin:6px 0 12px">Frases curtas com o vocabulário do ${lv.label}. Toque para ver a tradução.</p>
      ${sentences.length?sentences.map(x=>`<div class="row-item" style="display:block;cursor:pointer" onclick="this.querySelector('.tr').classList.toggle('hidden')">
        <div style="font-weight:500">${esc(jpText(x.it.ex))}</div>
        <div class="tr hidden" style="font-size:.86rem;color:var(--gold);font-style:italic;margin-top:4px">${esc(x.it.exb||'')}</div>
      </div>`).join(''):'<p class="muted">Sem frases cadastradas para este nível.</p>'}
    </div>`;
}

function currentLesson(id){
  const curr=curCurriculum();if(!curr)return null;
  for(const lv of curr.levels){if(lv.lessons){const f=lv.lessons.find(x=>x.id===id);if(f)return f;}}
  return null;
}
function openLesson(id){
  const l=curLang();const ls=currentLesson(id);
  if(!ls){go('reading');return;}
  const el=document.getElementById('view-reading');
  const done=(l.lessonsDone||[]).includes(id);
  const paras=(ls.intro||'').split(/\n\n+/).map(p=>`<p>${esc(jpText(p))}</p>`).join('');
  let lines=[];
  if(ls.reading&&Array.isArray(ls.reading.lines))lines=ls.reading.lines;
  else if(typeof ls.reading==='string'&&ls.reading.trim())lines=ls.reading.split('\n').filter(x=>x.trim()).map(t=>({t:t,b:''}));
  const vocab=ls.vocab||[];
  const quiz=ls.quiz||[];
  el.innerHTML=`
    <div class="section-h"><div><div class="eyebrow">${l.flag} ${esc(l.name)}</div></div>
      <button class="btn ghost sm" onclick="go('reading')">‹ Lições</button></div>
    <div class="book">
      <h2 class="lesson-title">${esc(ls.title)}</h2>

      <div class="card pad" style="margin:14px 0">
        <div class="eyebrow">Explicação</div>
        <div class="prose" style="margin-top:8px">${paras}</div>
      </div>

      ${lines.length?`<div class="card pad" style="margin-bottom:14px">
        <div class="eyebrow">${esc((ls.reading&&ls.reading.title)||'Leitura')}</div>
        <p class="muted" style="font-size:.78rem;margin:4px 0 10px">Toque em cada linha para ver a tradução.</p>
        <div class="passage">
          ${lines.map(li=>`<div class="pline" onclick="this.querySelector('.tr').classList.toggle('hidden')">
            <div class="src">${esc(jpText(li.t))}</div>
            <div class="tr hidden">${esc(li.b)}</div>
          </div>`).join('')}
        </div>
      </div>`:''}

      ${vocab.length?`<div class="card pad" style="margin-bottom:14px">
        <div class="eyebrow">Vocabulário da lição</div>
        <div style="margin-top:8px">
          ${vocab.map(w=>`<div class="row-item"><div class="grow"><div class="t">${dispItem(w)}</div><div class="d">${esc(w.b)}</div></div>
            <button class="icon-btn" title="Adicionar ao baralho" onclick="addLessonWord('${id}',${JSON.stringify(w.f).replace(/"/g,'&quot;')})">＋</button></div>`).join('')}
        </div>
        <button class="btn ghost block sm" style="margin-top:10px" onclick="addLessonVocab('${id}')">+ Adicionar todo o vocabulário ao baralho</button>
      </div>`:''}

      ${quiz.length?`<div class="card pad" style="margin-bottom:14px">
        <div class="eyebrow">Exercícios</div>
        ${quiz.map((qq,qi)=>`<div style="margin-top:14px">
          <p style="font-weight:600;margin-bottom:8px">${qi+1}. ${esc(jpText(qq.q))}</p>
          <div class="lq">
            ${qq.o.map((o,oi)=>`<button class="opt" data-cor="${oi===qq.a?1:0}" onclick="lqAnswer(this,${oi===qq.a?1:0},'lqe-${id}-${qi}')">${esc(jpText(o))}</button>`).join('')}
          </div>
          <div id="lqe-${id}-${qi}" class="hidden" style="margin-top:6px;padding:10px 12px;border-radius:10px;background:#f4f1e8;font-size:.88rem"><b>Explicação:</b> ${esc(jpText(qq.e||''))}</div>
        </div>`).join('')}
      </div>`:''}

      <button class="btn ${done?'ghost':'gold'} block" onclick="markLesson('${id}')">${done?'✓ Lição concluída — refazer marcação':'Marcar lição como concluída'}</button>
    </div>`;
  window.scrollTo(0,0);
}
function lqAnswer(btn,ok,expId){
  const box=btn.parentElement;
  [...box.querySelectorAll('.opt')].forEach(b=>b.disabled=true);
  btn.classList.add(ok?'correct':'wrong');
  if(!ok){const cor=box.querySelector('.opt[data-cor="1"]');if(cor)cor.classList.add('correct');}
  const e=document.getElementById(expId);if(e)e.classList.remove('hidden');
}
function addLessonWord(id,f){
  const l=curLang();const ls=currentLesson(id);if(!ls)return;
  const w=(ls.vocab||[]).find(x=>x.f===f);if(!w)return;
  if(deckCardFor(l,w)){toast('Já está no baralho');return;}
  l.vocab.push(vcard(w.f,w.b,'',w.r||''));save();toast('Adicionado ao baralho');
}
function addLessonVocab(id){
  const l=curLang();const ls=currentLesson(id);if(!ls)return;
  let n=0;(ls.vocab||[]).forEach(w=>{if(!deckCardFor(l,w)){l.vocab.push(vcard(w.f,w.b,'',w.r||''));n++}});
  save();toast(n?`${n} palavras adicionadas`:'Todas já estão no baralho');
}
function markLesson(id){
  const l=curLang();if(!l.lessonsDone)l.lessonsDone=[];
  if(!l.lessonsDone.includes(id))l.lessonsDone.push(id);
  save();toast('Lição concluída!');go('reading');
}

function kanjiLevel(id){const k=LANG_RAW.ja&&LANG_RAW.ja.kanji;if(!k)return null;return k.levels.find(x=>x.id===id)||null;}
function openKanjiList(levelId){
  const kl=kanjiLevel(levelId);if(!kl){go('reading');return;}
  session.kanjiLevel=levelId;
  const l=curLang();
  const el=document.getElementById('view-reading');
  el.innerHTML=`
    <div class="section-h"><div><div class="eyebrow">${l.flag} Japonês</div><h2 style="font-size:1.35rem">Kanji ${kl.label}</h2></div>
      <button class="btn ghost sm" onclick="go('reading')">‹ Leitura</button></div>
    <p class="muted" style="font-size:.84rem;margin-bottom:12px">${kl.items.length} kanji. Toque em um para ver leituras, significado e exemplo.</p>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px">
      ${kl.items.map((it,i)=>{const inDeck=deckCardFor(l,{f:it.c});return `<button onclick="openKanjiDetail('${levelId}',${i})" style="aspect-ratio:1;border:1px solid ${inDeck?'var(--gold)':'var(--line)'};background:${inDeck?'#faf6e8':'#fff'};border-radius:12px;font-family:'DM Serif Display',serif;font-size:1.8rem;color:var(--petrol);cursor:pointer">${it.c}</button>`}).join('')}
    </div>`;
  window.scrollTo(0,0);
}
function openKanjiDetail(levelId,i){
  const kl=kanjiLevel(levelId);if(!kl)return;
  const it=kl.items[i];if(!it)return;
  const l=curLang();const inDeck=deckCardFor(l,{f:it.c});
  const el=document.getElementById('view-reading');
  const nav=(d)=>{const n=i+d;if(n<0||n>=kl.items.length)return '';const dir=d<0?'‹':'›';return `<button class="btn ghost sm" onclick="openKanjiDetail('${levelId}',${n})">${dir}</button>`};
  el.innerHTML=`
    <div class="section-h"><div><div class="eyebrow">Kanji ${kl.label} • ${i+1}/${kl.items.length}</div></div>
      <button class="btn ghost sm" onclick="openKanjiList('${levelId}')">‹ Todos</button></div>
    <div class="card pad" style="text-align:center;margin-bottom:14px">
      <div style="font-family:'DM Serif Display',serif;font-size:5rem;line-height:1;color:var(--petrol)">${it.c}</div>
      <div style="font-size:1.1rem;font-weight:600;margin-top:8px">${esc(it.mean)}</div>
    </div>
    <div class="card pad" style="margin-bottom:14px">
      <div style="display:flex;gap:16px;flex-wrap:wrap">
        <div><div class="eyebrow">On'yomi (音)</div><div style="font-size:1.05rem;margin-top:4px">${esc(it.on||'—')}</div></div>
        <div><div class="eyebrow">Kun'yomi (訓)</div><div style="font-size:1.05rem;margin-top:4px">${esc(it.kun||'—')}</div></div>
      </div>
      <hr style="border:none;border-top:1px solid var(--line);margin:14px 0">
      <div class="eyebrow">Exemplo</div>
      <div style="font-size:1.15rem;margin-top:6px">${esc(it.ex)}</div>
      <div style="color:var(--gold);font-style:italic;font-size:.9rem;margin-top:4px">${esc(it.exb||'')}</div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px">
      ${nav(-1)}<div style="flex:1"></div>${nav(1)}
    </div>
    <button class="btn ${inDeck?'ghost':'gold'} block" onclick="addKanjiCard('${levelId}',${i})">${inDeck?'✓ Já no baralho':'+ Adicionar ao baralho'}</button>`;
  window.scrollTo(0,0);
}
function addKanjiCard(levelId,i){
  const kl=kanjiLevel(levelId);if(!kl)return;
  const it=kl.items[i];const l=curLang();
  if(deckCardFor(l,{f:it.c})){toast('Já está no baralho');return;}
  const reading=(it.kun||it.on||'').split(/[・\s]/)[0].replace(/\(.*?\)/g,'');
  l.vocab.push(vcard(it.c,it.mean,it.ex,reading));
  save();toast('Kanji adicionado ao baralho');openKanjiDetail(levelId,i);
}

/* =========================================================
   Helpers de UI
   ========================================================= */
function section(title,l){
  return `<div class="section-h">
    <div><div class="eyebrow">${l.flag} ${esc(l.name)}</div><h2>${title}</h2></div>
  </div>`;
}
function emptyBox(icon,title,desc,action,btn){
  return `<div class="card pad empty"><div class="big">${icon}</div>
    <h3 style="color:var(--petrol)">${title}</h3>
    <p class="muted" style="margin:8px 0 16px">${desc}</p>
    <button class="btn gold" onclick="${action}">${btn}</button></div>`;
}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
let toastTimer=null;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2200);}

/* go */
loadContent().then(boot);
</script>
</body>
</html>
