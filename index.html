<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIPI Línguas — Sistema de Estudo de Idiomas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --petrol:#0E3A45;
    --petrol-2:#134E5E;
    --petrol-soft:#1c6175;
    --gold:#C9A227;
    --gold-soft:#E2C766;
    --bg:#F6F4EE;
    --surface:#FFFFFF;
    --ink:#15282D;
    --ink-soft:#46595e;
    --line:#E4E0D6;
    --ok:#2E7D5B;
    --warn:#C0563A;
    --radius:16px;
    --shadow:0 6px 24px rgba(14,58,69,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'DM Sans',system-ui,sans-serif;
    background:var(--bg);
    color:var(--ink);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{font-family:'DM Serif Display',Georgia,serif;font-weight:400}
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  input,select,textarea{font-family:inherit;font-size:1rem}
  .hidden{display:none!important}

  /* ===== App shell ===== */
  .app{display:flex;flex-direction:column;min-height:100vh}
  header.topbar{
    background:linear-gradient(135deg,var(--petrol),var(--petrol-2));
    color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px;
    position:sticky;top:0;z-index:30;box-shadow:0 2px 14px rgba(0,0,0,.12)
  }
  .brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
  .brand .mark{
    width:34px;height:34px;border-radius:9px;flex:none;
    background:radial-gradient(circle at 30% 30%,var(--gold-soft),var(--gold));
    display:grid;place-items:center;color:var(--petrol);font-family:'DM Serif Display',serif;font-size:18px
  }
  .brand .title{font-family:'DM Serif Display',serif;font-size:1.15rem;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand .sub{font-size:.7rem;opacity:.7;letter-spacing:.14em;text-transform:uppercase}
  .lang-pill{
    background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);
    color:#fff;border-radius:999px;padding:6px 12px;font-size:.85rem;font-weight:500;
    display:flex;align-items:center;gap:6px
  }
  .lang-pill select{background:transparent;border:none;color:#fff;font-weight:600;outline:none}
  .lang-pill select option{color:var(--ink)}

  main{flex:1;width:100%;max-width:920px;margin:0 auto;padding:20px 16px 110px}

  /* ===== Nav ===== */
  nav.tabs{
    position:fixed;bottom:0;left:0;right:0;z-index:30;
    background:var(--surface);border-top:1px solid var(--line);
    display:flex;justify-content:space-around;padding:8px 4px env(safe-area-inset-bottom);
    box-shadow:0 -4px 18px rgba(14,58,69,.06)
  }
  nav.tabs button{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:6px 2px;color:var(--ink-soft);font-size:.66rem;font-weight:600;border-radius:12px;transition:.15s
  }
  nav.tabs button .ic{font-size:1.2rem;line-height:1}
  nav.tabs button.active{color:var(--petrol)}
  nav.tabs button.active .ic{transform:translateY(-1px)}

  /* ===== Cards / layout ===== */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .pad{padding:18px}
  .section-h{display:flex;align-items:baseline;justify-content:space-between;margin:4px 2px 14px}
  .section-h h2{font-size:1.5rem}
  .eyebrow{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700}
  .muted{color:var(--ink-soft)}
  .grid{display:grid;gap:14px}
  @media(min-width:620px){.grid.cols2{grid-template-columns:1fr 1fr}.grid.cols3{grid-template-columns:repeat(3,1fr)}}

  /* ===== Buttons ===== */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:var(--petrol);color:#fff;border-radius:12px;padding:12px 18px;
    font-weight:600;font-size:.95rem;transition:.15s;border:1px solid transparent
  }
  .btn:hover{background:var(--petrol-2)}
  .btn:active{transform:translateY(1px)}
  .btn.gold{background:var(--gold);color:var(--petrol)}
  .btn.gold:hover{background:var(--gold-soft)}
  .btn.ghost{background:transparent;color:var(--petrol);border-color:var(--line)}
  .btn.ghost:hover{background:#f0ede5}
  .btn.block{width:100%}
  .btn.sm{padding:8px 12px;font-size:.85rem;border-radius:10px}
  .btn:disabled{opacity:.45;cursor:not-allowed}

  /* ===== Forms ===== */
  label.field{display:block;margin-bottom:12px}
  label.field span{display:block;font-size:.8rem;font-weight:600;color:var(--ink-soft);margin-bottom:5px}
  .input{
    width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)
  }
  .input:focus{outline:2px solid var(--gold-soft);border-color:var(--gold)}
  textarea.input{resize:vertical;min-height:70px}

  /* ===== Stats / metrics ===== */
  .metric{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
  .metric .n{font-family:'DM Serif Display',serif;font-size:2rem;color:var(--petrol);line-height:1}
  .metric .l{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);margin-top:6px;font-weight:600}
  .metric .l b{color:var(--gold)}

  /* ===== Flashcard ===== */
  .flash-wrap{display:flex;flex-direction:column;align-items:center;gap:18px}
  .flashcard{
    width:100%;max-width:460px;aspect-ratio:3/2;perspective:1200px;cursor:pointer
  }
  .flash-inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d}
  .flashcard.flipped .flash-inner{transform:rotateY(180deg)}
  .flash-face{
    position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;
    box-shadow:var(--shadow)
  }
  .flash-front{background:linear-gradient(135deg,var(--petrol),var(--petrol-2));color:#fff}
  .flash-back{background:var(--surface);border:1px solid var(--line);color:var(--ink);transform:rotateY(180deg)}
  .flash-face .word{font-family:'DM Serif Display',serif;font-size:2rem;line-height:1.15}
  .flash-face .ex{margin-top:14px;font-size:.92rem;font-style:italic;opacity:.85;max-width:90%}
  .flash-face .tag{position:absolute;top:14px;left:16px;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;opacity:.7;font-weight:700}
  .flash-hint{font-size:.8rem;color:var(--ink-soft)}
  .rate-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:460px}
  .rate-row button{padding:12px 4px;border-radius:12px;font-weight:600;font-size:.82rem;color:#fff;border:none}
  .r-again{background:#C0563A}.r-hard{background:#D08A36}.r-good{background:#2E7D5B}.r-easy{background:#1c6175}

  /* ===== Quiz ===== */
  .opt{
    display:block;width:100%;text-align:left;padding:14px 16px;border:1px solid var(--line);
    border-radius:12px;background:#fff;margin-bottom:10px;font-weight:500;transition:.12s
  }
  .opt:hover{border-color:var(--petrol-soft)}
  .opt.correct{background:#e7f4ed;border-color:var(--ok);color:#1c5a40}
  .opt.wrong{background:#fbeae5;border-color:var(--warn);color:#8a3a25}
  .opt:disabled{cursor:default}

  /* ===== Chat ===== */
  .chat-log{display:flex;flex-direction:column;gap:10px;min-height:240px;max-height:46vh;overflow-y:auto;padding:4px}
  .bubble{padding:10px 14px;border-radius:14px;max-width:85%;font-size:.92rem;white-space:pre-wrap;line-height:1.45}
  .bubble.user{align-self:flex-end;background:var(--petrol);color:#fff;border-bottom-right-radius:4px}
  .bubble.ai{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
  .bubble.sys{align-self:center;background:#efe9d8;color:var(--ink-soft);font-size:.8rem;border-radius:999px;padding:6px 14px}
  .chat-input{display:flex;gap:8px;margin-top:12px}
  .typing{display:inline-flex;gap:4px}.typing i{width:7px;height:7px;border-radius:50%;background:var(--petrol-soft);animation:bl 1s infinite}
  .typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  @keyframes bl{0%,60%,100%{opacity:.3}30%{opacity:1}}

  /* ===== Lists / editor ===== */
  .row-item{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:8px}
  .row-item .grow{flex:1;min-width:0}
  .row-item .grow .t{font-weight:600}
  .row-item .grow .d{font-size:.84rem;color:var(--ink-soft)}
  .icon-btn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:1rem;border:1px solid var(--line);background:#fff;color:var(--ink-soft)}
  .icon-btn:hover{background:#f0ede5}
  .seg{display:flex;background:#efe9d8;border-radius:12px;padding:4px;gap:4px;margin-bottom:16px}
  .seg button{flex:1;padding:9px;border-radius:9px;font-weight:600;font-size:.85rem;color:var(--ink-soft)}
  .seg button.active{background:#fff;color:var(--petrol);box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .empty{text-align:center;padding:34px 18px;color:var(--ink-soft)}
  .empty .big{font-size:2.4rem;margin-bottom:8px}

  /* ===== Onboarding ===== */
  .onb{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(160deg,var(--petrol),var(--petrol-2))}
  .onb .box{background:var(--surface);border-radius:22px;padding:30px 26px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .onb h1{font-size:1.9rem;color:var(--petrol);margin-bottom:4px}
  .onb .mk{width:54px;height:54px;border-radius:14px;background:radial-gradient(circle at 30% 30%,var(--gold-soft),var(--gold));display:grid;place-items:center;font-family:'DM Serif Display',serif;font-size:28px;color:var(--petrol);margin-bottom:16px}

  /* ===== Modal ===== */
  .modal-bg{position:fixed;inset:0;background:rgba(14,40,45,.55);z-index:60;display:grid;place-items:center;padding:18px}
  .modal{background:#fff;border-radius:18px;width:100%;max-width:440px;max-height:88vh;overflow-y:auto;padding:22px}
  .modal h3{font-size:1.3rem;color:var(--petrol);margin-bottom:14px}
  .toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--petrol);color:#fff;padding:10px 18px;border-radius:999px;font-size:.88rem;z-index:80;box-shadow:var(--shadow);opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
  .badge{font-size:.66rem;font-weight:700;padding:3px 8px;border-radius:999px;background:#efe9d8;color:var(--petrol-2)}
  .due-dot{background:var(--gold);color:var(--petrol)}

  /* ===== Leitura estilo livro ===== */
  .book{max-width:640px;margin:0 auto}
  .book .lesson-title{font-family:'DM Serif Display',serif;font-size:1.6rem;color:var(--petrol);line-height:1.2;margin-bottom:4px}
  .book .prose{line-height:1.75;font-size:1rem;color:var(--ink)}
  .book .prose p{margin-bottom:12px}
  .book .passage{background:#fbf9f3;border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .book .pline{padding:9px 0;border-bottom:1px dashed var(--line);cursor:pointer}
  .book .pline:last-child{border-bottom:none}
  .book .pline .src{font-size:1.08rem;line-height:1.5}
  .book .pline .tr{font-size:.9rem;color:var(--gold);font-style:italic;margin-top:3px}
  .book .drop{border-left:3px solid var(--gold);padding-left:12px}
  .lesson-chip{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;flex:none;background:#efe9d8;color:var(--petrol-2);font-weight:700}
  .lesson-chip.done{background:var(--ok);color:#fff}
/* ===== Guia de estudo de música ===== */
.sg-central{background:var(--petrol);color:#fff;border-radius:14px;padding:16px 16px 14px;margin-bottom:14px}
.sg-central .cjp{font-size:1.12rem;font-weight:700;line-height:1.35}
.sg-central .cread{font-size:.82rem;color:var(--gold-soft);margin-top:3px}
.sg-central .cpt{font-size:.9rem;font-style:italic;opacity:.9;margin-top:8px;border-top:1px solid rgba(255,255,255,.15);padding-top:8px}
.sg-tip{background:#fff;border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:.86rem;color:var(--ink-soft);line-height:1.5}
.sg-focus{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:16px}
.sg-focus h4{color:var(--petrol);font-size:.95rem;margin-bottom:4px}
.sg-focus .sub{font-size:.76rem;color:var(--ink-soft);margin-bottom:12px}
.sg-axis{padding:9px 0;border-top:1px dashed var(--line)}
.sg-axis:first-of-type{border-top:0}
.sg-axis .at{font-weight:700;color:var(--petrol-soft);font-size:.86rem}
.sg-axis .ad{font-size:.82rem;color:var(--ink-soft);line-height:1.45;margin-top:2px}
.sg-sec{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700;margin:18px 0 8px}
.sg-card{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:9px}
.sg-card .w{font-size:1.35rem;font-weight:700;color:var(--petrol);min-width:2.4em;text-align:center;line-height:1.1}
.sg-card .bd{flex:1;min-width:0}
.sg-card .rd{font-size:.78rem;color:var(--petrol-soft);font-weight:600}
.sg-card .pt{font-size:.92rem;font-weight:600;margin:2px 0 6px}
.sg-card .ex{font-size:.86rem;background:var(--bg);border-radius:8px;padding:6px 9px}
.sg-card .expt{font-size:.78rem;color:var(--ink-soft);font-style:italic;margin-top:3px}
.sg-card .note{font-size:.78rem;color:var(--ink-soft);margin-top:6px;line-height:1.4}
.sg-card .note b{color:var(--petrol-soft)}
.sg-tag{align-self:flex-start;font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;background:var(--bg);color:var(--ink-soft);border:1px solid var(--line);border-radius:20px;padding:2px 8px;font-weight:700}

/* guia de música — método orgânico (exemplo-primeiro + aprofundar) */
.sg-lead{background:linear-gradient(180deg,#fff,var(--bg));border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;padding:11px 13px;margin-bottom:2px}
.sg-lead .exj{font-size:1.04rem;line-height:1.75}
.sg-lead .expt{font-size:.8rem;color:var(--ink-soft);font-style:italic;margin-top:4px}
.sg-lead ruby rt,.sg-card .ex ruby rt,.sg-central ruby rt{font-size:.55em;opacity:.85}
.sg-card.teach{flex-direction:column;gap:8px;align-items:stretch}
.sg-card.teach .formula{font-size:1.06rem;font-weight:700;color:var(--petrol)}
.sg-card.teach .rd{font-size:.78rem;color:var(--petrol-soft);font-weight:600}
details.sg-deep{margin-top:2px;border-top:1px dashed var(--line);padding-top:8px}
details.sg-deep summary{cursor:pointer;font-size:.78rem;font-weight:700;color:var(--petrol-soft);list-style:none}
details.sg-deep summary::-webkit-details-marker{display:none}
details.sg-deep summary::before{content:'▸ ';color:var(--gold)}
details.sg-deep[open] summary::before{content:'▾ '}
details.sg-deep .dbody{font-size:.82rem;color:var(--ink-soft);line-height:1.55;margin-top:7px}
.linklike{background:none;border:none;color:var(--gold);font-weight:700;font-size:.74rem;cursor:pointer;padding:0;text-decoration:underline}
</style>
</head>
<body>

<!-- ONBOARDING -->
<div id="onboarding" class="onb hidden">
  <div class="box">
    <div class="mk">N</div>
    <h1>NIPI Línguas</h1>
    <p class="muted" style="margin-bottom:20px">Seu sistema integrado de estudo de idiomas. Vamos começar criando seu perfil.</p>
    <label class="field"><span>Como podemos te chamar?</span>
      <input id="onbName" class="input" placeholder="Seu nome" maxlength="40"></label>
    <label class="field"><span>Qual idioma você quer estudar primeiro?</span>
      <select id="onbLang" class="input"></select></label>
    <button class="btn gold block" onclick="finishOnboarding()">Começar a estudar</button>
  </div>
</div>

<!-- APP -->
<div id="app" class="app hidden">
  <header class="topbar">
    <div class="brand">
      <div class="mark">N</div>
      <div style="min-width:0">
        <div class="title">NIPI Línguas</div>
        <div class="sub">Estudo integrado</div>
      </div>
    </div>
    <div class="lang-pill">
      <span>🌐</span>
      <select id="langSwitch" onchange="switchLang(this.value)"></select>
    </div>
  </header>

  <main>
    <!-- INÍCIO -->
    <section id="view-home"></section>
    <!-- FLASHCARDS -->
    <section id="view-cards" class="hidden"></section>
    <!-- GRAMÁTICA -->
    <section id="view-grammar" class="hidden"></section>
    <!-- CONVERSA -->
    <section id="view-chat" class="hidden"></section>
    <!-- MÚSICA -->
    <section id="view-music" class="hidden"></section>
    <!-- GERENCIAR -->
    <section id="view-manage" class="hidden"></section>
    <!-- LEITURA -->
    <section id="view-reading" class="hidden"></section>
    <!-- NÍVEL -->
    <section id="view-level" class="hidden"></section>
  </main>

  <nav class="tabs">
    <button data-view="home" class="active" onclick="go('home')"><span class="ic">🏠</span>Início</button>
    <button data-view="cards" onclick="go('cards')"><span class="ic">🃏</span>Cards</button>
    <button data-view="grammar" onclick="go('grammar')"><span class="ic">✏️</span>Gramática</button>
    <button data-view="chat" onclick="go('chat')"><span class="ic">💬</span>Conversa</button>
    <button data-view="music" onclick="go('music')"><span class="ic">🎬</span>Mídia</button>
    <button data-view="reading" onclick="go('reading')"><span class="ic">📖</span>Leitura</button>
    <button data-view="manage" onclick="go('manage')"><span class="ic">⚙️</span>Gerenciar</button>
  </nav>
</div>

<div id="toast" class="toast"></div>
<div id="modalHost"></div>

<script>
/* =========================================================
   NIPI Línguas — núcleo de dados
   ========================================================= */
const STORE_KEY = 'nipi_linguas_v1';
const FLAGS = ['🇬🇧','🇪🇸','🇫🇷','🇮🇹','🇩🇪','🇧🇷','🇵🇹','🇯🇵','🇰🇷','🇨🇳','🇷🇺','🌐'];
const PROVIDERS=[
  {k:'netflix',n:'Netflix'},{k:'prime',n:'Prime Video'},{k:'disney',n:'Disney+'},
  {k:'max',n:'Max'},{k:'appletv',n:'Apple TV+'},{k:'paramount',n:'Paramount+'},
  {k:'crunchyroll',n:'Crunchyroll'},{k:'globoplay',n:'Globoplay'},{k:'viki',n:'Rakuten Viki'}
];
const COUNTRIES=[{k:'BR',n:'Brasil'},{k:'PT',n:'Portugal'},{k:'US',n:'Estados Unidos'}];
const LANG_CODES={'inglês':'en','ingles':'en','espanhol':'es','francês':'fr','frances':'fr','italiano':'it','alemão':'de','alemao':'de','português':'pt','portugues':'pt','japonês':'ja','japones':'ja','coreano':'ko','chinês':'zh','chines':'zh','russo':'ru'};
function langCode(l){return l.code||LANG_CODES[normWord(l.name)]||''}
function provName(k){const p=PROVIDERS.find(x=>x.k===k);return p?p.n:k}
function isJapaneseLang(l){return l&&(l.code==='ja'||/japon/.test(normWord(l.name)))}
function isJapanese(){return isJapaneseLang(curLang())}
function splitJp(front){const m=(front||'').match(/^(.*?)\s*\(([^)]*)\)\s*$/);return m?{base:m[1].trim(),romaji:m[2].trim()}:{base:(front||'').trim(),romaji:''}}
function jpRender(front,reading){
  const {base,romaji}=splitJp(front);
  const mode=(DB.settings&&DB.settings.jpMode)||'romaji';
  if(mode==='romaji')return esc(base)+(romaji?` <span style="opacity:.65;font-size:.85em">(${esc(romaji)})</span>`:'');
  if(mode==='furigana'){
    if(!/[\u4e00-\u9faf]/.test(base))return esc(base); // só kana: sem furigana
    const rt=reading||romaji;
    return rt?`<ruby>${esc(base)}<rt style="font-size:.55em;opacity:.85">${esc(rt)}</rt></ruby>`:esc(base);
  }
  return esc(base); // off / só kanji
}
function dispWord(o){return isJapanese()?jpRender(o.front,o.reading):esc(o.front)}
function jpStripRomaji(s){return (s||'').replace(/\s*\(([a-z]+(?:\s*\/\s*[a-z]+)*)\)/g,'')}

to viés."},{"f":"evaluar","b":"avaliar","ex":"Evaluamos los resultados cada mes.","exb":"Avaliamos os resultados todo mês."},{"f":"debilitar","b":"enfraquecer","ex":"La duda puede debilitar el avance.","exb":"A dúvida pode enfraquecer o avanço."},{"f":"marco","b":"arcabouço","ex":"Seguimos un marco claro.","exb":"Seguimos um arcabouço claro."}],"quiz":[{"q":"\"Si ___ rico, viajaría más.\"","o":["soy","fuera","seré"],"a":1,"e":"Condicional irreal usa subjuntivo imperfecto."},{"q":"Voz passiva de \"Construyeron la casa\":","o":["La casa construyó","La casa fue construida","La casa está construyendo"],"a":1,"e":"Ser + particípio forma a passiva."},{"q":"Estilo indirecto de \"Estoy cansado\", dijo:","o":["Dijo que está cansado","Dijo que estaba cansado","Dice que estaba cansado"],"a":1,"e":"O presente recua ao imperfecto no discurso indireto."},{"q":"\"Ojalá ___ venido.\"","o":["ha","hubiera","habrá"],"a":1,"e":"Ojalá + subjuntivo para desejo irreal no passado."}]},{"id":"C1","label":"C1","desc":"Avançado.","grammar":["subjuntivo pluscuamperfecto","conectores del discurso","oraciones concesivas","registro formal"],"core":[{"f":"discernir","b":"discernir","ex":"Es difícil discernir la verdad.","exb":"É difícil discernir a verdade."},{"f":"abogar","b":"defender","ex":"Aboga por la reforma.","exb":"Defende a reforma."},{"f":"convincente","b":"convincente","ex":"Presentó un caso convincente.","exb":"Apresentou um caso convincente."},{"f":"mitigar","b":"mitigar","ex":"Se tomaron medidas para mitigar el riesgo.","exb":"Tomaram-se medidas para mitigar o risco."},{"f":"predominante","b":"predominante","ex":"Esa visión es predominante hoy.","exb":"Essa visão é predominante hoje."},{"f":"matiz","b":"nuance","ex":"El matiz pasa desapercibido.","exb":"A nuance passa despercebida."},{"f":"índole","b":"índole","ex":"Es un problema de otra índole.","exb":"É um problema de outra índole."},{"f":"recurrir","b":"recorrer","ex":"Recurrieron a otra estrategia.","exb":"Recorreram a outra estratégia."},{"f":"inherente","b":"inerente","ex":"Hay una limitación inherente.","exb":"Há uma limitação inerente."},{"f":"aliviar","b":"aliviar","ex":"La medida alivió la carga.","exb":"A medida aliviou o fardo."},{"f":"ambiguo","b":"ambíguo","ex":"Su respuesta fue ambigua.","exb":"A resposta dele foi ambígua."},{"f":"fundamentar","b":"fundamentar","ex":"No pudieron fundamentar la acusación.","exb":"Não conseguiram fundamentar a acusação."},{"f":"crucial","b":"crucial","ex":"Fue un momento crucial.","exb":"Foi um momento crucial."},{"f":"discrepancia","b":"discrepância","ex":"Hallamos una discrepancia en las cifras.","exb":"Encontramos uma discrepância nos números."},{"f":"escrutinio","b":"escrutínio","ex":"El informe fue sometido a escrutinio.","exb":"O relatório foi submetido a escrutínio."},{"f":"sostener","b":"sustentar","ex":"Los críticos sostienen lo contrario.","exb":"Os críticos sustentam o contrário."}],"quiz":[{"q":"\"Si ___ estudiado, habría aprobado.\"","o":["hubiera","habría","he"],"a":0,"e":"Pluscuamperfecto de subjuntivo na prótase."},{"q":"Conector de contraste formal:","o":["por lo tanto","no obstante","además"],"a":1,"e":"\"No obstante\" introduz contraste."},{"q":"\"Por más que ___, no lo logró.\"","o":["intentó","intentara","intenta"],"a":1,"e":"Concessiva com subjuntivo."},{"q":"\"Índole\" significa aproximadamente:","o":["natureza / caráter","tamanho","urgência"],"a":0,"e":"Índole = natureza ou caráter de algo."}]},{"id":"C2","label":"C2","desc":"Domínio.","grammar":["matices de registro","modismos avançados","subordinadas complexas","elipsis"],"core":[{"f":"ubicuo","b":"onipresente","ex":"Las pantallas son ubicuas hoy.","exb":"As telas são onipresentes hoje."},{"f":"efímero","b":"efêmero","ex":"La fama puede ser efímera.","exb":"A fama pode ser efêmera."},{"f":"meticuloso","b":"meticuloso","ex":"Es meticuloso con los detalles.","exb":"É meticuloso com os detalhes."},{"f":"paradigma","b":"paradigma","ex":"Esto marca un cambio de paradigma.","exb":"Isto marca uma mudança de paradigma."},{"f":"yuxtaponer","b":"justapor","ex":"La obra yuxtapone pasado y presente.","exb":"A obra justapõe passado e presente."},{"f":"esotérico","b":"esotérico","ex":"El tema es algo esotérico.","exb":"O tema é um tanto esotérico."},{"f":"franqueza","b":"franqueza","ex":"Agradecí su franqueza.","exb":"Agradeci a franqueza dela."},{"f":"soslayar","b":"contornar / evitar","ex":"Soslayó la pregunta.","exb":"Contornou a pergunta."},{"f":"tácito","b":"tácito","ex":"Hubo un acuerdo tácito.","exb":"Houve um acordo tácito."},{"f":"ofuscar","b":"obscurecer","ex":"La jerga puede ofuscar el sentido.","exb":"O jargão pode obscurecer o sentido."},{"f":"inocuo","b":"inócuo","ex":"El comentario parecía inocuo.","exb":"O comentário parecia inócuo."},{"f":"permear","b":"permear","ex":"El optimismo permea el texto.","exb":"O otimismo permeia o texto."},{"f":"sobresaliente","b":"saliente / notável","ex":"Obtuvo un resultado sobresaliente.","exb":"Obteve um resultado notável."},{"f":"equívoco","b":"ambíguo","ex":"La evidencia es equívoca.","exb":"A evidência é ambígua."},{"f":"impregnar","b":"impregnar","ex":"La idea impregnó el debate.","exb":"A ideia impregnou o debate."},{"f":"contundente","b":"contundente","ex":"Dio una respuesta contundente.","exb":"Deu uma resposta contundente."}],"quiz":[{"q":"\"Soslayar\" significa:","o":["enfrentar","evitar / contornar","exagerar"],"a":1,"e":"Soslayar = esquivar-se de algo."},{"q":"\"Tácito\" quer dizer:","o":["explícito","implícito","ruidoso"],"a":1,"e":"Tácito = subentendido, não declarado."},{"q":"\"Ubicuo\" significa:","o":["raro","presente em toda parte","antigo"],"a":1,"e":"Ubicuo = onipresente."},{"q":"Registro mais formal para \"pero\":","o":["pero","no obstante","y"],"a":1,"e":"\"No obstante\" pertence ao registro formal."}]}]},"ja":{"code":"ja","name":"Japonês","flag":"🇯🇵","framework":"JLPT","version":6,"updated":"2026-07-11","note":"Vocabulário, leituras (furigana), exemplos e questões autorais, organizados pelos níveis do JLPT. Caracteres/leituras dos kanji e listas por nível são fatos linguísticos; escopo de vocabulário/gramática iniciante calibrado a partir de materiais de referência públicos (ver content/CONTENT-LICENSE.md).","levels":[{"id":"N5","label":"N5","desc":"Iniciante — base de kana e kanji simples.","grammar":["partículas は / が / を","です / ます","adjetivos い e な","これ・それ・あれ (kosoado)","partícula の (posse/ligação)","números e contadores (〜つ, 〜円)","pedidos com 〜てください"],"core":[{"f":"こんにちは","b":"olá","ex":"こんにちは、田中です。","exb":"Olá, sou o Tanaka.","r":""},{"f":"水","b":"água","ex":"毎日水を飲みます。","exb":"Bebo água todos os dias.","r":"みず"},{"f":"家","b":"casa","ex":"家に帰ります。","exb":"Volto para casa.","r":"いえ"},{"f":"食べる","b":"comer","ex":"七時に晩ご飯を食べます。","exb":"Janto às sete.","r":"たべる"},{"f":"大きい","b":"ser grande","ex":"あれは大きい犬です。","exb":"Aquele é um cachorro grande.","r":"おおきい"},{"f":"友達","b":"amigo","ex":"友達に会います。","exb":"Encontro um amigo.","r":"ともだち"},{"f":"日","b":"dia","ex":"いい日ですね。","exb":"Que belo dia, não?","r":"ひ"},{"f":"いい","b":"bom","ex":"このコーヒーはいいです。","exb":"Este café é bom.","r":""},{"f":"働く","b":"trabalhar","ex":"小さい会社で働きます。","exb":"Trabalho numa empresa pequena.","r":"はたらく"},{"f":"家族","b":"família","ex":"家族は四人です。","exb":"Somos quatro na família.","r":"かぞく"},{"f":"町","b":"cidade / vila","ex":"この町は静かです。","exb":"Esta cidade é tranquila.","r":"まち"},{"f":"住む","b":"morar","ex":"海の近くに住んでいます。","exb":"Moro perto do mar.","r":"すむ"},{"f":"名前","b":"nome","ex":"お名前は何ですか。","exb":"Qual é o seu nome?","r":"なまえ"},{"f":"食べ物","b":"comida","ex":"食べ物ができました。","exb":"A comida ficou pronta.","r":"たべもの"},{"f":"小さい","b":"ser pequeno","ex":"小さい車があります。","exb":"Tenho um carro pequeno.","r":"ちいさい"},{"f":"欲しい","b":"querer (ter)","ex":"水が欲しいです。","exb":"Quero água.","r":"ほしい"},{"f":"これ","b":"isto (perto de quem fala)","ex":"これは本です。","exb":"Isto é um livro.","r":""},{"f":"それ","b":"isso (perto de quem ouve)","ex":"それはペンですか。","exb":"Isso é uma caneta?","r":""},{"f":"あれ","b":"aquilo (longe dos dois)","ex":"あれは学校です。","exb":"Aquilo é uma escola.","r":""},{"f":"どこ","b":"onde","ex":"トイレはどこですか。","exb":"Onde é o banheiro?","r":""},{"f":"学校","b":"escola","ex":"学校に行きます。","exb":"Vou à escola.","r":"がっこう"},{"f":"先生","b":"professor(a)","ex":"先生に聞きます。","exb":"Pergunto ao professor.","r":"せんせい"},{"f":"学生","b":"estudante","ex":"私は学生です。","exb":"Sou estudante.","r":"がくせい"},{"f":"本","b":"livro","ex":"本を読みます。","exb":"Leio um livro.","r":"ほん"},{"f":"車","b":"carro","ex":"車で行きます。","exb":"Vou de carro.","r":"くるま"},{"f":"駅","b":"estação (de trem)","ex":"駅で会います。","exb":"Encontro na estação.","r":"えき"},{"f":"電話","b":"telefone","ex":"電話をします。","exb":"Faço uma ligação.","r":"でんわ"},{"f":"今日","b":"hoje","ex":"今日は寒いです。","exb":"Hoje está frio.","r":"きょう"},{"f":"明日","b":"amanhã","ex":"明日行きます。","exb":"Vou amanhã.","r":"あした"},{"f":"行く","b":"ir","ex":"学校へ行きます。","exb":"Vou para a escola.","r":"い(く)"},{"f":"来る","b":"vir","ex":"友達が来ます。","exb":"Um amigo vem.","r":"く(る)"},{"f":"見る","b":"ver, olhar","ex":"映画を見ます。","exb":"Vejo um filme.","r":"み(る)"},{"f":"読む","b":"ler","ex":"新聞を読みます。","exb":"Leio o jornal.","r":"よ(む)"},{"f":"飲む","b":"beber","ex":"お茶を飲みます。","exb":"Bebo chá.","r":"の(む)"},{"f":"買う","b":"comprar","ex":"パンを買います。","exb":"Compro pão.","r":"か(う)"},{"f":"書く","b":"escrever","ex":"手紙を書きます。","exb":"Escrevo uma carta.","r":"か(く)"}],"quiz":[{"q":"\"私___学生です。\" (Eu sou estudante)","o":["は","を","へ"],"a":0,"e":"A partícula は marca o tópico da frase."},{"q":"\"ありがとう\" significa:","o":["desculpa","obrigado(a)","tchau"],"a":1,"e":"ありがとう = obrigado(a)."},{"q":"Pedir algo educadamente: \"水を___\"","o":["ください","です","ます"],"a":0,"e":"〜をください = \"... por favor\"."},{"q":"Qual partícula marca o objeto direto? \"ご飯___食べます\"","o":["が","を","に"],"a":1,"e":"を marca o objeto direto."},{"q":"\"____ は本です。\" (Isto é um livro.)","o":["これ","そこ","どこ"],"a":0,"e":"これ = \"isto\", perto de quem fala."},{"q":"Para perguntar \"onde é?\" usa-se:","o":["いつ ですか","どこ ですか","だれ ですか"],"a":1,"e":"どこ = onde; いつ = quando; だれ = quem."},{"q":"東京____お土産 (presente de Tóquio) — partícula que liga dois substantivos:","o":["の","を","へ"],"a":0,"e":"A partícula の liga dois substantivos: A の B = \"B de A\"."},{"q":"\"食べて____\" (Coma, por favor.)","o":["ください","ます","です"],"a":0,"e":"Verbo na forma て + ください = pedido educado."},{"q":"水を二____ください。 (Duas — contador para copos/objetos)","o":["つ","本","円"],"a":0,"e":"〜つ é o contador geral: ひとつ, ふたつ, みっつ…"}],"lessons":[{"id":"N5-L1","title":"Lição 1 — Saudações e o verbo です","intro":"A saudação こんにちは (konnichiwa) cobre \"olá / boa tarde\". Ao se apresentar, diz-se はじめまして (\"prazer, é a primeira vez\") e, no fim, どうぞよろしくおねがいします (fórmula de cortesia).\n\nO verbo \"ser\" é です, que vem no fim da frase: 「わたしは マリアです」 = \"Eu sou a Maria\". A partícula は (lida \"wa\") marca o tópico.\n\nPara perguntar, acrescenta-se か no fim: 「これは なんですか」 = \"O que é isto?\". これ = isto (perto de quem fala); それ = isso (perto do ouvinte).","reading":{"title":"会話: はじめまして (Diálogo: prazer em conhecer)","lines":[{"t":"こんにちは。","b":"Olá."},{"t":"はじめまして。田中です。","b":"Prazer. Sou o Tanaka."},{"t":"わたしは マリアです。","b":"Eu sou a Maria."},{"t":"どうぞ よろしく おねがいします。","b":"Muito prazer (conto com você)."},{"t":"これは なんですか。","b":"O que é isto?"},{"t":"それは 本です。","b":"Isso é um livro."}]},"vocab":[{"f":"わたし","b":"eu"},{"f":"名前","b":"nome","r":"なまえ"},{"f":"本","b":"livro","r":"ほん"},{"f":"これ","b":"isto"},{"f":"それ","b":"isso"},{"f":"学生","b":"estudante","r":"がくせい"}],"quiz":[{"q":"\"わたし__ 学生です。\" (tópico)","o":["は","を","が"],"a":0,"e":"は marca o tópico da frase."},{"q":"\"これ__ なんですか。\"","o":["は","を","に"],"a":0,"e":"は marca o tópico também nas perguntas."},{"q":"\"はじめまして\" significa:","o":["Prazer em conhecer","Obrigado","Desculpe"],"a":0,"e":"はじめまして é dito ao conhecer alguém pela primeira vez."}]},{"id":"N5-L2","title":"Lição 2 — Demonstrativos これ・それ・あれ e o lugar どこ","intro":"O japonês agrupa os demonstrativos em famílias que começam por ko-/so-/a-/do-. Para objetos: これ (isto, perto de quem fala), それ (isso, perto de quem ouve), あれ (aquilo, longe dos dois). Para lugares: ここ (aqui), そこ (aí), あそこ (lá) e どこ (onde).\n\nPerguntas de identificação usam なん/なに (o quê): 「これは なんですか」 = \"O que é isto?\". Perguntas de lugar usam どこ: 「トイレは どこですか」 = \"Onde é o banheiro?\".\n\nA partícula の liga dois substantivos, do modificador para o núcleo: 「東京の お土産」 = \"presente de Tóquio\".","reading":{"title":"会話: これ・それ・あれ (Diálogo: isto, isso, aquilo)","lines":[{"t":"これは なんですか。","b":"O que é isto?"},{"t":"それは 日本の お茶です。","b":"Isso é chá japonês."},{"t":"あれは なんですか。","b":"E aquilo, o que é?"},{"t":"あれは 学校です。","b":"Aquilo é uma escola."},{"t":"トイレは どこですか。","b":"Onde é o banheiro?"},{"t":"トイレは あそこです。","b":"O banheiro é lá."}]},"vocab":[{"f":"ここ","b":"aqui"},{"f":"そこ","b":"aí"},{"f":"あそこ","b":"lá (longe)"},{"f":"どこ","b":"onde"},{"f":"なん","b":"o quê","r":"nan"},{"f":"お茶","b":"chá","r":"おちゃ"}],"quiz":[{"q":"それは____ですか。 (O que é isso?)","o":["なん","どこ","だれ"],"a":0,"e":"なん/なに = o quê."},{"q":"Objeto longe dos dois interlocutores:","o":["これ","それ","あれ"],"a":2,"e":"あれ = aquilo (longe)."},{"q":"トイレは ____ です。 (O banheiro é lá.)","o":["あそこ","これ","なん"],"a":0,"e":"あそこ = lá (lugar longe)."}]},{"id":"N5-L3","title":"Lição 3 — Números, contadores e pedidos com 〜てください","intro":"Números de 0 a 10: ゼロ/れい, いち, に, さん, よん/し, ご, ろく, なな/しち, はち, きゅう/く, じゅう. Acima de 10 combina-se: じゅういち (11), にじゅう (20), にじゅういち (21).\n\nContadores mudam conforme o objeto. O contador geral 〜つ (ひとつ, ふたつ, みっつ…) serve para coisas em geral; 〜円 (えん) para dinheiro; 〜まい para folhas/objetos finos.\n\nPara pedir algo educadamente, usa-se o verbo na forma て + ください: 食べる → 食べて → 「食べてください」 (coma, por favor). O padrão 〜を ください pede um objeto: 「水を ください」 (água, por favor).","reading":{"title":"会話: おみせで (Diálogo: na loja)","lines":[{"t":"いらっしゃいませ。","b":"Bem-vindo(a)!"},{"t":"シュークリームを ふたつ ください。","b":"Dois bombons de creme, por favor."},{"t":"はい。ぜんぶで 六百円です。","b":"Certo. No total, 600 ienes."},{"t":"これで おねがいします。","b":"Com isto, por favor."},{"t":"ありがとうございます。","b":"Muito obrigado(a)."}]},"vocab":[{"f":"一つ","b":"um (contador geral)","r":"ひとつ"},{"f":"二つ","b":"dois","r":"ふたつ"},{"f":"三つ","b":"três","r":"みっつ"},{"f":"円","b":"iene","r":"えん"},{"f":"ください","b":"por favor / dê-me"},{"f":"ぜんぶ","b":"tudo, no total"}],"quiz":[{"q":"水を ____ください。 (água, por favor)","o":["を","は","の"],"a":0,"e":"〜を ください pede um objeto."},{"q":"\"20\" em japonês:","o":["じゅうに","にじゅう","にひゃく"],"a":1,"e":"にじゅう = 20 (2×10)."},{"q":"見る na forma de pedido:","o":["見てください","見るください","見ますください"],"a":0,"e":"forma て (見て) + ください."}]}]},{"id":"N4","label":"N4","desc":"Básico — rotina e forma て.","grammar":["forma て (usos)","forma plana (casual) e forma た","potencial 〜られる / 〜ことができる","〜たり〜たり","comparativos 〜より / 〜のほうが / いちばん","〜と思います (opinião)","〜てもいいですか (permissão) / 〜てはいけません (proibição)"],"core":[{"f":"時々","b":"às vezes","ex":"時々歩いて行きます。","exb":"Às vezes vou a pé.","r":"ときどき"},{"f":"天気","b":"tempo (clima)","ex":"今日は天気が悪いです。","exb":"Hoje o tempo está ruim.","r":"てんき"},{"f":"もう","b":"já","ex":"もう着きました。","exb":"Já cheguei.","r":""},{"f":"忙しい","b":"estar ocupado","ex":"今週は忙しいです。","exb":"Esta semana estou ocupado.","r":"いそがしい"},{"f":"旅行","b":"viagem","ex":"来月旅行に行きます。","exb":"Vou viajar no mês que vem.","r":"りょこう"},{"f":"覚える","b":"memorizar / lembrar","ex":"その歌を覚えています。","exb":"Lembro daquela música.","r":"おぼえる"},{"f":"安い","b":"ser barato","ex":"このシャツは安いです。","exb":"Esta camisa é barata.","r":"やすい"},{"f":"説明","b":"explicação","ex":"説明をお願いします。","exb":"Uma explicação, por favor.","r":"せつめい"},{"f":"着く","b":"chegar","ex":"電車が遅く着きました。","exb":"O trem chegou atrasado.","r":"つく"},{"f":"高い","b":"caro / alto","ex":"そのかばんは高いです。","exb":"Aquela bolsa é cara.","r":"たかい"},{"f":"健康","b":"saúde","ex":"健康が一番大切です。","exb":"A saúde é o mais importante.","r":"けんこう"},{"f":"試す","b":"experimentar / tentar","ex":"もう一度試します。","exb":"Vou tentar mais uma vez.","r":"ためす"},{"f":"持って来る","b":"trazer","ex":"傘を持って来ました。","exb":"Trouxe o guarda-chuva.","r":"もってくる"},{"f":"疲れる","b":"cansar","ex":"今日は疲れました。","exb":"Hoje me cansei.","r":"つかれる"},{"f":"十分","b":"suficiente","ex":"時間は十分あります。","exb":"Há tempo suficiente.","r":"じゅうぶん"},{"f":"理由","b":"motivo","ex":"理由を教えてください。","exb":"Diga-me o motivo, por favor.","r":"りゆう"},{"f":"朝","b":"manhã","ex":"毎朝コーヒーを飲みます。","exb":"Bebo café toda manhã.","r":"あさ"},{"f":"道","b":"caminho, rua","ex":"道に迷いました。","exb":"Me perdi no caminho.","r":"みち"},{"f":"信号","b":"semáforo","ex":"次の信号を右に曲がってください。","exb":"Vire à direita no próximo semáforo.","r":"しんごう"},{"f":"約束","b":"promessa, compromisso","ex":"約束を守ります。","exb":"Cumpro a promessa.","r":"やくそく"},{"f":"遅れる","b":"atrasar-se","ex":"電車が遅れました。","exb":"O trem atrasou.","r":"おく(れる)"},{"f":"思う","b":"achar, pensar","ex":"雨だと思います。","exb":"Acho que vai chover.","r":"おも(う)"},{"f":"使う","b":"usar","ex":"辞書を使います。","exb":"Uso o dicionário.","r":"つか(う)"},{"f":"待つ","b":"esperar","ex":"駅で待ちます。","exb":"Espero na estação.","r":"ま(つ)"},{"f":"急ぐ","b":"apressar-se","ex":"急いで帰ります。","exb":"Volto depressa.","r":"いそ(ぐ)"},{"f":"忘れる","b":"esquecer","ex":"名前を忘れました。","exb":"Esqueci o nome.","r":"わす(れる)"},{"f":"柔らかい","b":"macio","ex":"このパンは柔らかいです。","exb":"Este pão é macio.","r":"やわ(らかい)"},{"f":"親切","b":"gentil (adj. な)","ex":"先生は親切です。","exb":"O professor é gentil.","r":"しんせつ"},{"f":"有名","b":"famoso (adj. な)","ex":"この町は有名です。","exb":"Esta cidade é famosa.","r":"ゆうめい"},{"f":"一番","b":"o/a mais, número um","ex":"これが一番おいしいです。","exb":"Este é o mais gostoso.","r":"いちばん"},{"f":"受ける","b":"receber, fazer (prova)","ex":"試験を受けます。","exb":"Faço a prova.","r":"う(ける)"},{"f":"答える","b":"responder","ex":"質問に答えます。","exb":"Respondo à pergunta.","r":"こた(える)"},{"f":"生活","b":"vida (cotidiana)","ex":"日本の生活に慣れました。","exb":"Me acostumei com a vida no Japão.","r":"せいかつ"},{"f":"夢","b":"sonho","ex":"先生になるのが夢です。","exb":"Meu sonho é ser professor.","r":"ゆめ"}],"quiz":[{"q":"Forma て de \"食べる\":","o":["食べて","食べた","食べます"],"a":0,"e":"Verbos ichidan: troca-se る por て."},{"q":"\"日本語が___。\" (Consigo falar japonês)","o":["話せます","話します","話しました"],"a":0,"e":"話せます é a forma potencial de 話す."},{"q":"\"もう\" significa:","o":["ainda","já","nunca"],"a":1,"e":"もう = já (ação concluída)."},{"q":"O que \"〜たり〜たり\" expressa?","o":["ordem estrita","lista de ações representativas","negação"],"a":1,"e":"Lista exemplos de ações, sem ordem fixa."},{"q":"A é mais quente que B: A の ____ が B より あついです。","o":["ほう","こと","とき"],"a":0,"e":"A のほうが B より… = \"A é mais … do que B\"."},{"q":"\"Posso comer?\" 食べて____ですか。","o":["もいい","ください","います"],"a":0,"e":"forma て + もいいですか pede permissão."},{"q":"使う na forma potencial (\"poder usar\"):","o":["使える","使った","使わない"],"a":0,"e":"Verbos do grupo 1: 使う → 使える."},{"q":"\"Acho que ela vem.\" 彼女は来る____。","o":["と思います","てください","ましょう"],"a":0,"e":"forma plana + と思います = \"acho que…\"."},{"q":"\"Não se pode usar.\" 使って____。","o":["はいけません","もいいです","ください"],"a":0,"e":"forma て + はいけません = proibição."}],"lessons":[{"id":"N4-L1","title":"Lição 1 — A forma て e seus usos","intro":"A forma て conecta ações e abre vários padrões úteis. Regras (grupo 1): う/つ/る→って, む/ぶ/ぬ→んで, く→いて, ぐ→いで, す→して; grupo 2: troca 〜ます por て (食べます→食べて); irregulares: する→して, 来る→来て. Exceção: 行く→行って.\n\nUsos principais: (1) 〜てください = pedido; (2) 〜ています = ação em curso (食べています = está comendo); (3) 〜てもいいですか = pedir permissão; (4) 〜てはいけません = proibição; (5) 〜てから = \"depois de\".\n\nA forma て também encadeia ações sucessivas: 「階段を上がって、右に行きます」 = \"suba a escada e vá à direita\".","reading":{"title":"会話: ごみと リサイクル (Diálogo: lixo e reciclagem)","lines":[{"t":"ここに ごみを 捨てても いいですか。","b":"Posso jogar o lixo aqui?"},{"t":"かんは べつの ふくろに 入れて ください。","b":"Coloque as latas em outro saco, por favor."},{"t":"わかりました。","b":"Entendi."},{"t":"それから、ドアを 閉めて ください。","b":"E depois, feche a porta, por favor."},{"t":"はい、いま 閉めて います。","b":"Sim, estou fechando agora."}]},"vocab":[{"f":"捨てる","b":"jogar fora","r":"す(てる)"},{"f":"入れる","b":"colocar dentro","r":"い(れる)"},{"f":"曲がる","b":"virar, dobrar","r":"ま(がる)"},{"f":"上がる","b":"subir","r":"あ(がる)"},{"f":"〜てから","b":"depois de ~"}],"quiz":[{"q":"読む → forma て:","o":["読んで","読って","読いて"],"a":0,"e":"む/ぶ/ぬ → んで."},{"q":"行く → forma て (exceção):","o":["行いて","行って","行きて"],"a":1,"e":"行く é exceção: 行って."},{"q":"\"está dormindo\" 寝て____","o":["います","ください","から"],"a":0,"e":"〜ています = ação em curso."}]},{"id":"N4-L2","title":"Lição 2 — Comparações: 〜より, 〜のほうが e いちばん","intro":"Para comparar duas coisas, usa-se A のほうが B より + adjetivo: 「タイのほうが 日本より あついです」 = \"a Tailândia é mais quente que o Japão\". Também vale A は B より…: 「タイは 日本より あついです」.\n\nPara perguntar entre duas opções: A と B と どちらが + adjetivo + ですか — 「ふとんと ベッドと どちらが すきですか」 (de qual você gosta mais?).\n\nCom três ou mais itens, o superlativo é いちばん (o/a mais): 「これが いちばん おいしいです」. Nas perguntas, muda a palavra interrogativa: どれが / どこが / なにが + いちばん…?","reading":{"title":"会話: どちらが すき？ (Diálogo: de qual você gosta mais?)","lines":[{"t":"ふとんと ベッドと どちらが すきですか。","b":"Entre futon e cama, de qual você gosta mais?"},{"t":"ふとんの ほうが すきです。","b":"Gosto mais do futon."},{"t":"ベッドより やわらかいですか。","b":"É mais macio que a cama?"},{"t":"はい。でも、ベッドの ほうが たかいです。","b":"Sim. Mas a cama é mais cara."},{"t":"じゃ、どれが いちばん いいですか。","b":"Então, qual é o melhor de todos?"}]},"vocab":[{"f":"〜より","b":"do que ~"},{"f":"〜のほうが","b":"~ é mais…"},{"f":"どちら","b":"qual (entre dois)"},{"f":"いちばん","b":"o/a mais","r":"一番"},{"f":"柔らかい","b":"macio","r":"やわ(らかい)"}],"quiz":[{"q":"A é mais barato que B: A は B ____ やすいです。","o":["より","のほうが","から"],"a":0,"e":"B より = \"do que B\"."},{"q":"Superlativo (\"o mais gostoso\"): ____ おいしい","o":["いちばん","より","どちら"],"a":0,"e":"いちばん + adjetivo = superlativo."},{"q":"Perguntar entre duas coisas: A と B と ____ が すきですか","o":["どちら","いちばん","どこ"],"a":0,"e":"どちら = qual (entre dois)."}]},{"id":"N4-L3","title":"Lição 3 — Forma potencial e 〜ことができる","intro":"A forma potencial expressa capacidade (\"conseguir/poder fazer\"). Grupo 1: troca a última sílaba -u pela linha -e + る: 使う→使える, 読む→読める, 行く→行ける. Grupo 2: 〜ます→られる (食べます→食べられる, 見ます→見られる). Irregulares: する→できる, 来る→来られる.\n\nO mesmo sentido pode ser dado com a forma do dicionário + ことができる: 「私は 行く ことができます」 = 「私は 行けます」 (\"eu consigo ir\").\n\nPara transformar um verbo em substantivo, acrescenta-se の (ou こと) à forma plana: 「先生に なるのが 夢です」 = \"meu sonho é me tornar professor\".","reading":{"title":"会話: できますか (Diálogo: você consegue?)","lines":[{"t":"クレジットカードは 使えますか。","b":"Dá para usar cartão de crédito?"},{"t":"はい、使えます。","b":"Sim, dá."},{"t":"日本語で はなす ことが できますか。","b":"Você consegue falar em japonês?"},{"t":"すこし はなせます。","b":"Consigo falar um pouco."},{"t":"よかった。","b":"Que bom."}]},"vocab":[{"f":"〜ことができる","b":"conseguir/poder ~"},{"f":"できる","b":"conseguir, ser possível"},{"f":"話す","b":"falar","r":"はな(す)"},{"f":"〜になる","b":"tornar-se ~"},{"f":"クレジットカード","b":"cartão de crédito"}],"quiz":[{"q":"読む → forma potencial (\"poder ler\"):","o":["読める","読んで","読まない"],"a":0,"e":"grupo 1: 読む→読める."},{"q":"する → potencial:","o":["できる","した","しる"],"a":0,"e":"する é irregular: できる."},{"q":"\"Consigo ir.\" 行く ____ ができます。","o":["こと","の","から"],"a":0,"e":"forma do dicionário + ことができる."}]}]},{"id":"N3","label":"N3","desc":"Intermediário.","grammar":["passiva 〜られる","causativo 〜させる","condicionais と / ば / たら / なら","〜そうだ"],"core":[{"f":"助言","b":"conselho","ex":"いい助言をもらいました。","exb":"Recebi um bom conselho.","r":"じょげん"},{"f":"改善","b":"melhoria","ex":"発音を改善したいです。","exb":"Quero melhorar a pronúncia.","r":"かいぜん"},{"f":"環境","b":"meio ambiente","ex":"環境を守るべきです。","exb":"Devemos proteger o meio ambiente.","r":"かんきょう"},{"f":"可能","b":"possível","ex":"明日も可能ですか。","exb":"Amanhã também é possível?","r":"かのう"},{"f":"しかし","b":"porém","ex":"しかし、結果は違いました。","exb":"Porém, o resultado foi diferente.","r":""},{"f":"経験","b":"experiência","ex":"いい経験でした。","exb":"Foi uma boa experiência.","r":"けいけん"},{"f":"必要","b":"necessário","ex":"練習が必要です。","exb":"É preciso praticar.","r":"ひつよう"},{"f":"準備","b":"preparação","ex":"試験の準備をしています。","exb":"Estou me preparando para a prova.","r":"じゅんび"},{"f":"能力","b":"habilidade","ex":"能力を伸ばしています。","exb":"Estou desenvolvendo minhas habilidades.","r":"のうりょく"},{"f":"提案","b":"proposta","ex":"別の方法を提案しました。","exb":"Propus outro método.","r":"ていあん"},{"f":"避ける","b":"evitar","ex":"失敗を避けたいです。","exb":"Quero evitar erros.","r":"さける"},{"f":"目的","b":"propósito","ex":"旅行の目的は何ですか。","exb":"Qual é o propósito da viagem?","r":"もくてき"},{"f":"達する","b":"alcançar","ex":"目標に達しました。","exb":"Alcancei a meta.","r":"たっする"},{"f":"問題","b":"problema","ex":"問題が起きました。","exb":"Surgiu um problema.","r":"もんだい"},{"f":"信頼","b":"confiança","ex":"信頼が大切です。","exb":"A confiança é importante.","r":"しんらい"},{"f":"努力","b":"esforço","ex":"努力すれば、できます。","exb":"Se você se esforçar, consegue.","r":"どりょく"}],"quiz":[{"q":"Passiva de \"見る\":","o":["見られる","見せる","見ている"],"a":0,"e":"見られる é a forma passiva (e também potencial)."},{"q":"Causativo de \"行く\":","o":["行かせる","行かれる","行ける"],"a":0,"e":"〜せる/させる forma o causativo."},{"q":"\"時間があれば、行きます。\" O que ば expressa?","o":["condição","razão","ordem"],"a":0,"e":"〜ば forma a condicional \"se\"."},{"q":"\"雨が降りそうです\" significa:","o":["Choveu","Parece que vai chover","Não vai chover"],"a":1,"e":"〜そうだ (aparência) indica que algo parece prestes a acontecer."}],"lessons":[{"id":"N3-L1","title":"Leitura N3 — Contar experiências e fazer duas coisas ao mesmo tempo","intro":"No N3 você começa a ligar ideias e dar matiz às frases. Três estruturas úteis:\n\n1) 〜ながら (enquanto): liga a raiz-ます de um verbo a outra ação simultânea — 「音楽を ききながら 本を 読みます」 = \"leio livros enquanto ouço música\".\n\n2) 〜た ことが あります (já fiz alguma vez): usa a forma た + ことが あります para experiências — 「京都に 行った ことが あります」 = \"já fui a Kyoto\".\n\n3) 〜んです (é que…): dá ou pede explicação e soa mais natural na fala — 「行きたいんです」 = \"é que eu quero ir\". Adjetivos ligam-se com 〜くて: 「おおくて きれい」 = \"tem muitos e é bonito\".","reading":{"title":"会話: しゅうまつ (Diálogo: o fim de semana)","lines":[{"t":"しゅうまつ、なにを しますか。","b":"O que você faz no fim de semana?"},{"t":"音楽を ききながら 本を 読みます。","b":"Leio livros enquanto ouço música."},{"t":"いいですね。わたしは 京都に 行った ことが あります。","b":"Que legal. Eu já fui a Kyoto."},{"t":"どうでしたか。","b":"Como foi?"},{"t":"お寺が おおくて、とても きれいでした。","b":"Tinha muitos templos e era muito bonito."},{"t":"わたしも 行きたいんです。","b":"É que eu também quero ir."},{"t":"じゃ、こんど いっしょに 行きましょう。","b":"Então, da próxima vez vamos juntos."}]},"vocab":[{"f":"〜ながら","b":"enquanto (ação simultânea)"},{"f":"〜たことがある","b":"já ter feito (experiência)"},{"f":"〜んです","b":"é que… (explicação/ênfase)"},{"f":"お寺","b":"templo","r":"おてら"},{"f":"こんど","b":"da próxima vez / desta vez"}],"quiz":[{"q":"\"Leio enquanto ouço música\": 音楽を きき____ 読みます。","o":["ながら","たり","ので"],"a":0,"e":"〜ながら liga duas ações simultâneas."},{"q":"\"Já fui a Kyoto\": 京都に 行った ____ あります。","o":["ことが","ものが","のが"],"a":0,"e":"〜たことがあります = experiência."},{"q":"\"É que eu quero ir\" (fala natural):","o":["行きたいんです","行きます","行きました"],"a":0,"e":"〜んです dá o tom de explicação."}]}]},{"id":"N2","label":"N2","desc":"Intermediário-alto.","grammar":["keigo (linguagem formal)","〜わけだ / 〜はずだ","〜において / 〜に関して","causa e efeito"],"core":[{"f":"達成","b":"realização / conquista","ex":"目標を達成しました。","exb":"Alcancei o objetivo.","r":"たっせい"},{"f":"克服","b":"superação","ex":"困難を克服しました。","exb":"Superei as dificuldades.","r":"こくふく"},{"f":"詳しい","b":"detalhado","ex":"詳しい説明が必要です。","exb":"É preciso uma explicação detalhada.","r":"くわしい"},{"f":"影響","b":"influência","ex":"天気が気分に影響します。","exb":"O tempo influencia o humor.","r":"えいきょう"},{"f":"傾向","b":"tendência","ex":"そういう傾向があります。","exb":"Há essa tendência.","r":"けいこう"},{"f":"解決","b":"solução","ex":"問題を解決しました。","exb":"Resolvi o problema.","r":"かいけつ"},{"f":"状況","b":"situação","ex":"状況が複雑です。","exb":"A situação é complicada.","r":"じょうきょう"},{"f":"判断","b":"julgamento","ex":"判断が早かったです。","exb":"O julgamento foi rápido.","r":"はんだん"},{"f":"認める","b":"reconhecer / admitir","ex":"失敗を認めました。","exb":"Admiti o erro.","r":"みとめる"},{"f":"結果","b":"resultado","ex":"結果は良かったです。","exb":"O resultado foi bom.","r":"けっか"},{"f":"強調","b":"ênfase","ex":"安全を強調しました。","exb":"Enfatizei a segurança.","r":"きょうちょう"},{"f":"評価","b":"avaliação","ex":"成果を評価します。","exb":"Avaliamos o desempenho.","r":"ひょうか"},{"f":"持続可能","b":"sustentável","ex":"持続可能な方法を探します。","exb":"Procuramos um método sustentável.","r":"じぞくかのう"},{"f":"枠組み","b":"arcabouço","ex":"明確な枠組みに従います。","exb":"Seguimos um arcabouço claro.","r":"わくぐみ"},{"f":"偏り","b":"viés","ex":"データに偏りがあります。","exb":"Há viés nos dados.","r":"かたより"},{"f":"広範","b":"amplo","ex":"広範な調査が行われました。","exb":"Foi feita uma investigação ampla.","r":"こうはん"}],"quiz":[{"q":"Keigo humilde de \"言う\":","o":["申します","おっしゃいます","言われます"],"a":0,"e":"申します é a forma humilde (謙譲語)."},{"q":"\"来るはずです\" significa:","o":["Deve vir (expectativa)","Não virá","Talvez venha"],"a":0,"e":"〜はずだ indica expectativa fundamentada."},{"q":"\"この件___、説明します。\" (a respeito deste assunto)","o":["に関して","によって","にとって"],"a":0,"e":"〜に関して = a respeito de, quanto a."},{"q":"\"影響\" significa:","o":["resultado","influência","tendência"],"a":1,"e":"影響 = influência, efeito."}],"lessons":[{"id":"N2-L1","title":"Leitura N2 — Condição, mudança gradual e o que dizem","intro":"O N2 trabalha nuances de condição e de informação de terceiros:\n\n1) 〜ば (se): condicional — 「練習すれば 話せる ように なります」 = \"se praticar, passa a conseguir falar\".\n\n2) 〜ように なる (passar a): marca uma mudança de estado/capacidade — 「食べられる ように なった」 = \"passei a conseguir comer\".\n\n3) 〜そうです / 〜に よると (dizem que / segundo): relata informação de fonte externa — 「ニュースに よると 雨だ そうです」 = \"segundo as notícias, dizem que vai chover\". Obrigação: 〜なければ なりません = \"precisar\".","reading":{"title":"会話: 上達 (Diálogo: progresso)","lines":[{"t":"日本語が 上手に なりましたね。","b":"Você ficou bom em japonês, hein."},{"t":"毎日 練習すれば、だれでも 話せる ように なります。","b":"Se praticar todo dia, qualquer um passa a conseguir falar."},{"t":"そうですか。がんばります。","b":"É mesmo? Vou me esforçar."},{"t":"ニュースに よると、来月 試験が あるそうです。","b":"Segundo as notícias, dizem que mês que vem tem uma prova."},{"t":"じゃ、いまから 準備しなければ なりませんね。","b":"Então preciso começar a me preparar desde já, né."}]},"vocab":[{"f":"〜ば","b":"se (condicional)"},{"f":"〜ようになる","b":"passar a (mudança)"},{"f":"〜によると","b":"segundo…"},{"f":"〜そうだ","b":"dizem que…"},{"f":"準備する","b":"preparar-se","r":"じゅんびする"}],"quiz":[{"q":"\"Se praticar, consegue\": 練習____、話せます。","o":["すれば","して","した"],"a":0,"e":"〜ば = condicional \"se\"."},{"q":"\"Passei a conseguir falar\": 話せる ____ なりました。","o":["ように","ことに","ために"],"a":0,"e":"〜ようになる = mudança de estado."},{"q":"\"Segundo as notícias…\": ニュース____","o":["によると","のように","のあいだ"],"a":0,"e":"〜によると introduz a fonte."}]}]},{"id":"N1","label":"N1","desc":"Avançado — japonês formal e escrito.","grammar":["expressões formais escritas","〜ものの / 〜ながらも","〜をもって / 〜に至る","estrutura textual avançada"],"core":[{"f":"洞察","b":"perspicácia","ex":"深い洞察が含まれています。","exb":"Contém uma percepção profunda.","r":"どうさつ"},{"f":"緩和","b":"atenuação","ex":"規制を緩和しました。","exb":"Flexibilizaram a regulamentação.","r":"かんわ"},{"f":"普及","b":"difusão","ex":"情報の普及が速いです。","exb":"A difusão da informação é rápida.","r":"ふきゅう"},{"f":"微妙","b":"sutil","ex":"微妙な違いがあります。","exb":"Há uma diferença sutil.","r":"びみょう"},{"f":"曖昧","b":"ambíguo","ex":"表現が曖昧です。","exb":"A expressão é ambígua.","r":"あいまい"},{"f":"顕著","b":"notável","ex":"顕著な差があります。","exb":"Há uma diferença notável.","r":"けんちょ"},{"f":"率直","b":"franco","ex":"彼の率直さに感心しました。","exb":"Admirei a franqueza dele.","r":"そっちょく"},{"f":"妥当","b":"apropriado / plausível","ex":"妥当な理由です。","exb":"É uma razão plausível.","r":"だとう"},{"f":"本質","b":"essência","ex":"問題の本質を見るべきです。","exb":"É preciso ver a essência do problema.","r":"ほんしつ"},{"f":"暗黙","b":"tácito","ex":"暗黙の了解でした。","exb":"Foi um consentimento tácito.","r":"あんもく"},{"f":"精緻","b":"minucioso / refinado","ex":"精緻な分析です。","exb":"É uma análise refinada.","r":"せいち"},{"f":"根拠","b":"fundamento","ex":"根拠が不足しています。","exb":"Falta fundamento.","r":"こんきょ"},{"f":"矛盾","b":"contradição","ex":"主張に矛盾があります。","exb":"Há contradição no argumento.","r":"むじゅん"},{"f":"是正","b":"correção","ex":"誤りを是正しました。","exb":"Corrigiu o erro.","r":"ぜせい"},{"f":"浸透","b":"permeação","ex":"文化が日常に浸透しました。","exb":"A cultura permeou o cotidiano.","r":"しんとう"},{"f":"逸脱","b":"desvio","ex":"規範からの逸脱です。","exb":"É um desvio da norma.","r":"いつだつ"}],"quiz":[{"q":"\"努力したものの、失敗した\" O que ものの expressa?","o":["causa","concessão (embora)","condição"],"a":1,"e":"〜ものの = embora, ainda que."},{"q":"\"曖昧\" significa:","o":["claro","ambíguo","rápido"],"a":1,"e":"曖昧 = ambíguo, impreciso."},{"q":"\"暗黙\" quer dizer:","o":["explícito","tácito","urgente"],"a":1,"e":"暗黙 = tácito, subentendido."},{"q":"\"矛盾\" significa:","o":["harmonia","contradição","fundamento"],"a":1,"e":"矛盾 = contradição."}],"lessons":[{"id":"N1-L1","title":"Leitura N1 — Registro escrito e nuances de contraste","intro":"No N1 aparecem estruturas do japonês escrito/formal e matizes finos. Repare que a leitura abaixo usa o registro だ/である (típico de textos), não です/ます.\n\n1) 〜わけではない (não é que): nega uma conclusão esperada — 「かんたんな わけではない」 = \"não é que seja fácil\".\n\n2) 〜にも かかわらず (apesar de): contraste forte — 「忙しいにも かかわらず」 = \"apesar de estar ocupado\".\n\n3) 〜つつ ある (estar em processo de): mudança em curso — 「変わりつつ ある」 = \"está mudando (aos poucos)\".","reading":{"title":"読み物: ことばを 学ぶ こと (Texto: aprender uma língua)","lines":[{"t":"日本語の 勉強は かんたんな わけではない。","b":"Estudar japonês não é que seja fácil."},{"t":"しかし、続ければ かならず 上達する。","b":"Contudo, se continuar, com certeza se progride."},{"t":"忙しいにも かかわらず、彼は 毎日 本を 読んでいる。","b":"Apesar de ocupado, ele lê livros todos os dias."},{"t":"世界は 少しずつ 変わりつつ ある。","b":"O mundo está mudando aos poucos."},{"t":"言葉を 学ぶ ことは、文化を 知る ことでも ある。","b":"Aprender uma língua é também conhecer uma cultura."}]},"vocab":[{"f":"〜わけではない","b":"não é que…"},{"f":"〜にもかかわらず","b":"apesar de…"},{"f":"〜つつある","b":"estar em processo de…"},{"f":"上達する","b":"progredir (numa habilidade)","r":"じょうたつする"},{"f":"文化","b":"cultura","r":"ぶんか"}],"quiz":[{"q":"\"Não é que seja fácil\": かんたんな ____","o":["わけではない","からではない","ものではない"],"a":0,"e":"〜わけではない nega a conclusão esperada."},{"q":"\"Apesar de ocupado\": 忙しい____","o":["にもかかわらず","によると","のように"],"a":0,"e":"〜にもかかわらず = contraste \"apesar de\"."},{"q":
